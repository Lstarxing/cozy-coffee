<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>产区探索 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F5F3; color:#2B1E16;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --glaze-green:#526C43; --glaze-green-soft:#E8EDE5;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:14px;
    font-size:26px; line-height:1;
    color:var(--roastery-ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 20px 120px; }

  /* ── 世界产区地图 ── */
  .map-section {
    border-radius:14px; overflow:hidden;
    background:var(--cask-brown);
  }
  .map-image {
    display:block; width:100%;
    background:var(--cask-brown);
  }
  .map-label {
    display:block; padding:16px 20px 20px;
    font-size:13px; letter-spacing:.06em;
    color:rgba(255,255,255,.65); text-align:center;
  }

  /* ── 产区详情卡片 ── */
  .origins-list { padding:8px 0; }
  .origin-card { padding:32px 0 48px; }
  .card-rule {
    width:80px; height:3px; background:var(--hairline);
    margin-top:8px;
  }
  .card-rule--hz { width:120px; }
  .card-counter {
    display:block;
    font-size:12px; letter-spacing:.06em; color:var(--quiet-ink);
    margin-bottom:20px;
  }
  .card-name {
    display:block;
    font-family:var(--serif); font-size:30px; font-weight:600;
    color:var(--roastery-ink); line-height:1.15;
  }
  .card-region {
    display:block; margin-top:10px;
    font-size:15px; font-weight:650; color:var(--roast-brown);
  }
  .section-rule {
    width:48px; height:2px; margin-top:20px;
    background:var(--hairline);
  }
  .card-story {
    display:block; margin-top:24px;
    font-size:14px; line-height:1.8; color:var(--quiet-ink);
  }
  .facts-rule {
    width:56px; height:2px; margin-top:28px;
    background:var(--hairline);
  }
  .card-facts {
    display:grid; grid-template-columns:1fr 1fr; gap:18px 24px;
    margin-top:28px;
  }
  .fact-label {
    display:block; font-size:12px; color:var(--placeholder);
  }
  .fact-value {
    display:block; margin-top:6px;
    font-size:13px; color:var(--roastery-ink);
  }
  .fact-role .fact-value { color:var(--roast-brown); font-weight:700; }
  .card-flavors {
    display:flex; flex-wrap:wrap; gap:8px; margin-top:24px;
  }
  .flavor-tag {
    padding:6px 12px; border-radius:6px;
    background:var(--porcelain-muted); color:var(--roastery-ink);
    font-size:12px;
  }
  .card-route {
    display:block; margin-top:24px;
    font-size:13px; font-weight:600; color:var(--roast-brown);
  }
  .card-roastery { display:flex; gap:12px 28px; margin-top:28px; }
  .roastery-step {
    font-size:14px; font-weight:650; color:var(--roastery-ink);
  }
  .roastery-step:not(:last-child)::after {
    content:' →'; color:var(--quiet-ink); margin-left:28px;
  }
</style>
</head>
<body>

<div class="page">
  <a class="back-btn" onclick="goBack('index.html')">‹</a>

  <!-- 世界产区地图 -->
  <div class="map-section">
    <img class="map-image" src="../src/static/images/origin-map.png" alt="世界咖啡产区图">
    <span class="map-label">世界产区汇聚杭州</span>
  </div>

  <!-- 产区详情 -->
  <div class="origins-list" id="originsList"></div>
</div>

<script>
  const origins = [
    {
      en: 'Ethiopia', name: '埃塞俄比亚', region: '耶加雪菲与西达摩',
      altitude: '1,800–2,200 m', process: '水洗 / 日晒',
      varieties: ['Heirloom'], role: '花香层次',
      flavors: ['茉莉', '蓝莓', '柑橘', '红茶'],
      story: '被视为阿拉比卡咖啡的故乡，丰富的遗传多样性让花香、果香与茶感自然并存。'
    },
    {
      en: 'Kenya', name: '肯尼亚', region: '涅里与基里尼亚加',
      altitude: '1,500–2,100 m', process: '双重水洗',
      varieties: ['SL28', 'SL34'], role: '莓果骨架',
      flavors: ['黑加仑', '莓果', '葡萄柚', '酒香'],
      story: '高海拔与双重水洗塑造鲜明酸质，为拼配提供清晰、明亮而有张力的果香骨架。'
    },
    {
      en: 'Brazil', name: '巴西', region: '米纳斯吉拉斯',
      altitude: '900–1,300 m', process: '日晒 / 半日晒',
      varieties: ['Catuai', 'Mundo Novo'], role: '浓缩基底',
      flavors: ['坚果', '巧克力', '焦糖', '低酸'],
      story: '稳定的坚果、可可与焦糖甜感构成浓缩基底，让杯中结构保持醇厚与平衡。'
    },
    {
      en: 'Colombia', name: '哥伦比亚', region: '安第斯山脉',
      altitude: '1,200–2,000 m', process: '水洗',
      varieties: ['Caturra', 'Castillo'], role: '平衡主体',
      flavors: ['焦糖', '红莓', '坚果', '平衡酸质'],
      story: '安第斯山脉的多样微气候把甜感与酸质放在同一条清晰的风味轴线上。'
    },
    {
      en: 'Guatemala', name: '危地马拉', region: '安提瓜火山产区',
      altitude: '1,300–2,000 m', process: '水洗',
      varieties: ['Bourbon', 'Caturra'], role: '香料层次',
      flavors: ['黑巧克力', '香料', '坚果', '柑橘'],
      story: '火山土壤与昼夜温差积累出扎实甜感，并在尾韵中留下细致的香料层次。'
    },
    {
      en: 'Panama', name: '巴拿马', region: '波奎特',
      altitude: '1,500–2,100 m', process: '水洗 / 日晒',
      varieties: ['Geisha'], role: '芳香高点',
      flavors: ['茉莉', '佛手柑', '热带水果', '蜂蜜'],
      story: '瑰夏把花香、柑橘与蜂蜜般甜感推向高点，为风味体系带来轻盈而明确的芳香记忆。'
    },
    {
      en: 'Indonesia', name: '印度尼西亚', region: '苏门答腊',
      altitude: '1,200–1,700 m', process: '湿刨',
      varieties: ['Ateng', 'Tim Tim'], role: '醇厚深度',
      flavors: ['草本', '香料', '黑巧克力', '醇厚'],
      story: '湿刨处理带来低沉香料感与厚重质地，为明亮风味补上深度与余韵。'
    },
    {
      en: 'Yunnan, China', name: '中国云南', region: '保山与普洱',
      altitude: '1,200–1,900 m', process: '水洗 / 日晒',
      varieties: ['Catimor'], role: '东方表达',
      flavors: ['坚果', '焦糖', '红茶', '柑橘'],
      story: '高原季风与不断进步的处理实验，让云南成为 Cozy Coffee 风味语言中的东方表达。'
    }
  ];

  const hangzhou = {
    en: 'HANGZHOU', name: '杭州', region: 'Cozy Coffee Roastery',
    story: '世界八处产区，最终在杭州完成属于 Cozy Coffee 的风味语言。',
    steps: ['Roasting', 'Blending', 'Cup']
  };

  function pad(n) { return String(n).padStart(2, '0'); }

  document.getElementById('originsList').innerHTML =
    origins.map((o, i) => `
      <div class="card-rule"></div>
      <div class="origin-card">
        <span class="card-counter">${pad(i + 1)} / 08 · ${o.en}</span>
        <span class="card-name">${o.name}</span>
        <span class="card-region">${o.region}</span>
        <div class="section-rule"></div>
        <span class="card-story">${o.story}</span>
        <div class="facts-rule"></div>
        <div class="card-facts">
          <div class="fact"><span class="fact-label">海拔</span><span class="fact-value">${o.altitude}</span></div>
          <div class="fact"><span class="fact-label">处理法</span><span class="fact-value">${o.process}</span></div>
          <div class="fact"><span class="fact-label">品种</span><span class="fact-value">${o.varieties.join(' · ')}</span></div>
          <div class="fact fact-role"><span class="fact-label">风味角色</span><span class="fact-value">${o.role}</span></div>
        </div>
        <div class="card-flavors">${o.flavors.map(f => `<span class="flavor-tag">${f}</span>`).join('')}</div>
        <span class="card-route">${o.name} → 杭州烘焙中心</span>
      </div>
    `).join('') + `
      <div class="card-rule card-rule--hz"></div>
      <div class="origin-card">
        <span class="card-counter">09 / 09 · ${hangzhou.en}</span>
        <span class="card-name">${hangzhou.name}</span>
        <span class="card-region">${hangzhou.region}</span>
        <span class="card-story">${hangzhou.story}</span>
        <div class="card-roastery">${hangzhou.steps.map(s => `<span class="roastery-step">${s}</span>`).join('')}</div>
      </div>
    `;
  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }
</script>
</body>
</html>
