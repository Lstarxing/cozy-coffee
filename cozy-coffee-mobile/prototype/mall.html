<!DOCTYPE html>
<html lang="zh-CN">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --ink:#2C2723; --muted:#8B8178; --primary:#753A22; --accent:#526C43;
    --surface:#F7F3EE; --card:#FFFFFF; --border:#E3DED8;
    --gold:#C69C6D; --danger:#9B3932;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ═══════════════════════════════════════
     积分头
     ═══════════════════════════════════════ */
  .points-header {
    padding:28px 24px 16px;
    background:var(--surface);
  }
  .points-label {
    display:block;
    font-size:13px; color:var(--muted); letter-spacing:.04em;
  }
  .points-value {
    display:block; margin-top:8px;
    font-family:var(--serif); font-size:46px; font-weight:600;
    color:var(--ink); line-height:1;
  }

  /* ═══════════════════════════════════════
     文字快捷链接
     ═══════════════════════════════════════ */
  .quick-links {
    display:flex; align-items:center;
    padding:16px 24px 22px;
    background:var(--surface);
  }
  .quick-link {
    flex:1; text-align:center;
    font-size:13px; color:var(--ink); cursor:pointer;
    letter-spacing:.04em;
  }
  .quick-link:active { opacity:.6; }
  .quick-divider {
    width:1px; height:13px; background:var(--border);
  }

  /* ═══════════════════════════════════════
     分类 Tab
     ═══════════════════════════════════════ */
  .mall-tabs {
    display:flex;
    margin:12px 20px 0; padding:0 4px;
    border-bottom:1px solid var(--border);
  }
  .mall-tab {
    flex:1; padding:14px 0;
    text-align:center;
    font-size:15px; color:var(--muted);
    cursor:pointer;
    position:relative;
    transition:color .25s;
  }
  .mall-tab.active { color:var(--ink); font-weight:600; }
  .mall-tab.active::after {
    content:''; position:absolute;
    left:50%; bottom:-1px; transform:translateX(-50%);
    width:24px; height:2px;
    background:var(--ink);
  }

  /* ═══════════════════════════════════════
     商品网格
     ═══════════════════════════════════════ */
  .products-grid {
    margin:16px 20px 0;
    display:grid; grid-template-columns:1fr 1fr; gap:16px 14px;
    padding-bottom:48px;
  }
  .product-card { cursor:pointer; }
  .product-card:active .product-image { transform:scale(.98); }
  .product-image {
    position:relative;
    width:100%; aspect-ratio:1/1;
    border-radius:8px;
    overflow:hidden;
    transition:transform .25s;
  }
  .product-image svg {
    width:62%; height:62%; color:rgba(255,255,255,.92);
  }
  .product-info { padding:12px 2px 0; }
  .product-name {
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    font-family:var(--serif); font-size:14px; font-weight:600;
    color:var(--ink); line-height:1.4;
  }
  .product-points {
    display:flex; align-items:baseline; gap:3px;
    margin-top:8px;
  }
  .points-num { font-size:17px; font-weight:700; color:var(--primary); }
  .points-unit { font-size:11px; color:var(--muted); }

  /* ═══════════════════════════════════════
     详情覆盖层
     ═══════════════════════════════════════ */
  .detail-page {
    position:fixed; inset:0;
    background:#fff; z-index:50;
    overflow-y:auto;
    transform:translateX(100%);
    transition:transform .35s cubic-bezier(.32,.72,.32,1);
  }
  .detail-page.open { transform:translateX(0); }
  .detail-back {
    position:fixed; top:14px; left:14px;
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    font-size:28px; line-height:1;
    color:var(--ink); cursor:pointer;
    z-index:2;
  }

  .detail-image-area {
    padding:60px 32px 24px;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-image {
    width:240px; height:240px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .detail-image svg {
    width:65%; height:65%; color:rgba(255,255,255,.95);
  }

  .detail-head {
    padding:0 24px 22px;
    border-bottom:1px solid var(--border);
  }
  .detail-name {
    display:block;
    font-family:var(--serif); font-size:22px; font-weight:600;
    color:var(--ink); line-height:1.3;
  }
  .detail-tags {
    margin-top:14px;
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .tag {
    display:inline-block; padding:5px 11px;
    font-size:11px;
    border:1px solid var(--ink);
    color:var(--ink);
    border-radius:2px;
    letter-spacing:.02em;
  }
  .tag--limit {
    border-color:var(--danger);
    color:var(--danger);
  }

  /* ── 补充信息 ── */
  .detail-sections { padding:0 24px; }
  .detail-section {
    padding:18px 0;
    border-bottom:1px solid var(--border);
  }
  .detail-section:last-child { border-bottom:0; }
  .section-label {
    display:block;
    font-size:14px; font-weight:600;
    color:var(--ink);
  }
  .section-value {
    display:block; margin-top:8px;
    font-size:13px; line-height:1.7;
    color:var(--muted);
  }

  /* ── 底部 CTA ── */
  .detail-cta-wrap {
    padding:20px 24px 32px;
    background:#fff;
    margin-top:8px;
  }
  .detail-cta {
    height:48px;
    display:flex; align-items:center; justify-content:center;
    background:var(--primary); color:#fff;
    font-size:15px; font-weight:600;
    border-radius:24px;
    cursor:pointer;
    transition:opacity .2s;
  }
  .detail-cta:active { opacity:.85; }
  .detail-cta.disabled {
    background:var(--border); color:var(--muted); cursor:not-allowed;
  }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>

      productType: '实体周边 · 礼品',
      validity: '兑换后 14 天内发货',
      deduction: '10 包挂耳 · 4 种产地 · 礼盒装',
      stores: '到店自提 · 包邮到家',
      scenarios: '到店自提 · 邮寄到家',
      notes: '高单价目标，维持积分含金量，适合送礼',
      intro: '10 包精选挂耳，4 种产地甄选，节日送礼首选。'
    }
  ];

  // ── 渲染 ──
  function renderProducts(type) {
    const list = type === 'all' ? products : products.filter(p => p.type === type);
    const grid = document.getElementById('productGrid');
    grid.innerHTML = list.map(p => `
      <div class="product-card" onclick="openDetail('${p.id}')">
        <div class="product-image" style="background:${p.gradient};">
          ${ICONS[p.icon]}
        </div>
        <div class="product-info">
          <span class="product-name">${p.name}</span>
          <div class="product-points">
            <span class="points-num">${p.points}</span>
            <span class="points-unit">积分</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── Tab ──
  function switchTab(el) {
    document.querySelectorAll('.mall-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderProducts(el.dataset.type);
  }

  // ── 详情 ──
  let currentId = null;
  function openDetail(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    currentId = id;

    document.getElementById('detailName').textContent = p.name;
    document.getElementById('detailMember').textContent = p.member;
    document.getElementById('detailLimit').textContent = p.limit;
    document.getElementById('detailType').textContent = p.productType;
    document.getElementById('detailValidity').textContent = p.validity;
    document.getElementById('detailDeduction').textContent = p.deduction;
    document.getElementById('detailStores').textContent = p.stores;
    document.getElementById('detailScenarios').textContent = p.scenarios;
    document.getElementById('detailNotes').textContent = p.notes;
    document.getElementById('detailIntro').textContent = p.intro;

    document.getElementById('detailImage').style.background = p.gradient;
    document.getElementById('detailImage').innerHTML = ICONS[p.icon];

    const cta = document.getElementById('detailCta');
    if (CURRENT_POINTS >= p.points) {
      cta.classList.remove('disabled');
      cta.textContent = `立即兑换 · ${p.points} 积分`;
    } else {
      cta.classList.add('disabled');
      cta.textContent = `积分不足 · 还差 ${(p.points - CURRENT_POINTS).toLocaleString()} 积分`;
    }

    document.getElementById('detailPage').classList.add('open');
  }

  function closeDetail() {
    document.getElementById('detailPage').classList.remove('open');
    currentId = null;
  }

  function redeem() {
    if (!currentId) return;
    const p = products.find(x => x.id === currentId);
    if (!p || CURRENT_POINTS < p.points) {
      toast('积分不足');
      return;
    }
    toast(`已兑换 ${p.name} · ${p.points} 积分`);
    setTimeout(closeDetail, 800);
  }

  // ── Toast ──
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }

  // 初始化
  renderProducts('all');
</script>
</body>
</html>
