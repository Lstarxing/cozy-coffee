<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>积分商城 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --ink:#2C2723; --muted:#8B8178; --primary:#753A22; --accent:#526C43;
    --surface:#F7F3EE; --card:#FFFFFF; --border:#E3DED8;
    --gold:#C69C6D; --danger:#9B3932;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ═══════════════════════════════════════
     积分头
     ═══════════════════════════════════════ */
  .points-header {
    padding:28px 24px 16px;
    background:var(--surface);
  }
  .points-label {
    display:block;
    font-size:13px; color:var(--muted); letter-spacing:.04em;
  }
  .points-value {
    display:block; margin-top:8px;
    font-family:var(--serif); font-size:46px; font-weight:600;
    color:var(--ink); line-height:1;
  }

  /* ═══════════════════════════════════════
     文字快捷链接
     ═══════════════════════════════════════ */
  .quick-links {
    display:flex; align-items:center;
    padding:16px 24px 22px;
    background:var(--surface);
  }
  .quick-link {
    flex:1; text-align:center;
    font-size:13px; color:var(--ink); cursor:pointer;
    letter-spacing:.04em;
    text-decoration:none; display:block;
  }
  .quick-link:active { opacity:.6; }
  .quick-divider {
    font-size:12px; color:var(--border);
  }

  /* ═══════════════════════════════════════
     商品网格
     ═══════════════════════════════════════ */
  .products-grid {
    margin:16px 20px 0;
    display:grid; grid-template-columns:1fr 1fr; gap:16px 14px;
    padding-bottom:48px;
  }
  .product-card { cursor:pointer; }
  .product-card:active .product-image { transform:scale(.98); }
  .product-image {
    position:relative;
    width:100%; aspect-ratio:1/1;
    border-radius:8px;
    overflow:hidden;
    transition:transform .25s;
  }
  .product-image svg {
    width:62%; height:62%; color:rgba(255,255,255,.92);
  }
  .product-info { padding:12px 2px 0; }
  .product-name {
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    font-family:var(--serif); font-size:14px; font-weight:600;
    color:var(--ink); line-height:1.4;
  }
  .product-points {
    display:flex; align-items:baseline; gap:3px;
    margin-top:8px;
  }
  .points-num { font-size:17px; font-weight:700; color:var(--primary); }
  .points-unit { font-size:11px; color:var(--muted); }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }

  /* ── 下架商品提示 Modal ── */
  .off-shelf-mask {
    position:fixed; inset:0; z-index:80;
    background:rgba(44,30,24,.42);
    display:none; align-items:center; justify-content:center;
    padding:0 36px;
  }
  .off-shelf-card {
    width:100%; max-width:300px;
    border-radius:14px; background:var(--card);
    padding:26px 24px 20px;
    text-align:center;
  }
  .off-shelf-title { display:block; font-size:15px; font-weight:700; color:var(--ink); }
  .off-shelf-list { margin-top:14px; text-align:left; }
  .off-shelf-line { padding:7px 0; font-size:13px; color:var(--muted); }
  .off-shelf-btn {
    margin-top:18px; height:42px; border-radius:9px;
    background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .off-shelf-btn:active { background:#5E2E1B; }
</style>

  // ── 渲染 ──
  function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map(p => `
      <div class="product-card" onclick="go('mall-detail.html')">
        <div class="product-image" style="background:${p.gradient};">
          ${ICONS[p.icon]}
        </div>
        <div class="product-info">
          <span class="product-name">${p.name}</span>
          <div class="product-points">
            <span class="points-num">${p.points}</span>
            <span class="points-unit">积分</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── Toast ──
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }

  function go(href) { location.href = href; }

  // 初始化
  renderProducts('all');

  // 再次兑换：校验积分商品是否在售
  (function applyRereedeem() {
    const raw = localStorage.getItem('cozy_rereedeem');
    if (!raw) return;
    localStorage.removeItem('cozy_rereedeem');
    let p;
    try { p = JSON.parse(raw); } catch (e) { return; }
    if (!p || !p.productName) return;
    const found = products.some(x => x.name === p.productName);
    if (found) {
      toast('已为你定位到「' + p.productName + '」，可直接兑换');
    } else {
      document.getElementById('offShelfList').innerHTML = '<div class="off-shelf-line">· ' + p.productName + '</div>';
      document.getElementById('offShelfMask').style.display = 'flex';
    }
  })();

    document.getElementById('offShelfMask').style.display = 'none';
