<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>点单 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --caramel:#A9712F; --caramel-soft:#F6EAD9; --brown-soft:#F3E9DF;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    /* aliases */
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 导航胶囊 ── */
  .menu-nav {
    padding:16px 16px 0;
    background:var(--card);
    display:flex; justify-content:flex-start;
  }
  .nav-capsule {
    display:flex; align-items:center; gap:2px;
    border:1px solid var(--border); border-radius:20px;
    padding:4px 6px; background:var(--card);
  }
  .nav-capsule a {
    width:34px; height:30px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; color:var(--ink); text-decoration:none;
  }
  .nav-capsule a svg { width:20px; height:20px; }
  .nav-capsule .divider { width:1px; height:16px; background:var(--border); }

  /* ── 门店信息 ── */
  .store-info {
    padding:14px 24px 16px;
    background:var(--card); border-bottom:1px solid var(--border);
  }
  .store-row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .store-left { flex:1; min-width:0; display:flex; align-items:center; gap:7px; cursor:pointer; }
  .store-fav { color:var(--ink); }
  .store-name { font-size:15px; font-weight:650; color:var(--ink); }
  .pickup-switch {
    flex:none; display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden;
  }
  .pickup-opt {
    padding:5px 14px; font-size:11px; color:var(--muted); background:var(--surface);
  }
  .pickup-opt.active { background:var(--ink); color:#fff; }
  .store-meta { margin-top:3px; font-size:11px; color:var(--muted); }
  .store-meta--delivery {
    margin-top:5px; display:flex; align-items:center; gap:6px;
  }
  .store-meta--delivery svg { flex:none; width:14px; height:14px; color:var(--muted); }
  .store-left svg { flex:none; width:18px; height:18px; color:var(--muted); }
  .delivery-addr {
    flex:1; min-width:0;
    font-size:15px; font-weight:650; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .delivery-arrow { flex:none; font-size:14px; line-height:1; color:var(--placeholder); }
  .store-foot {
    margin-top:8px; display:flex; justify-content:space-between;
    font-size:11px; color:var(--muted);
  }
  .status-icon { color:var(--muted); }
  .store-more { color:var(--muted); }

  /* ── 主体：左分类栏 + 右商品区 ── */
  .menu-body {
    display:flex; height:calc(100vh - 118px); overflow:hidden;
  }
  .category-sidebar {
    width:90px; flex:none; height:100%; overflow-y:auto;
    background:var(--porcelain-muted);
    border-right:1px solid var(--hairline);
  }
  .category-sidebar::-webkit-scrollbar { display:none; }
  .category-item {
    padding:20px 8px; text-align:center;
    font-size:13px; color:var(--quiet-ink); cursor:pointer;
    position:relative;
    transition:color .2s;
  }
  .category-item.active {
    background:var(--porcelain); color:var(--ink); font-weight:700;
  }
  .product-scroll {
    flex:1; min-width:0; height:100%; overflow-y:auto;
    background:var(--card); padding-bottom:240px;
  }
  .product-scroll::-webkit-scrollbar { display:none; }

  .group-heading {
    position:sticky; top:0; z-index:2;
    background:var(--card);
    padding:14px 16px 12px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .group-title {
    font-size:14px; font-weight:700; color:var(--ink);
    letter-spacing:.02em;
  }
  .group-sub {
    font-size:8.5px; font-weight:600; letter-spacing:.14em;
    color:var(--placeholder);
  }
  .product-item {
    display:flex; gap:14px; padding:16px 16px;
    border-bottom:1px solid var(--border);
  }
  .product-image {
    flex:none; width:96px; height:96px; border-radius:10px;
    background:linear-gradient(135deg,#E8DDD2,#D8C8B4);
  }
  .product-info { flex:1; min-width:0; display:flex; flex-direction:column; }
  .product-title-row { display:flex; align-items:center; gap:6px; }
  .product-name {
    font-family:var(--serif); font-size:17px; font-weight:600; color:var(--ink);
  }
  .product-tag {
    flex:none; padding:2px 6px; border-radius:4px;
    background:var(--surface); color:var(--ink);
    font-size:9px; font-weight:600;
  }
  .product-desc {
    margin-top:4px; font-size:12px; line-height:1.5; color:var(--muted);
  }
  .product-extra {
    display:flex; gap:12px; margin-top:6px;
    font-size:11px; color:var(--placeholder);
  }
  .product-foot {
    margin-top:auto; display:flex; justify-content:space-between; align-items:center;
  }
  .product-price { display:flex; align-items:baseline; color:var(--ink); }
  .currency { font-size:10px; font-weight:700; }
  .price { font-size:16px; font-weight:750; line-height:1; }
  .add-btn {
    position:relative;
    width:24px; height:24px; border-radius:50%;
    background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .add-plus { font-size:17px; font-weight:600; line-height:24px; }
  .add-count {
    position:absolute; top:-4px; right:-3px;
    min-width:16px; height:16px; padding:0 4px;
    display:flex; align-items:center; justify-content:center;
    border:2px solid #fff; border-radius:9px;
    background:var(--ink); color:#fff;
    font-size:9px; font-weight:700; box-sizing:border-box;
  }
  .add-count.hidden { display:none; }

  /* ── 门店详情抽屉 ── */
  .store-sheet {
    position:fixed; inset:0; z-index:30;
    display:none;
  }
  .store-sheet.open { display:block; }
  .sheet-mask {
    position:absolute; inset:0;
    background:rgba(28,20,14,.45);
  }
  .sheet-content {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:390px;
    height:66.67vh; overflow-y:auto;
    background:var(--card); border-radius:16px 16px 0 0;
    padding:0 20px 28px;
    animation:sheet-up .35s ease both;
  }
  @keyframes sheet-up {
    from { transform:translate(-50%,100%); }
    to { transform:translate(-50%,0); }
  }
  .sheet-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 0 16px;
    border-bottom:1px solid var(--border);
  }
  .sheet-title {
    font-family:var(--serif); font-size:18px; font-weight:600; color:var(--ink);
  }
  .sheet-close {
    font-size:20px; color:var(--muted); cursor:pointer;
    padding:4px 8px;
  }
  .sheet-subheader {
    margin-top:10px; padding:0 0 10px;
    border-bottom:1px solid var(--border);
  }
  .sheet-row.plain { border-bottom:0; }
  .sheet-row {
    display:flex; align-items:center; gap:14px;
    padding:14px 0; border-bottom:1px solid var(--border);
  }
  .sheet-row:last-child { border-bottom:0; }
  .sheet-label {
    flex:none; width:60px;
    font-size:12px; color:var(--muted);
  }
  .sheet-value {
    flex:1; font-size:13px; color:var(--ink); line-height:1.4;
  }
  .sheet-icon { flex:none; font-size:16px; color:var(--muted); }

  /* ── 抽屉内 Cozy Day（周五会员日）── */
  .sheet-row .sheet-value.cozy-today {
    color:var(--roast-brown); font-weight:600;
  }

  /* ── 选择收货地址抽屉 ── */
  .addr-sheet-mask {
    position:fixed; inset:0; z-index:35;
    background:rgba(28,20,14,.45);
    display:none; align-items:flex-end; justify-content:center;
  }
  .addr-sheet {
    width:100%; max-width:390px; max-height:74vh;
    display:flex; flex-direction:column;
    background:var(--card); border-radius:16px 16px 0 0;
    padding:0 20px 20px;
    animation:addr-sheet-up .35s ease both;
  }
  @keyframes addr-sheet-up {
    from { transform:translateY(100%); }
    to { transform:translateY(0); }
  }
  .addr-sheet-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 0 16px;
    border-bottom:1px solid var(--border);
  }
  .addr-sheet-title { font-family:var(--serif); font-size:18px; font-weight:600; color:var(--ink); }
  .addr-sheet-close { font-size:22px; color:var(--muted); padding:2px 6px; cursor:pointer; }
  .addr-sheet-list { flex:1; min-height:0; overflow-y:auto; }
  .addr-row {
    display:flex; align-items:center; gap:10px;
    padding:13px 0; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .addr-row:active { opacity:.7; }
  .addr-check { flex:none; width:20px; display:flex; align-items:center; justify-content:center; }
  .addr-check svg { width:14px; height:14px; color:var(--primary); }
  .addr-copy { flex:1; min-width:0; }
  .addr-name { display:block; font-size:13px; font-weight:600; color:var(--ink); }
  .addr-detail {
    display:block; margin-top:3px;
    font-size:11px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .addr-edit { flex:none; padding:4px; cursor:pointer; }
  .addr-edit svg { width:16px; height:16px; color:var(--muted); }
  .addr-sheet-add {
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:14px; height:44px;
    border:1px solid var(--border); border-radius:8px;
    font-size:13px; font-weight:600; color:var(--primary);
    cursor:pointer;
  }
  .addr-sheet-add:active { background:var(--surface); }
  .addr-sheet-add svg { width:16px; height:16px; color:var(--primary); }

  /* ── 底部购物车条 ── */
  /* ── Cart bar ── */
  .cart-bar {
    position:fixed; bottom:54px; left:50%; transform:translateX(-50%);
    width:100%; max-width:390px; height:56px;
    display:flex; align-items:center;
    padding:0 16px;
    background:var(--card); color:var(--ink);
    border-top:1px solid var(--border);
    z-index:15;
  }
  .cart-total-block {
    flex:1;
    display:flex; align-items:center; gap:10px;
    cursor:pointer;
    padding:0 4px;
  }
  .cart-bag {
    position:relative;
    width:40px; height:40px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--card);
    display:inline-flex; align-items:center; justify-content:center;
  }
  .cart-bag svg { width:22px; height:22px; color:var(--ink); }
  .cart-bag-count {
    position:absolute; top:-4px; right:-6px;
    min-width:18px; height:18px; padding:0 5px;
    border-radius:9px;
    background:var(--ink); color:#fff;
    font-size:11px; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .cart-bag-count.hidden { display:none; }
  .cart-total-price { font-size:17px; font-weight:500; }
  .cart-checkout {
    height:40px; padding:0 22px;
    display:flex; align-items:center; justify-content:center;
    border-radius:20px;
    background:var(--ink); color:#fff;
    font-size:14px; font-weight:600;
    cursor:pointer;
  }
  .cart-checkout.disabled { opacity:.45; cursor:not-allowed; }
  .cart-checkout:active { opacity:.85; }

  /* ── Cart drawer (自下而上) ── */
  .cart-drawer { position:fixed; inset:0; z-index:40; display:none; }
  .cart-drawer.open { display:block; }
  .cart-drawer-mask {
    position:absolute; inset:0;
    background:rgba(28,20,14,.45);
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .cart-drawer-content {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:390px;
    background:#fff;
    border-radius:16px 16px 0 0;
    padding-bottom:env(safe-area-inset-bottom);
    animation:sheet-up .35s cubic-bezier(.32,.72,.32,1) both;
  }
  @keyframes sheet-up {
    from { transform:translate(-50%,100%); }
    to { transform:translate(-50%,0); }
  }

  /* drawer header */
  .cart-drawer-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--border);
  }
  .cart-drawer-head-left {
    display:flex; align-items:center; gap:10px;
  }
  .cart-check-icon {
    width:20px; height:20px; border-radius:50%;
    background:var(--ink); color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .cart-check-icon svg { width:12px; height:12px; }
  .cart-drawer-title { font-size:15px; font-weight:600; color:var(--ink); }
  .cart-drawer-chip {
    padding:3px 9px; font-size:11px;
    border-radius:4px;
    background:var(--surface); color:var(--muted);
  }
  .cart-drawer-clear {
    width:30px; height:30px;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--muted); cursor:pointer;
  }
  .cart-drawer-clear svg { width:16px; height:16px; }

  /* drawer items */
  .cart-drawer-items {
    max-height:48vh; overflow-y:auto;
    padding:0 20px;
  }
  .cart-empty {
    padding:48px 0; text-align:center;
    color:var(--muted); font-size:13px;
  }
  .cart-drawer-item {
    display:flex; gap:12px; align-items:flex-start;
    padding:14px 0;
    border-bottom:1px solid var(--border);
  }
  .cart-drawer-item:last-child { border-bottom:0; }
  .cart-item-check {
    flex:none;
    width:20px; height:20px; margin-top:18px;
    border-radius:50%;
    background:var(--ink); color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .cart-item-check svg { width:12px; height:12px; }
  .cart-item-img {
    flex:none; width:60px; height:60px;
    border-radius:6px;
    background:linear-gradient(135deg,#E8DDD2,#D8C8B4);
  }
  .cart-item-info { flex:1; min-width:0; }
  .cart-item-name {
    font-family:var(--serif); font-size:15px; font-weight:600; color:var(--ink);
  }
  .cart-item-spec {
    margin-top:4px;
    font-size:11px; line-height:1.5; color:var(--muted);
  }
  .cart-item-foot {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:8px;
  }
  .cart-item-price {
    font-size:16px; font-weight:700; color:var(--ink);
  }
  .cart-item-qty {
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--border); border-radius:20px;
    padding:4px 8px;
  }
  .cart-item-qty .qty-btn {
    width:20px; height:20px;
    font-size:14px; color:var(--ink);
  }
  .cart-item-qty .qty-value { font-size:13px; }

  /* drawer footer */
  .cart-drawer-foot {
    display:flex; align-items:center; gap:12px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
  }
  .cart-drawer-total-block {
    flex:1;
    display:flex; align-items:center; gap:8px;
  }
  .cart-drawer-total-price {
    font-size:18px; font-weight:700; color:var(--ink);
  }
  .cart-drawer-checkout {
    height:44px; padding:0 32px;
    display:flex; align-items:center; justify-content:center;
    border-radius:22px;
    background:var(--ink); color:#fff;
    font-size:15px; font-weight:600;
    cursor:pointer;
  }
  .cart-drawer-checkout.disabled { opacity:.4; cursor:not-allowed; }

  /* ── 底部 TabBar ── */
  .tabbar {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:390px; height:54px;
    display:flex; align-items:center; justify-content:space-around;
    background:#F7F3EE;
    border-top:1px solid var(--border);
    z-index:10;
  }
  .tabbar-item {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:9px; font-weight:400; color:var(--muted);
    cursor:pointer; transition:color .25s;
  }
  .tabbar-item.active { color:var(--ink); }
  .tabbar-icon {
    width:20px; height:20px; display:flex; align-items:center; justify-content:center;
  }
  .tabbar-icon svg { width:19px; height:19px; }

  /* ── 下架商品提示 Modal ── */
  .off-shelf-mask {
    position:fixed; inset:0; z-index:50;
    background:rgba(44,30,24,.42);
    display:none; align-items:center; justify-content:center;
    padding:0 36px;
  }
  .off-shelf-card {
    width:100%; max-width:300px;
    border-radius:14px; background:var(--porcelain);
    padding:26px 24px 20px;
    text-align:center;
  }
  .off-shelf-title { display:block; font-size:15px; font-weight:700; color:var(--roastery-ink); }
  .off-shelf-list { margin-top:14px; text-align:left; }
  .off-shelf-line { padding:7px 0; font-size:13px; color:var(--quiet-ink); }
  .off-shelf-btn {
    margin-top:18px; height:42px; border-radius:9px;
    background:var(--roast-brown); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .off-shelf-btn:active { background:var(--roast-brown-deep); }


  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

  <!-- 导航胶囊 -->
  <div class="menu-nav">
    <div class="nav-capsule">
      <a href="index.html" title="首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
      <span class="divider"></span>
      <a href="#" onclick="go('search.html')" title="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </a>
    </div>
  </div>

  <!-- 门店信息 -->
  <div class="store-info">
    <div class="store-row">
      <div class="store-left" id="storeLeft" onclick="chooseAddress()">
        <span class="store-fav">☆</span>
        <span class="store-name">CozyCoffee 中心店</span>
      </div>
      <div class="pickup-switch">
        <div class="pickup-opt active" id="optPickup" onclick="setFulfillment('pickup')">自提</div>
        <div class="pickup-opt" id="optDelivery" onclick="setFulfillment('delivery')">外送</div>
      </div>
    </div>
    <div class="store-meta" id="storeMeta">距离您 1.2km</div>
    <div class="store-foot">
      <span class="store-status" id="topMsg"><span class="status-icon">☼</span> 精品咖啡每日新鲜烘焙</span>
      <span class="store-more" onclick="openStoreDetail()">详情 ›</span>
    </div>
  </div>

  <!-- 门店详情抽屉 -->
  <div class="store-sheet" id="storeSheet">
    <div class="sheet-mask" onclick="closeStoreDetail()"></div>
    <div class="sheet-content">
      <div class="sheet-header">
        <span class="sheet-title">活动</span>
        <span class="sheet-close" onclick="closeStoreDetail()">×</span>
      </div>

      <!-- Cozy Day（周五会员日） -->
      <div class="sheet-row plain">
        <span class="sheet-label">会员日</span>
        <span class="sheet-value" id="cozydayValue">
          <span id="cozydayMain">每周五会员日·积分倍率提升0.5</span>
        </span>
      </div>

      <div class="sheet-subheader">
        <span class="sheet-title">门店信息</span>
      </div>
      <div class="sheet-row">
        <span class="sheet-label">地址</span>

  let activeIdx = 0;

  function renderSidebar() {
    document.getElementById('categorySidebar').innerHTML = categories.map((c, i) => {

    }).join('');
    const activeItem = document.querySelector('.category-item.active');
    if (activeItem) activeItem.scrollIntoView({ block:'nearest', behavior:'smooth' });
  }

  function renderAllProducts() {
    const sectionsHtml = categories.map((cat, i) => {
      const list = products[cat.id] || [];
      return `
        <div class="category-section" data-cat-index="${i}">
          <div class="group-heading">
            <span class="group-title">${cat.name}</span>
            <span class="group-sub">${cat.en}</span>
          </div>
          ${list.map(p => `
            <div class="product-item" data-name="${p.name}" onclick="go('spec.html')">
              <div class="product-image"></div>
              <div class="product-info">
                <div class="product-title-row">
                  <span class="product-name">${p.name}</span>
                  ${p.tag ? `<span class="product-tag">${p.tag}</span>` : ''}

                  <span>月售 ${p.sold}</span>

                    <span class="add-count hidden">0</span>
                  </div>
                </div>
              </div>
            </div>`).join('')}
        </div>`;
    }).join('');
    document.getElementById('productScroll').innerHTML = sectionsHtml;

    mountScrollSpy();
  }

  const NAV_HEIGHT = 0; // 吸顶标题从 top:0 开始，无额外偏移

  function setActiveCategory(idx) {
    if (idx === activeIdx) return;
    activeIdx = idx;
    renderSidebar();
  }

  let isClickScrolling = false;
  let clickTimeout;

  // 吸顶判定：哪个分类标题最接近容器顶部（吸顶位置 top:0），它即当前分类
  // 只在标题真正吸附/顶替时切换，避免提前点亮下一分类
  function pickActive() {
    if (isClickScrolling) return;
    const scrollEl = document.getElementById('productScroll');
    const containerTop = scrollEl.getBoundingClientRect().top;
    let best = activeIdx, bestAbs = Infinity;
    document.querySelectorAll('.group-heading').forEach(h => {
      const abs = Math.abs(h.getBoundingClientRect().top - containerTop);
      if (abs < bestAbs) {
        bestAbs = abs;
        best = parseInt(h.closest('.category-section').dataset.catIndex);
      }
    });
    setActiveCategory(best);
  }

  function mountScrollSpy() {
    const scrollEl = document.getElementById('productScroll');
    const observer = new IntersectionObserver(pickActive, {
      root: scrollEl,
      threshold: 0
    });
    document.querySelectorAll('.group-heading').forEach(h => observer.observe(h));

    // rAF 节流的滚动监听：吸附瞬间立即更新左侧
    // （observer threshold:0 只在标题进出容器时触发，吸附瞬间不触发 → 有延迟）
    let ticking = false;
    scrollEl.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        pickActive();
        ticking = false;
      });
    });
  }

  function selectCategory(i) {
    setActiveCategory(i);
    isClickScrolling = true;
    clearTimeout(clickTimeout);
    clickTimeout = setTimeout(() => {
      isClickScrolling = false;
      // 锁释放后同步一次到滚动落点，避免动画期间 observer 被抑制导致不同步
      pickActive();
    }, 800);

    const scrollEl = document.getElementById('productScroll');
    const section = document.querySelector(`.category-section[data-cat-index="${i}"]`);
    if (section) {
      const containerTop = scrollEl.getBoundingClientRect().top;
      const sectionTop = section.getBoundingClientRect().top;
      const target = scrollEl.scrollTop + sectionTop - containerTop - NAV_HEIGHT;
      scrollEl.scrollTo({ top: target, behavior: 'smooth' });
    }
  }

  renderAllProducts();

  // ── 自提 / 外送切换 ──
  const PIN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.2-6-11a6 6 0 0 1 12 0c0 5.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>';

  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const PENCIL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 6l4 4"/></svg>';
  let currentAddressId = null;
  function getAddressList() { try { return JSON.parse(localStorage.getItem('cozy_addresses')) || []; } catch (e) { return []; } }
  function getDefaultAddress() {
    const list = getAddressList();
    return list.find(a => a.isDefault) || list[0] || null;
  }
  function maskPhone(p) { return String(p || '').replace(/(\d{3})\d{4}(\d{4})/, '$1****$2'); }
  function renderDeliveryAddress(addr) {
    document.getElementById('storeLeft').innerHTML = PIN_SVG + '<span class="store-name delivery-addr">' + [addr.region, addr.detail].filter(Boolean).join(' ').replace(/\s+/g, '') + '</span><span class="delivery-arrow">›</span>';

    document.getElementById('storeMeta').innerHTML = SWAP_SVG + '<span>CozyCoffee 中心店 | 配送距离 1.2km</span>';
  }
  function chooseAddress() {
    if (!document.getElementById('optDelivery').classList.contains('active')) return;
    openAddrSheet();
  }
  function openAddrSheet() {
    const list = getAddressList();
    document.getElementById('addrSheetList').innerHTML = list.map(a => {
      const checked = currentAddressId && String(a.id) === String(currentAddressId) ? CHECK_SVG : '';
      const honorific = String(a.gender || '').toUpperCase() === 'FEMALE' ? '（女士）' : '（先生）';
      return `
        <div class="addr-row" onclick="pickAddress(${a.id})">
          <span class="addr-check">${checked}</span>
          <span class="addr-copy">
            <span class="addr-name">${a.name}${honorific} · ${maskPhone(a.phone)}</span>
            <span class="addr-detail">${[a.region, a.detail].filter(Boolean).join(' ').replace(/\s+/g, '')}</span>
          </span>
          <span class="addr-edit" onclick="event.stopPropagation(); go('address-edit.html?id=${a.id}')">${PENCIL_SVG}</span>
        </div>`;
    }).join('');
    document.getElementById('addrSheetMask').style.display = 'flex';
  }
  function closeAddrSheet() {
    document.getElementById('addrSheetMask').style.display = 'none';
  }
  function pickAddress(id) {
    const addr = getAddressList().find(a => a.id === id);
    if (!addr) return;
    currentAddressId = id;
    renderDeliveryAddress(addr);
    closeAddrSheet();
  }
  function setFulfillment(mode) {
    const pickup = document.getElementById('optPickup');
    const delivery = document.getElementById('optDelivery');
    if (mode === 'delivery') {
      pickup.classList.remove('active');
      delivery.classList.add('active');
      // 外送：优先用地址页选中的地址，其次默认/首个，无地址跳添加页（与 menu.vue setFulfillment 一致）
      let addr = (() => { try { return JSON.parse(localStorage.getItem('cozy_selected_address')); } catch (e) { return null; } })();
      localStorage.removeItem('cozy_selected_address');
      if (!addr) addr = getDefaultAddress();
      if (!addr) {
        toast('未设置配送地址，请先添加');
        setTimeout(() => { location.href = 'address.html'; }, 600);
        return;
      }
      currentAddressId = addr.id;
      renderDeliveryAddress(addr);
      toast('已切换外送');
      return;
    }
    delivery.classList.remove('active');
    pickup.classList.add('active');
    document.getElementById('storeLeft').innerHTML = '<span class="store-fav">☆</span><span class="store-name">CozyCoffee 中心店</span>';
    document.getElementById('storeMeta').classList.remove('store-meta--delivery');

    toast('已切换自提');

    const cozy = isCozyDay();
    const top = document.getElementById('topMsg');
    if (top) top.innerHTML = cozy ? '<span class="status-icon">☼</span> 今天会员日 · 积分倍率提升0.5' : '<span class="status-icon">☼</span> 精品咖啡每日新鲜烘焙';
    const main = document.getElementById('cozydayMain');
    if (main) main.textContent = cozy ? '今天会员日·积分倍率提升0.5' : '每周五会员日·积分倍率提升0.5';
    const value = document.getElementById('cozydayValue');
    if (value) value.classList.toggle('cozy-today', cozy);
  }
  applyCozyDay();

  // ── Cart 状态 ──
  const cart = [];

  function cartTotal() {
    return cart.reduce((s, c) => s + c.price * c.qty, 0);
  }
  function cartCount() {
    return cart.reduce((s, c) => s + c.qty, 0);
  }

  // 商品列表加购角标：按商品名统计购物车数量（随购物车实时更新，保留商品加购角标）
  function renderProductBadges() {
    document.querySelectorAll('.product-item').forEach(el => {
      const name = el.dataset.name;
      const count = cart.filter(l => l.name === name).reduce((s, l) => s + l.qty, 0);
      const badge = el.querySelector('.add-count');
      if (badge) {
        badge.textContent = count;
        badge.classList.toggle('hidden', count === 0);
      }
    });
  }

  function updateCartUI() {
    const total = cartTotal();
    const count = cartCount();

    // 左侧分类（已去掉加购数量角标）
    renderSidebar();

    // 商品列表加购角标
    renderProductBadges();

    // 底部购物车条
    document.getElementById('cartTotalPrice').textContent = total.toFixed(2);
    const bagCount = document.getElementById('cartBagCount');
    if (count > 0) {
      bagCount.textContent = count;
      bagCount.classList.remove('hidden');
      document.getElementById('cartCheckoutBtn').classList.remove('disabled');
    } else {
      bagCount.classList.add('hidden');
      document.getElementById('cartCheckoutBtn').classList.add('disabled');
    }
    // 抽屉内显示
    renderCartDrawer();
  }

  function renderCartDrawer() {
    const list = document.getElementById('cartDrawerItems');
    document.getElementById('cartDrawerCount').textContent = cartCount();
    document.getElementById('cartDrawerTotal').textContent = '¥' + cartTotal().toFixed(2);
    const checkoutBtn = document.getElementById('cartDrawerCheckout');

    if (cart.length === 0) {
      list.innerHTML = '<div class="cart-empty">购物车空空如也，去选一杯喜欢的吧</div>';
      checkoutBtn.classList.add('disabled');
      return;
    }
    checkoutBtn.classList.remove('disabled');
    list.innerHTML = cart.map((c, idx) => `
      <div class="cart-drawer-item">
        <span class="cart-item-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <div class="cart-item-img"></div>
        <div class="cart-item-info">
          <div class="cart-item-name">${c.name}</div>
          <div class="cart-item-spec">${c.specs.length ? c.specs.join(' · ') : '默认规格'}</div>
          <div class="cart-item-foot">
            <span class="cart-item-price">¥${(c.price * c.qty).toFixed(2)}</span>
            <div class="cart-item-qty">
              <div class="qty-btn" onclick="changeCartQty(${idx}, -1)">−</div>
              <span class="qty-value">${c.qty}</span>
              <div class="qty-btn" onclick="changeCartQty(${idx}, 1)">+</div>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function openCartDrawer() {
    renderCartDrawer();
    document.getElementById('cartDrawer').classList.add('open');
  }
  function closeCartDrawer() {
    document.getElementById('cartDrawer').classList.remove('open');
  }
  function changeCartQty(idx, d) {
    cart[idx].qty += d;
    if (cart[idx].qty < 1) cart.splice(idx, 1);
    updateCartUI();
  }
  function clearCart() {
    if (cart.length === 0) return;
    cart.length = 0;
    updateCartUI();
    toast('已清空购物车');
  }
  function checkout() {
    if (cart.length === 0) return;
    const total = cartTotal();
    const count = cartCount();
    toast(`结算 ${count} 件 · ¥${total.toFixed(2)}`);
    setTimeout(() => { location.href = 'confirm.html'; }, 600);
  }

  // 初始化
  updateCartUI();

  // 再来一单：恢复订单商品到购物车，下架商品提示
  (function applyReorder() {
    const raw = localStorage.getItem('cozy_reorder');
    if (!raw) return;
    localStorage.removeItem('cozy_reorder');
    let payload;
    try { payload = JSON.parse(raw); } catch (e) { return; }
    const items = payload && Array.isArray(payload.items) ? payload.items : [];
    if (items.length === 0) return;

    const availNames = new Set();
    Object.values(products).forEach(list => list.forEach(p => availNames.add(p.name)));

    const offShelf = [];
    let added = 0;
    items.forEach(it => {
      if (!availNames.has(it.productName)) { offShelf.push(it); return; }
      const specs = (it.spec || '').split(' · ').filter(Boolean);
      const key = it.productName + '|' + specs.join('·');
      const existing = cart.find(c => c.key === key);
      if (existing) existing.qty += it.qty;
      else cart.push({ key, name: it.productName, specs, price: it.price, qty: it.qty });
      added += it.qty;
    });
    updateCartUI();

    if (offShelf.length > 0) {
      document.getElementById('offShelfTitle').textContent = added > 0
        ? `已加入 ${added} 件 · ${offShelf.length} 款商品已下架`
        : '以下商品已下架';
      document.getElementById('offShelfList').innerHTML = offShelf.map(o =>
        `<div class="off-shelf-line">· ${o.name}${o.spec ? '（' + o.spec + '）' : ''}</div>`).join('');
      document.getElementById('offShelfMask').style.display = 'flex';
    } else {
      openCartDrawer();
      toast('已加入购物车 ' + added + ' 件商品');
    }
  })();

  function closeOffShelf() {
    document.getElementById('offShelfMask').style.display = 'none';
    if (cartCount() > 0) openCartDrawer();
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }

  // 首页外送 CTA 传入的选择优先（与 menu.vue onShow 一致）
  (function initFulfillment() {
    const mode = localStorage.getItem('cozy_dining_method');
    if (!mode) return;
    localStorage.removeItem('cozy_dining_method');
    if (mode === 'delivery') setFulfillment('delivery');
  })();
</script>
</body>
</html>
