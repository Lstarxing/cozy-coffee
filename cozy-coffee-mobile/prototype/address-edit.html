<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>添加地址 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --caramel:#A9712F; --caramel-soft:#F6EAD9; --brown-soft:#F3E9DF;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部原生式导航：返回 + 居中标题 ── */
  .top-nav {
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
  }
  .nav-back {
    font-size:26px; line-height:1; color:var(--ink);
    cursor:pointer; padding:6px 4px; width:32px;
  }
  .nav-back:active { opacity:.5; }
  .nav-title {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:16px; font-weight:600; color:var(--ink);
    white-space:nowrap;
  }
  .nav-right { width:32px; }

  .page { padding:0 20px 110px; }

  /* ── 表单卡：标签左 · 控件右 ── */
  .form-card {
    margin-top:6px;
    border-radius:14px; background:var(--card);
    border:1px solid var(--hairline);
    overflow:hidden;
  }
  .form-row {
    display:flex; align-items:center; gap:14px;
    min-height:54px;
    padding:0 18px;
    border-bottom:1px solid var(--border);
  }
  .form-row:last-child { border-bottom:0; }
  .form-label {
    flex:none; width:62px;
    font-size:14px; color:var(--ink);
  }
  .form-input {
    flex:1; min-width:0;
    border:none; background:transparent;
    font-size:14px; color:var(--roastery-ink); font-family:inherit;
    padding:6px 0;
  }
  .form-input::placeholder { color:var(--placeholder); }
  .form-input:focus { outline:none; }

  /* 性别（右对齐） */
  .gender-group { display:flex; gap:10px; margin-left:auto; }
  .gender-opt {
    min-width:64px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
    border:1px solid var(--hairline); background:var(--porcelain-muted);
    font-size:13px; color:var(--roastery-ink); cursor:pointer;
    transition:all .2s;
  }
  .gender-opt.active {
    background:#F1E4DA; border-color:var(--roast-brown);
    color:var(--roast-brown); font-weight:600;
  }

  /* 收货地址选择行（右对齐） */
  .form-row.tap { cursor:pointer; }
  .form-row.tap:active { opacity:.7; }
  .form-value {
    margin-left:auto;
    font-size:14px; color:var(--placeholder);
  }
  .form-value.filled { color:var(--roastery-ink); }
  .form-arrow { font-size:16px; color:var(--placeholder); }

  /* 设为默认（右对齐开关） */
  .form-check {
    margin-left:auto; width:22px; height:22px; border-radius:5px;
    border:1px solid var(--hairline); background:var(--porcelain);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff;
  }
  .form-check.on { background:var(--roast-brown); border-color:var(--roast-brown); }

  /* ── 保存 ── */
  .save-btn {
    margin-top:24px; height:48px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    background:var(--ink); color:#fff;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .save-btn:active { opacity:.85; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <!-- 顶部导航 -->
  <div class="top-nav">
    <span class="nav-back" onclick="goBack('address.html')">‹</span>
    <span class="nav-title" id="pageTitle">添加地址</span>
    <span class="nav-right"></span>
  </div>

  <!-- 表单 -->
  <div class="form-card">
    <div class="form-row">
      <span class="form-label">联系人</span>
      <input class="form-input" id="fName" placeholder="请填写收货人姓名">
    </div>
    <div class="form-row">
      <span class="form-label">性别</span>
      <div class="gender-group">
        <div class="gender-opt active" data-g="MALE" onclick="pickGender(this)">男</div>
        <div class="gender-opt" data-g="FEMALE" onclick="pickGender(this)">女</div>
      </div>
    </div>
    <div class="form-row">
      <span class="form-label">标签</span>
      <div class="gender-group">
        <div class="gender-opt active" data-l="HOME" onclick="pickLabel(this)">家</div>
        <div class="gender-opt" data-l="COMPANY" onclick="pickLabel(this)">公司</div>
        <div class="gender-opt" data-l="SCHOOL" onclick="pickLabel(this)">学校</div>
      </div>
    </div>
    <div class="form-row">
      <span class="form-label">手机号</span>
      <input class="form-input" id="fPhone" type="number" maxlength="11" placeholder="请填写收货手机号">
    </div>
    <div class="form-row tap" onclick="cycleRegion()">
      <span class="form-label">收货地址</span>
      <span class="form-value" id="fRegion">点击选择</span>
      <span class="form-arrow">›</span>
    </div>
    <div class="form-row">
      <span class="form-label">门牌号</span>
      <input class="form-input" id="fDetail" placeholder="例：A座8102室">
    </div>
    <div class="form-row tap" onclick="toggleDefault()">
      <span class="form-label">设为默认</span>
      <span class="form-check" id="fDefault"></span>
    </div>
  </div>

  <div class="save-btn" onclick="save()">保存</div>

</div>

<script>
  const REGIONS = ['浙江省 杭州市 西湖区', '浙江省 杭州市 滨江区', '浙江省 湖州市 安吉县'];

  let regionIdx = -1;
  let isDefault = false;
  let editingId = null;

  function getAddresses() { try { return JSON.parse(localStorage.getItem('cozy_addresses')) || []; } catch (e) { return []; } }
  function persist(list) { localStorage.setItem('cozy_addresses', JSON.stringify(list)); }

  (function init() {
    const id = new URLSearchParams(location.search).get('id');
    if (id) {
      const a = getAddresses().find(x => x.id === Number(id));
      if (a) {
        editingId = a.id;
        document.getElementById('pageTitle').textContent = '编辑地址';
        document.getElementById('fName').value = a.name;
        document.getElementById('fPhone').value = a.phone;
        pickGender(document.querySelector('.gender-opt[data-g="' + (a.gender || 'MALE') + '"]'));
        pickLabel(document.querySelector('.gender-opt[data-l="' + (a.label || 'HOME') + '"]'));
        regionIdx = REGIONS.indexOf(a.region);
        const r = document.getElementById('fRegion');
        r.textContent = a.region;
        r.classList.add('filled');
        document.getElementById('fDetail').value = a.detail;
        syncDefault(a.isDefault);
      }
    }
  })();

  function pickGender(el) {
    document.querySelectorAll('.gender-opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
  }
  function pickLabel(el) {
    document.querySelectorAll('.gender-opt[data-l]').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
  }
  function cycleRegion() {
    regionIdx = (regionIdx + 1) % REGIONS.length;
    const r = document.getElementById('fRegion');
    r.textContent = REGIONS[regionIdx];
    r.classList.add('filled');
  }
  function toggleDefault() { syncDefault(!isDefault); }
  function syncDefault(v) {
    isDefault = v;
    const el = document.getElementById('fDefault');
    el.classList.toggle('on', v);
    el.textContent = v ? '✓' : '';
  }

  function save() {
    const name = document.getElementById('fName').value.trim();
    const phone = document.getElementById('fPhone').value.trim();
    const detail = document.getElementById('fDetail').value.trim();
    const region = regionIdx >= 0 ? REGIONS[regionIdx] : '';
    if (!name || !phone || !region || !detail) { toast('请填写完整信息'); return; }
    if (!/^1\d{10}$/.test(phone)) { toast('请输入正确的手机号'); return; }

    const gender = document.querySelector('.gender-opt.active').dataset.g;
    const label = (document.querySelector('.gender-opt.active[data-l]') || {}).dataset?.l || 'HOME';
    const list = getAddresses();
    if (isDefault) list.forEach(a => a.isDefault = false);

    if (editingId) {
      const a = list.find(x => x.id === editingId);
      if (a) { a.name = name; a.phone = phone; a.gender = gender; a.label = label; a.region = region; a.detail = detail; a.isDefault = isDefault; }
    } else {
      const id = list.length ? Math.max(...list.map(a => a.id)) + 1 : 1;
      list.push({ id, name, phone, gender, label, region, detail, isDefault });
    }
    persist(list);
    toast('已保存');
    setTimeout(() => { location.href = 'address.html?ts=' + Date.now(); }, 700);
  }

  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
