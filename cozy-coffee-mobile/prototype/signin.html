<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>每日签到 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --glaze-green:#526C43; --glaze-green-soft:#E8EDE5;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    /* aliases */
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22; --accent:#526C43;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:14px;
    font-size:26px; line-height:1;
    color:var(--ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 20px 120px; }

  /* ── 积分头 ── */
  .points-header {
    padding:24px 8px 16px;
    background:var(--surface);
  }
  .points-label {
    display:block;
    font-size:13px; color:var(--muted); letter-spacing:.04em;
  }
  .points-value {
    display:block; margin-top:8px;
    font-family:var(--serif); font-size:46px; font-weight:600;
    color:var(--ink); line-height:1;
  }

  /* ── 签到区 ── */
  .checkin-section {
    margin-top:20px; padding:28px 24px;
    border-radius:14px; background:var(--card);
  }
  .checkin-head {
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:26px;
  }
  .checkin-title {
    display:block;
    font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
  }
  .checkin-sub {
    display:block; margin-top:4px;
    font-size:12px; color:var(--muted);
  }
  .checkin-btn {
    border:none; padding:0 22px; height:44px;
    border-radius:6px;
    background:var(--roast-brown); color:#fff;
    font-size:14px; font-weight:650; cursor:pointer;
    font-family:inherit;
    transition:background .25s;
  }
  .checkin-btn:active { background:var(--roast-brown-deep); }
  .checkin-btn.done { background:var(--hairline); color:var(--quiet-ink); cursor:default; }
  .checkin-btn.done:active { background:var(--hairline); }

  /* 咖啡豆轨迹 */
  .bean-track { position:relative; padding:22px 0 6px; }
  .track-line {
    position:absolute; top:34px; left:16px; right:16px;
    height:3px; border-radius:2px;
    background:var(--border);
    transform:translateY(-50%);
  }
  .track-line-fill {
    height:100%; border-radius:2px;
    background:var(--primary);
    transition:width .5s ease;
  }
  .bean-steps {
    display:flex; justify-content:space-between;
    position:relative; z-index:2;
  }
  .bean-step {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:36px;
  }
  .bean-icon {
    width:32px; height:32px; border-radius:50%;
    background:var(--porcelain-muted); color:var(--placeholder);
    border:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:center;
    transition:all .3s;
  }
  .bean-icon.active {
    background:var(--roast-brown); color:#F2EDE8;
    border-color:var(--roast-brown);
  }
  .bean-icon.active.today {
    box-shadow:0 0 0 4px rgba(198,156,109,.35);
  }
  .bean-icon.is-gift { border-radius:12px; }
  .bean-svg { width:16px; height:16px; }
  .bean-label { font-size:11px; color:var(--placeholder); }
  .bean-step.active .bean-label { color:var(--roastery-ink); font-weight:600; }
  .bean-step.active.today .bean-label { color:var(--roast-brown); font-weight:700; }

  .checkin-foot {
    margin-top:18px; padding:12px 16px;
    border-radius:8px;
    background:var(--surface);
    font-size:13px; color:var(--muted);
  }
  .checkin-foot em {
    font-style:normal; color:var(--primary); font-weight:700;
  }
  .checkin-foot.success {
    background:var(--porcelain-muted); color:var(--roast-brown);
  }

  /* 签到按钮 */
  .checkin-action { margin-top:24px; text-align:center; }
  .checkin-btn {
    height:48px; display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    background:var(--primary); color:#fff;
    font-size:15px; font-weight:600; cursor:pointer;
    transition:background .25s;
  }
  .checkin-btn:active { background:#5E2E1A; }
  .checkin-btn.done {
    background:var(--border); color:var(--muted); cursor:default;
  }
  .checkin-btn.done:active { background:var(--border); }
  .checkin-hint {
    display:block; margin-top:12px;
    font-size:12px; color:var(--muted);
    letter-spacing:.04em;
  }
  .checkin-hint em {
    font-style:normal; color:var(--primary); font-weight:700;
  }

  /* ── 权益说明（Editorial） ── */
  .benefits-section {
    margin-top:20px; padding:28px 24px;
    border-radius:14px; background:var(--card);
  }
  .benefits-title {
    display:block; margin-bottom:22px;
    font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
  }
  .benefit-card {
    padding:16px 0;
    border-bottom:1px solid var(--border);
  }
  .benefit-card:last-child { border-bottom:0; padding-bottom:0; }
  .benefit-head {
    display:block;
    font-size:14px; font-weight:600; color:var(--ink);
    letter-spacing:.04em;
  }
  .benefit-desc {
    display:block; margin-top:8px;
    font-size:13px; line-height:1.7; color:var(--muted);
  }

  /* ── 成功弹窗 ── */
  .modal-mask {
    position:fixed; inset:0; z-index:30;
    background:rgba(28,20,14,.5);
    display:none; align-items:center; justify-content:center;
  }
  .modal-mask.open { display:flex; }
  .success-modal {
    width:280px; padding:36px 28px;
    text-align:center;
    background:var(--card); border-radius:14px;
  }
  .success-icon {
    width:56px; height:56px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px; background:var(--roast-brown); color:#fff;
    font-size:26px;
  }
  .success-title {
    display:block; margin-top:20px;
    font-family:var(--serif); font-size:21px; font-weight:600;
    color:var(--ink);
  }
  .success-sub {
    display:block; margin-top:6px;
    font-size:13px; color:var(--muted);
  }
  .success-points {
    display:block; margin-top:14px;
    font-size:24px; font-weight:700; color:var(--primary);
  }
  .success-btn {
    margin-top:22px; height:44px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px; background:var(--primary); color:#fff;
    font-size:14px; font-weight:600; cursor:pointer;
  }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <a class="back-btn" href="index.html">‹</a>

  <!-- 积分头 -->
  <div class="points-header">
    <span class="points-label">当前可用积分</span>
    <span class="points-value">3,280</span>
  </div>

  <!-- 签到区 -->
  <div class="checkin-section">
    <div class="checkin-head">
      <div>
        <span class="checkin-title">每日签到</span>
        <span class="checkin-sub">连续签到 7 天可领惊喜礼包</span>
      </div>
      <button class="checkin-btn" id="signinBtn" onclick="doSignin()">签到领豆</button>
    </div>
    <div class="bean-track">
      <div class="track-line">
        <div class="track-line-fill" id="trackFill" style="width:33%"></div>
      </div>
      <div class="bean-steps" id="dayGrid"></div>
    </div>
    <div class="checkin-foot" id="signinHint">再签 <em>3</em> 天领满35减10券</div>
  </div>

  <!-- 权益说明 -->
  <div class="benefits-section">
    <span class="benefits-title">积分说明</span>
    <div class="benefit-card">
      <span class="benefit-head">每日签到</span>
      <span class="benefit-desc">每签到一次固定获得 2 积分。连续签到 7 天额外赠送满 35 减 10 元优惠券，有效期 3 天。</span>
    </div>
    <div class="benefit-card">
      <span class="benefit-head">连续签到</span>
      <span class="benefit-desc">中断签到后连续天数重新计算。坚持每天来打卡，培养你的咖啡仪式感。</span>
    </div>
    <div class="benefit-card">
      <span class="benefit-head">积分使用</span>
      <span class="benefit-desc">签到积分有效期 365 天，可在积分商城兑换优惠券、限量周边与咖啡礼盒。</span>
    </div>
    <div class="benefit-card">
      <span class="benefit-head">会员成长</span>
      <span class="benefit-desc">消费 1 元 = 1 积分 = 1 EXP，积分累积同步提升会员等级，解锁更多专属权益。</span>
    </div>
  </div>

</div>

<!-- 成功弹窗 -->
<div class="modal-mask" id="successModal" onclick="closeModal()">
  <div class="success-modal" onclick="event.stopPropagation()">
    <div class="success-icon">✓</div>
    <span class="success-title">今日签到完成</span>
    <span class="success-sub">一杯好咖啡，从此刻开始</span>
    <span class="success-points">+2 积分</span>
    <div class="success-btn" onclick="closeModal()">知道了</div>
  </div>
</div>

<script>
  const BEAN_SVG = '<svg class="bean-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12,2 C6.5,2 2,6.5 2,12 C2,17.5 6.5,22 12,22 C17.5,22 22,17.5 22,12 C2,6.5 17.5,2 12,2 Z M12.5,5 C12.5,5 14,8 14,12 C14,16 12.5,19 12.5,19 C11,19 8,16 8,12 C8,8 11,5 12.5,5 Z"/></svg>';
  const GIFT_SVG = '<svg class="bean-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>';

  let consecutive = 3; // 已连续签到 3 天
  let signed = false;

  function updateTrackFill() {
    // 进度线：已签到天数到第7天礼盒
    const pct = Math.max(0, (consecutive - 1) / 6 * 100);
    document.getElementById('trackFill').style.width = pct + '%';
  }

  function renderDays() {
    const grid = document.getElementById('dayGrid');
    grid.innerHTML = Array.from({length: 7}, (_, i) => {
      const stepCls = i < consecutive ? 'active' : (i === consecutive ? 'active today' : '');
      let iconCls = 'bean-icon';
      if (i <= consecutive) iconCls += ' active';
      if (i === consecutive) iconCls += ' today';
      if (i === 6) iconCls += ' is-gift';
      const icon = i === 6 ? GIFT_SVG : BEAN_SVG;
      const label = i === 6 ? '礼包' : '+2';
      return `
        <div class="bean-step ${stepCls}">
          <div class="${iconCls}">${icon}</div>
          <span class="bean-label">${label}</span>
        </div>`;
    }).join('');
    updateTrackFill();
  }
  renderDays();

  function doSignin() {
    if (signed) return;
    signed = true;
    consecutive += 1;

    const btn = document.getElementById('signinBtn');
    btn.textContent = '今日已签';
    btn.classList.add('done');

    // 今日 bean-step：active today → active
    const stepCells = document.querySelectorAll('.bean-step');
    stepCells[consecutive - 1].classList.remove('today');
    updateTrackFill();

    const hint = document.getElementById('signinHint');
    if (consecutive >= 7) {
      hint.className = 'checkin-foot success';
      hint.innerHTML = '连续签到 7 天！礼包已到账';
    } else {
      hint.innerHTML = `再签 <em>${7 - consecutive}</em> 天领满35减10券`;
    }

    document.getElementById('successModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('successModal').classList.remove('open');
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
