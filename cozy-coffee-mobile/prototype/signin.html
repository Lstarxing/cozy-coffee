<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>每日签到 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --ink:#2C2723; --muted:#8B8178; --primary:#753A22; --accent:#526C43;
    --surface:#F7F3EE; --card:#FFFFFF; --border:#E3DED8;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
    --cask:#3D2A20;
  }

  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:14px;
    font-size:26px; line-height:1;
    color:var(--ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 20px 120px; }

  /* ── 会员区 ── */
  .member-hero {
    padding:32px 24px 28px;
    border-radius:14px;
    background:var(--cask);
    color:#fff;
  }
  .member-badge {
    display:inline-block; padding:4px 12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.28);
    font-size:10px; font-weight:700; letter-spacing:.12em;
    color:rgba(255,255,255,.75);
  }
  .member-greeting {
    display:block; margin-top:20px;
    font-family:var(--serif); font-size:24px; font-weight:500;
    letter-spacing:.04em;
  }
  .points-display { margin-top:18px; display:flex; align-items:baseline; gap:8px; }
  .points-number {
    font-size:40px; font-weight:700; line-height:1;
  }
  .points-unit {
    font-size:15px; color:rgba(255,255,255,.6);
    letter-spacing:.06em;
  }

  /* 进度条 */
  .level-progress { margin-top:24px; }
  .progress-bar {
    height:3px; border-radius:2px;
    background:rgba(255,255,255,.14);
    overflow:hidden;
  }
  .progress-fill {
    height:100%; border-radius:2px;
    background:rgba(255,255,255,.6);
    transition:width .6s ease;
  }
  .progress-text {
    display:block; margin-top:10px;
    font-size:12px; color:rgba(255,255,255,.55);
    letter-spacing:.04em;
  }

  /* ── 签到区 ── */
  .checkin-section {
    margin-top:20px; padding:28px 24px;
    border-radius:14px; background:var(--card);
  }
  .checkin-header {
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:22px;
  }
  .checkin-title {
    font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
  }
  .checkin-streak {
    font-size:12px; color:var(--muted);
    letter-spacing:.04em;
  }
  .checkin-streak em {
    font-style:normal; font-weight:700; color:var(--primary);
  }

  .strip-days {
    display:flex; gap:8px;
  }
  .strip-day {
    flex:1; aspect-ratio:3/4;
    border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font-size:13px; font-weight:600; color:var(--muted);
    background:var(--surface);
    transition:background .25s, color .25s;
  }
  .strip-day .day-label { font-size:11px; font-weight:500; }
  .strip-day .day-pts { font-size:10px; font-weight:400; opacity:.6; }

  .strip-day.signed {
    background:var(--accent); color:#fff;
  }
  .strip-day.signed .day-pts { opacity:.8; }
  .strip-day.today {
    background:var(--primary); color:#fff;
    box-shadow:0 0 0 3px rgba(117,58,34,.12);
  }
  .strip-day.today .day-pts { opacity:.8; }
  .strip-day.gift {
    background:var(--surface);
    border:1px dashed var(--border);
    color:var(--muted);
  }
  .strip-day.gift.signed,
  .strip-day.gift.today {
    background:var(--accent); color:#fff; border-color:var(--accent);
    border-style:solid;
  }

  /* 签到按钮 */
  .checkin-action { margin-top:24px; text-align:center; }
  .checkin-btn {
    height:48px; display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    background:var(--primary); color:#fff;
    font-size:15px; font-weight:600; cursor:pointer;
    transition:background .25s;
  }
  .checkin-btn:active { background:#5E2E1A; }
  .checkin-btn.done {
    background:var(--border); color:var(--muted); cursor:default;
  }
  .checkin-btn.done:active { background:var(--border); }
  .checkin-hint {
    display:block; margin-top:12px;
    font-size:12px; color:var(--muted);
    letter-spacing:.04em;
  }
  .checkin-hint em {
    font-style:normal; color:var(--primary); font-weight:700;
  }

  /* ── 权益说明（Editorial） ── */
  .benefits-section {
    margin-top:20px; padding:28px 24px;
    border-radius:14px; background:var(--card);
  }
  .benefits-title {
    display:block; margin-bottom:22px;
    font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
  }
  .benefit-card {
    padding:16px 0;
    border-bottom:1px solid var(--border);
  }
  .benefit-card:last-child { border-bottom:0; padding-bottom:0; }
  .benefit-head {
    display:block;
    font-size:14px; font-weight:600; color:var(--ink);
    letter-spacing:.04em;
  }
  .benefit-desc {
    display:block; margin-top:8px;
    font-size:13px; line-height:1.7; color:var(--muted);
  }

  /* ── 成功弹窗 ── */
  .modal-mask {
    position:fixed; inset:0; z-index:30;
    background:rgba(28,20,14,.5);
    display:none; align-items:center; justify-content:center;
  }
  .modal-mask.open { display:flex; }
  .success-modal {
    width:280px; padding:36px 28px;
    text-align:center;
    background:var(--card); border-radius:14px;
  }
  .success-icon {
    width:56px; height:56px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px; background:var(--accent); color:#fff;
    font-size:26px;
  }
  .success-title {
    display:block; margin-top:20px;
    font-family:var(--serif); font-size:21px; font-weight:600;
    color:var(--ink);
  }
  .success-sub {
    display:block; margin-top:6px;
    font-size:13px; color:var(--muted);
  }
  .success-points {
    display:block; margin-top:14px;
    font-size:24px; font-weight:700; color:var(--primary);
  }
  .success-btn {
    margin-top:22px; height:44px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px; background:var(--primary); color:#fff;
    font-size:14px; font-weight:600; cursor:pointer;
  }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <a class="back-btn" href="index.html">‹</a>

  <!-- 会员区 -->
  <div class="member-hero">
    <span class="member-badge">SILVER</span>
    <span class="member-greeting">下午好，咖啡爱好者</span>
    <div class="points-display">
      <span class="points-number">3,280</span>
      <span class="points-unit">积分</span>
    </div>
    <div class="level-progress">
      <div class="progress-bar">
        <div class="progress-fill" style="width:62%"></div>
      </div>
      <span class="progress-text">距离黄金会员还需 380 EXP</span>
    </div>
  </div>

  <!-- 签到区 -->
  <div class="checkin-section">
    <div class="checkin-header">
      <span class="checkin-title">每日签到仪式</span>
      <span class="checkin-streak">已连续 <em>3</em> 天</span>
    </div>
    <div class="strip-days" id="dayGrid"></div>
    <div class="checkin-action">
      <div class="checkin-btn" id="signinBtn" onclick="doSignin()">立即签到</div>
      <span class="checkin-hint" id="signinHint">今日签到可获得 <em>2</em> 积分</span>
    </div>
  </div>

  <!-- 权益说明 -->
  <div class="benefits-section">
    <span class="benefits-title">积分说明</span>
    <div class="benefit-card">
      <span class="benefit-head">每日签到</span>
      <span class="benefit-desc">每签到一次固定获得 2 积分。连续签到 7 天额外赠送满 35 减 10 元优惠券，有效期 3 天。</span>
    </div>
    <div class="benefit-card">
      <span class="benefit-head">连续签到</span>
      <span class="benefit-desc">中断签到后连续天数重新计算。坚持每天来打卡，培养你的咖啡仪式感。</span>
    </div>
    <div class="benefit-card">
      <span class="benefit-head">积分使用</span>
      <span class="benefit-desc">签到积分有效期 365 天，可在积分商城兑换优惠券、限量周边与咖啡礼盒。</span>
    </div>
    <div class="benefit-card">
      <span class="benefit-head">会员成长</span>
      <span class="benefit-desc">消费 1 元 = 1 积分 = 1 EXP，积分累积同步提升会员等级，解锁更多专属权益。</span>
    </div>
  </div>

</div>

<!-- 成功弹窗 -->
<div class="modal-mask" id="successModal" onclick="closeModal()">
  <div class="success-modal" onclick="event.stopPropagation()">
    <div class="success-icon">✓</div>
    <span class="success-title">今日签到完成</span>
    <span class="success-sub">一杯好咖啡，从此刻开始</span>
    <span class="success-points">+2 积分</span>
    <div class="success-btn" onclick="closeModal()">知道了</div>
  </div>
</div>

<script>
  const DAY_LABELS = ['一','二','三','四','五','六','日'];
  const DAY_POINTS = [2,2,2,2,2,2,10];
  let consecutive = 3; // 已连续签到 3 天
  let signed = false;

  function renderDays() {
    const grid = document.getElementById('dayGrid');
    grid.innerHTML = DAY_LABELS.map((label, i) => {
      let cls = 'strip-day';
      if (i < consecutive) cls += ' signed';
      else if (i === consecutive) cls += ' today';
      if (i === 6) cls += ' gift';
      return `
        <div class="${cls}">
          <span class="day-label">${label}</span>
          <span class="day-pts">+${DAY_POINTS[i]}</span>
        </div>`;
    }).join('');
  }
  renderDays();

  function doSignin() {
    if (signed) return;
    signed = true;
    const btn = document.getElementById('signinBtn');
    btn.textContent = '今日已签到';
    btn.classList.add('done');
    document.getElementById('signinHint').innerHTML = '明天签到可获得 <em>2</em> 积分';
    // update strip: mark today as signed
    const days = document.querySelectorAll('.strip-day');
    days[consecutive].classList.remove('today');
    days[consecutive].classList.add('signed');

    document.getElementById('successModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('successModal').classList.remove('open');
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
