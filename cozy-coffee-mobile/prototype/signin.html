<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>每日签到 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --glaze-green:#526C43; --glaze-green-soft:#E8EDE5;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    /* aliases */
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22; --accent:#526C43;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:14px;
    font-size:26px; line-height:1;
    color:var(--ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 20px 120px; }

  /* ── 签到区 ── */
  .checkin-section {
    margin-top:20px; padding:28px 24px;
    border-radius:14px; background:var(--card);
  }
  .checkin-head {
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:26px;
  }
  .checkin-title {
    display:block;
    font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
  }
  .checkin-sub {
    display:block; margin-top:4px;
    font-size:12px; color:var(--muted);
  }
  .checkin-streak {
    flex:none;
    font-size:12px; color:var(--muted);
    padding-bottom:2px;
  }

  /* 咖啡豆轨迹 */
  .bean-track { position:relative; padding:22px 0 6px; }
  .track-line {
    position:absolute; top:34px; left:16px; right:16px;
    height:3px; border-radius:2px;
    background:var(--border);
    transform:translateY(-50%);
  }
  .track-line-fill {
    height:100%; border-radius:2px;
    background:var(--primary);
    transition:width .5s ease;
  }
  .bean-steps {
    display:flex; justify-content:space-between;
    position:relative; z-index:2;
  }
  .bean-step {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:36px;
  }
  .bean-icon {
    width:32px; height:32px; border-radius:50%;
    background:var(--porcelain-muted); color:var(--placeholder);
    border:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:center;
    transition:all .3s;
  }
  .bean-icon.active {
    background:var(--roast-brown); color:#F2EDE8;
    border-color:var(--roast-brown);
  }
  .bean-icon.active.today {
    box-shadow:0 0 0 4px rgba(198,156,109,.35);
  }
  .bean-icon.is-gift { border-radius:12px; }
  .bean-svg { width:16px; height:16px; }
  .bean-label { font-size:11px; color:var(--placeholder); }
  .bean-step.active .bean-label { color:var(--roastery-ink); font-weight:600; }
  .bean-step.active.today .bean-label { color:var(--roast-brown); font-weight:700; }
  .bean-step.today .bean-label { color:var(--roast-brown); font-weight:700; }

  .checkin-foot {
    margin-top:18px; padding:12px 16px;
    border-radius:8px;
    background:var(--surface);
    font-size:13px; color:var(--muted);
  }
  .checkin-foot em {
    font-style:normal; color:var(--primary); font-weight:700;
  }
  .checkin-foot.success {
    background:var(--porcelain-muted); color:var(--roast-brown);
  }

  /* 签到主操作按钮（Porcelain） */
  .signin-btn {
    width:100%; height:48px;
    margin-top:22px;
    border:1px solid var(--border); border-radius:10px;
    background:var(--card); color:var(--ink);
    font-size:15px; font-weight:600; cursor:pointer;
    font-family:inherit;
    transition:border-color .25s;
  }
  .signin-btn:active { border-color:var(--ink); }
  .signin-btn.done {
    background:var(--card); color:var(--muted);
    border:1px solid var(--border);
    cursor:default;
  }
  .signin-btn.done:active { border-color:var(--border); }
  .checkin-hint {
    display:block; margin-top:12px;
    font-size:12px; color:var(--muted);
    letter-spacing:.04em;
  }
  .checkin-hint em {
    font-style:normal; color:var(--primary); font-weight:700;
  }

  /* ── 权益说明（Editorial） ── */
  .benefits-section {
    margin-top:20px; padding:28px 24px;
    border-radius:14px; background:var(--card);
  }
  .benefits-title {
    display:block; margin-bottom:22px;
    font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
  }
  .benefit-card {
    padding:16px 0;
    border-bottom:1px solid var(--border);
  }
  .benefit-card:last-child { border-bottom:0; padding-bottom:0; }
  .benefit-head {
    display:block;
    font-size:14px; font-weight:600; color:var(--ink);
    letter-spacing:.04em;
  }
  .benefit-desc {
    display:block; margin-top:8px;
    font-size:13px; line-height:1.7; color:var(--muted);
  }

  /* ── 签到成功浮层（居中悬浮墨黑卡，釉绿对勾） ── */
  .toast-mask {
    position:fixed; left:50%; top:64px;
    transform:translate(-50%,-150%);
    z-index:50; pointer-events:none;
    opacity:0;
    transition:opacity .3s ease, transform .45s cubic-bezier(.22,1,.36,1);
  }
  .toast-mask.open { opacity:1; transform:translate(-50%,0); }
  .signin-toast {
    display:flex; align-items:center; gap:10px;
    padding:13px 20px;
    border-radius:12px;
    background:var(--cask); color:#fff;
    box-shadow:0 4px 12px rgba(43,30,22,.1);
  }
  .toast-check {
    flex:none; width:24px; height:24px; border-radius:50%;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .toast-check svg { width:12px; height:12px; }
  .toast-copy { flex:none; }
  .toast-title { display:block; font-size:14px; font-weight:650; line-height:1.3; }
  .toast-sub { display:block; margin-top:2px; font-size:11px; color:rgba(255,255,255,.7); }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <a class="back-btn" onclick="goBack('index.html')">‹</a>

  <!-- 签到区 -->
  <div class="checkin-section">
    <div class="checkin-head">
      <div>
        <span class="checkin-title">每日签到</span>
        <span class="checkin-sub">连续签到 7 天可领惊喜礼包</span>
      </div>
      <span class="checkin-streak" id="streakText">已连续 3 天</span>
    </div>
    <div class="bean-track">
      <div class="track-line">
        <div class="track-line-fill" id="trackFill" style="width:33%"></div>
      </div>
      <div class="bean-steps" id="dayGrid"></div>
    </div>
    <button class="signin-btn" id="signinBtn" onclick="doSignin()">立即签到</button>
    <div class="checkin-foot" id="signinHint">再签 <em>3</em> 天领满35减10券</div>
  </div>

  <!-- 权益说明 -->
  <div class="benefits-section">
    <span class="benefits-title">积分说明</span>
    <div class="benefit-card">
      <span class="benefit-head">每日签到</span>
      <span class="benefit-desc">每签到一次固定获得 2 积分。连续签到 7 天额外赠送满 35 减 10 元优惠券，有效期 3 天。</span>
    </div>
    <div class="benefit-card">
      <span class="benefit-head">连续签到</span>
      <span class="benefit-desc">中断签到后连续天数重新计算。坚持每天来打卡，培养你的咖啡仪式感。</span>
    </div>
    <div class="benefit-card">
      <span class="benefit-head">积分使用</span>
      <span class="benefit-desc">签到积分有效期 365 天，可在积分商城兑换优惠券、限量周边与咖啡礼盒。</span>
    </div>
    <div class="benefit-card">
      <span class="benefit-head">会员成长</span>
      <span class="benefit-desc">消费 1 元 = 1 积分 = 1 EXP，积分累积同步提升会员等级，解锁更多专属权益。</span>
    </div>
  </div>

</div>

<!-- 签到成功浮层（居中悬浮墨黑卡） -->
<div class="toast-mask" id="toastMask">
  <div class="signin-toast">
    <span class="toast-check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
    <div class="toast-copy">
      <span class="toast-title" id="bannerTitle">签到成功 +2 积分</span>
      <span class="toast-sub" id="bannerSub">已连续签到 3 天</span>
    </div>
  </div>
</div>

<script>
  const BEAN_SVG = '<svg class="bean-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="7.8" ry="9.5"/><path d="M12 2.5c-2 3-1.6 7.5-.5 9.5 1.1 2 1.5 6.5-.5 9.5"/></svg>';
  const GIFT_SVG = '<svg class="bean-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>';

  let consecutive = 3; // 已连续签到 3 天
  let signed = false;

  function updateTrackFill() {
    // 进度线：已签到天数到第7天礼盒
    const pct = Math.max(0, (consecutive - 1) / 6 * 100);
    document.getElementById('trackFill').style.width = pct + '%';
  }

  function renderDays() {
    const grid = document.getElementById('dayGrid');
    grid.innerHTML = Array.from({length: 7}, (_, i) => {
      const isToday = (i === consecutive && !signed);
      const stepCls = (i < consecutive ? 'active' : '') + (isToday ? ' today' : '');
      let iconCls = 'bean-icon';
      if (i <= consecutive) iconCls += ' active';
      if (isToday) iconCls += ' today';
      if (i === 6) iconCls += ' is-gift';
      const icon = i === 6 ? GIFT_SVG : BEAN_SVG;
      const label = i === 6 ? '礼包' : (isToday ? '今日' : '+2');
      return `
        <div class="bean-step ${stepCls}">
          <div class="${iconCls}">${icon}</div>
          <span class="bean-label">${label}</span>
        </div>`;
    }).join('');
    updateTrackFill();
    document.getElementById('streakText').textContent = '已连续 ' + consecutive + ' 天';
  }
  renderDays();

  function doSignin() {
    if (signed) return;
    signed = true;
    consecutive += 1;

    // 今日 bean：去掉位置标记，标签转 +2
    const cell = document.querySelectorAll('.bean-step')[consecutive - 1];
    cell.querySelector('.bean-icon').classList.remove('today');
    if (consecutive - 1 !== 6) cell.querySelector('.bean-label').textContent = '+2';
    updateTrackFill();
    document.getElementById('streakText').textContent = '已连续 ' + consecutive + ' 天';

    const btn = document.getElementById('signinBtn');
    btn.className = 'signin-btn done';
    btn.textContent = '今日已签到 ✓';
    btn.disabled = true;

    const hint = document.getElementById('signinHint');
    if (consecutive >= 7) {
      hint.className = 'checkin-foot success';
      hint.innerHTML = '连续签到 7 天！礼包已到账';
    } else {
      hint.innerHTML = `再签 <em>${7 - consecutive}</em> 天领满35减10券`;
    }

    showBanner(`签到成功 +${2} 积分`, `已连续签到 ${consecutive} 天`);
  }

  let bannerTimer = null;
  function showBanner(title, sub) {
    document.getElementById('bannerTitle').textContent = title;
    document.getElementById('bannerSub').textContent = sub;
    document.getElementById('toastMask').classList.add('open');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => {
      document.getElementById('toastMask').classList.remove('open');
    }, 2200);
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }
</script>
</body>
</html>
