<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>商品详情 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--surface); color:var(--ink);
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --ink:#2B1E16; --muted:#756A63; --placeholder:#9E948E;
    --primary:#753A22; --primary-deep:#5E2E1B;
    --accent:#526C43; --accent-soft:#E8EDE5;
    --border:#E3DED8; --surface:#F7F5F3; --card:#FFFFFF;
    --danger:#9B3932;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部导航 ── */
  .top-nav {
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:var(--card);
    border-bottom:1px solid var(--border);
  }
  .nav-back { font-size:26px; line-height:1; color:var(--ink); cursor:pointer; padding:6px 4px; width:32px; text-decoration:none; }
  .nav-title { position:absolute; left:50%; transform:translateX(-50%); font-size:16px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .nav-right { width:32px; }

  /* ── 原型示例切换（实物 / 虚拟） ── */
  .demo-switch { display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 16px 2px; }
  .demo-label { font-size:10px; color:var(--placeholder); letter-spacing:.06em; }
  .seg { display:flex; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:3px; }
  .seg-btn {
    border:0; background:transparent; padding:6px 14px; border-radius:999px;
    font-size:12px; color:var(--muted); cursor:pointer; font-family:inherit;
  }
  .seg-btn.active { background:var(--ink); color:#fff; font-weight:600; }

  /* ── 商品大图 ── */
  .detail-image-area {
    padding:34px 48px 22px;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-image {
    width:224px; height:224px; border-radius:12px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 14px rgba(43,30,22,.08);
  }
  .detail-image svg { width:62%; height:62%; }

  /* ── 商品头 ── */
  .detail-head { padding:0 24px 20px; background:var(--card); border-bottom:1px solid var(--border); }
  .detail-name {
    display:block;
    font-family:var(--serif); font-size:22px; font-weight:600;
    color:var(--ink); line-height:1.3;
  }
  .detail-tags { margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; }
  .tag {
    display:inline-block; padding:5px 11px;
    font-size:11px; border:1px solid var(--ink);
    color:var(--ink); border-radius:2px; letter-spacing:.02em;
  }
  .tag--limit { border-color:var(--danger); color:var(--danger); }

  /* ── 积分价（会员折扣 + 划线原价） ── */
  .price-row {
    margin-top:18px; padding-top:16px;
    border-top:1px solid var(--border);
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
  }
  .price-label { font-size:12px; color:var(--muted); padding-bottom:8px; flex:none; }
  .price-right { text-align:right; min-width:0; }
  .price-line { display:flex; align-items:baseline; justify-content:flex-end; gap:7px; flex-wrap:wrap; }
  .price-current { font-family:var(--serif); font-size:28px; font-weight:700; color:var(--primary); line-height:1; }
  .price-unit { font-size:12px; color:var(--muted); }
  .price-original { font-size:13px; color:var(--placeholder); text-decoration:line-through; }
  .price-badge {
    display:inline-block; padding:2px 7px;
    font-size:10px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); border-radius:999px;
  }
  .price-context { margin-top:8px; font-size:11px; color:var(--placeholder); }

  /* ── 详情说明 ── */
  .detail-sections { background:var(--card); padding:0 24px; }
  .detail-section { padding:18px 0; border-bottom:1px solid var(--border); }
  .detail-section:last-child { border-bottom:0; }
  .section-label { display:block; font-size:14px; font-weight:600; color:var(--ink); }
  .section-value { display:block; margin-top:8px; font-size:13px; line-height:1.7; color:var(--muted); }

  /* ── 底部兑换区 ── */
  .detail-cta-wrap {
    padding:20px 24px 30px;
    background:var(--card);
    border-top:1px solid var(--border);
  }
  .redeem-hint {
    display:flex; align-items:flex-start; gap:8px;
    padding:12px 14px; margin-bottom:18px;
    background:var(--accent-soft); border-radius:10px;
    font-size:12px; color:var(--accent); line-height:1.55;
  }
  .redeem-hint svg { flex:none; width:16px; height:16px; margin-top:1px; }
  .hint-tag { flex:none; font-weight:700; }

  .quantity-row {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px;
  }
  .quantity-label { color:var(--muted); font-size:14px; }
  .stepper { display:flex; align-items:center; overflow:hidden; border:1px solid var(--border); border-radius:999px; }
  .stepper-btn { width:42px; padding:7px 0; color:var(--ink); font-size:20px; text-align:center; cursor:pointer; }
  .stepper-btn.disabled { color:var(--placeholder); cursor:not-allowed; }
  .stepper-value { min-width:34px; color:var(--ink); font-size:15px; font-weight:600; text-align:center; }

  .detail-cta {
    height:48px; display:flex; align-items:center; justify-content:center;
    background:var(--ink); color:#fff; font-size:15px; font-weight:600;
    border-radius:24px; cursor:pointer;
    transition:opacity .2s;
  }
  .detail-cta:active { opacity:.85; }
  .detail-cta.disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }

  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(43,30,22,.88); color:#F7F5F3;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease; max-width:82%;
    text-align:center;
  }
</style>
</head>
<body>

  <!-- 顶部导航 -->
  <div class="top-nav">
    <a class="nav-back" href="mall.html">‹</a>
    <span class="nav-title">商品详情</span>
    <span class="nav-right"></span>
  </div>

  <!-- 原型示例：实物周边 / 虚拟权益 -->
  <div class="demo-switch">
    <span class="demo-label">原型示例</span>
    <div class="seg">
      <button class="seg-btn active" data-type="physical" onclick="switchType('physical')">实物周边</button>
      <button class="seg-btn" data-type="virtual" onclick="switchType('virtual')">虚拟权益</button>
    </div>
  </div>

  <div class="detail-body">
    <!-- 商品大图 -->
    <div class="detail-image-area">
      <div class="detail-image" id="detailImage"></div>
    </div>

    <!-- 商品头 -->
    <div class="detail-head">
      <span class="detail-name" id="detailName"></span>
      <div class="detail-tags">
        <span class="tag" id="memberTag"></span>
        <span class="tag tag--limit" id="limitTag"></span>
      </div>
      <div class="price-row">
        <span class="price-label">积分价</span>
        <div class="price-right">
          <div class="price-line">
            <span class="price-current" id="priceCurrent"></span>
            <span class="price-unit">积分</span>
            <span class="price-original" id="priceOriginal"></span>
            <span class="price-badge" id="priceBadge"></span>
          </div>
          <div class="price-context" id="priceContext"></div>
        </div>
      </div>
    </div>

    <!-- 详情说明 -->
    <div class="detail-sections" id="detailSections"></div>

    <!-- 底部兑换区 -->
    <div class="detail-cta-wrap">
      <div class="redeem-hint" id="redeemHint"></div>
      <div class="quantity-row" id="quantityRow">
        <span class="quantity-label">兑换数量</span>
        <div class="stepper">
          <span class="stepper-btn" id="stepperMinus" onclick="decreaseQuantity()">−</span>
          <span class="stepper-value" id="stepperValue">1</span>
          <span class="stepper-btn" id="stepperPlus" onclick="increaseQuantity()">＋</span>
        </div>
      </div>
      <div class="detail-cta" id="detailCta" onclick="redeem()"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // 当前用户：白银会员 · 1200 积分 · 兑换享 98 折
  const USER = { levelName: '白银会员', points: 1200, discount: 0.98 };

  const ICONS = {
    mug: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 22h32v22a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z"/><path d="M46 28h6a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-6"/><path d="M20 14c0 2 2 2 2 4s-2 2-2 4M28 14c0 2 2 2 2 4s-2 2-2 4M36 14c0 2 2 2 2 4s-2 2-2 4"/></svg>',
    star: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8l6 14 16 2-12 11 3 16-13-8-13 8 3-16-12-11 16-2z"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.4-7-11a7 7 0 0 1 14 0c0 5.6-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    coupon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v3.5a2 2 0 0 1 0 3V17H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><path d="M20 10.5v3"/></svg>'
  };

  const EXAMPLES = {
    physical: {
      name: '拿铁金定制马克杯',
      icon: ICONS.mug, iconColor: 'rgba(43,30,22,.55)',
      gradient: 'linear-gradient(135deg,#F0E8DA,#B8A988)',
      memberTag: '白银及以上会员', limitTag: '限兑 2 件',
      pointsPrice: 1200, money: '¥128.00',
      typeValue: '实物周边 · 礼品',
      validity: '兑换后 14 天内发货',
      description: '哑光米白 · 12 oz · Cozy 烫金 logo',
      fulfillment: '到店自提 · 邮寄到家',
      stepper: false,
      hintTag: '实物兑换', hintIcon: ICONS.pin
    },
    virtual: {
      name: '任选饮品通兑券',
      icon: ICONS.star, iconColor: 'rgba(255,255,255,.94)',
      gradient: 'linear-gradient(135deg,#C69C6D,#8B6E45)',
      memberTag: '白银及以上会员', limitTag: '限兑 2 件',
      pointsPrice: 800, money: '¥40.00',
      typeValue: '优惠券 · 虚拟权益',
      validity: '自获取之日起 30 天内有效',
      description: '全场饮品通用，最高抵扣 ¥40，超出补差价',
      fulfillment: '兑换后自动发放至券包',
      stepper: true,
      hintTag: '虚拟兑换', hintIcon: ICONS.coupon
    }
  };

  let type = 'physical';
  let qty = 1;
  const limit = 2;

  function costFor(q) {
    const p = EXAMPLES[type];
    return Math.ceil(p.pointsPrice * q * USER.discount);
  }

  function render() {
    const p = EXAMPLES[type];
    const cost = costFor(qty);

    // 商品大图
    const img = document.getElementById('detailImage');
    img.style.background = p.gradient;
    img.innerHTML = `<span style="display:flex;color:${p.iconColor}">${p.icon}</span>`;

    // 名称 / 标签
    document.getElementById('detailName').textContent = p.name;
    document.getElementById('memberTag').textContent = p.memberTag;
    document.getElementById('limitTag').textContent = p.limitTag;

    // 积分价（会员折扣 + 划线原价）
    const original = p.pointsPrice * qty;
    document.getElementById('priceCurrent').textContent = cost.toLocaleString();
    document.getElementById('priceOriginal').textContent = original.toLocaleString() + ' 积分';
    document.getElementById('priceBadge').textContent = `${USER.levelName} ${Math.round(USER.discount * 100)} 折`;
    document.getElementById('priceContext').textContent = `可用积分 ${USER.points.toLocaleString()} · 会员价折后`;

    // 详情说明
    document.getElementById('detailSections').innerHTML = [
      ['商品类型', p.typeValue],
      ['有效期限', p.validity],
      ['商品说明', p.description],
      ['参考价值', p.money],
      ['领取方式', p.fulfillment]
    ].map(([l, v]) => `<div class="detail-section"><span class="section-label">${l}</span><span class="section-value">${v}</span></div>`).join('');

    // 兑换提示（虚拟 / 实物）
    document.getElementById('redeemHint').innerHTML =
      `<span style="display:flex;width:100%">${p.hintIcon}</span>` +
      `<span><span class="hint-tag">${p.hintTag} ·</span>${p.fulfillment}，${p.validity}</span>`;

    // 数量步进器（仅虚拟权益显示）
    const qr = document.getElementById('quantityRow');
    qr.style.display = p.stepper ? 'flex' : 'none';
    document.getElementById('stepperValue').textContent = qty;
    document.getElementById('stepperMinus').classList.toggle('disabled', qty <= 1);
    document.getElementById('stepperPlus').classList.toggle('disabled', !canIncrease());

    updateCta();
  }

  function canIncrease() {
    return qty < limit && costFor(qty + 1) <= USER.points;
  }

  function updateCta() {
    const cost = costFor(qty);
    const cta = document.getElementById('detailCta');
    if (cost <= USER.points) {
      cta.classList.remove('disabled');
      cta.textContent = `立即兑换 · ${cost.toLocaleString()} 积分`;
    } else {
      cta.classList.add('disabled');
      cta.textContent = `积分不足 · 还差 ${(cost - USER.points).toLocaleString()} 积分`;
    }
  }

  function switchType(t) {
    type = t; qty = 1;
    document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.type === t));
    render();
  }

  function decreaseQuantity() {
    if (qty > 1) { qty--; render(); }
  }
  function increaseQuantity() {
    if (canIncrease()) { qty++; render(); }
  }

  function redeem() {
    const cost = costFor(qty);
    const p = EXAMPLES[type];
    if (cost > USER.points) { toast('积分不足'); return; }
    toast(`已兑换「${p.name}」· ${cost.toLocaleString()} 积分`);
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1400);
  }

  render();
</script>
</body>
</html>
