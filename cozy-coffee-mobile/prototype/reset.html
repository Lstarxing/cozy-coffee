<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>修改密码 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --glaze-green:#526C43; --glaze-green-soft:#E8EDE5;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22; --accent:#526C43;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部原生式导航：返回 + 居中标题 ── */
  .top-nav {
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
  }
  .nav-back {
    font-size:26px; line-height:1; color:var(--ink);
    cursor:pointer; padding:6px 4px; width:32px;
  }
  .nav-back:active { opacity:.5; }
  .nav-title {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:16px; font-weight:600; color:var(--ink);
    white-space:nowrap;
  }
  .nav-right { width:32px; }

  .page {
    padding:0 24px 30px;
    display:flex; flex-direction:column; min-height:calc(100vh - 60px);
  }

  /* ── 品牌区（含咖啡豆徽标） ── */
  .auth-hero { text-align:center; padding:14px 0 18px; }
  .brand-emblem {
    width:60px; height:60px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:var(--card);
    border:1px solid var(--border);
  }
  .brand-emblem svg { width:22px; height:22px; }
  .brand-word {
    display:block; margin-top:12px;
    font-size:11px; font-weight:800; letter-spacing:.3em; color:var(--ink);
  }
  .hero-title {
    display:block; margin-top:10px;
    font-family:var(--serif); font-size:26px; font-weight:600; color:var(--ink);
  }
  .hero-sub {
    display:block; margin-top:7px;
    font-size:12px; color:var(--muted);
  }

  /* ── 表单卡 ── */
  .auth-card {
    background:var(--card); border-radius:14px;
    padding:20px 20px 16px;
  }
  .field { padding:12px 0; border-bottom:1px solid var(--border); }
  .field-label { display:block; font-size:11px; font-weight:650; color:var(--muted); }
  .field-input-wrap { margin-top:6px; display:flex; align-items:center; gap:8px; }
  .field-input {
    flex:1; min-width:0;
    border:none; background:transparent;
    font-size:15px; color:var(--ink); font-family:inherit;
    padding:4px 0;
  }
  .field-input::placeholder { color:var(--placeholder); }
  .field-input:focus { outline:none; }
  .field-toggle {
    flex:none; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); cursor:pointer;
  }
  .field-toggle:active { opacity:.6; }
  .field-toggle svg { width:20px; height:20px; }

  .submit-btn {
    width:100%; height:46px; margin-top:20px;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius:999px;
    background:var(--ink); color:#fff;
    font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .submit-btn:active { opacity:.85; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <!-- 顶部导航 -->
  <div class="top-nav">
    <span class="nav-back" onclick="goBack('login.html')">‹</span>
    <span class="nav-title">修改密码</span>
    <span class="nav-right"></span>
  </div>

  <!-- 品牌区（含咖啡豆徽标） -->
  <div class="auth-hero">
    <div class="brand-emblem">
      <svg viewBox="0 0 24 24" fill="none" stroke="#753A22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="7.8" ry="9.5"/><path d="M12 2.5c-2 3-1.6 7.5-.5 9.5 1.1 2 1.5 6.5-.5 9.5"/></svg>
    </div>
    <span class="brand-word">COZY COFFEE</span>
    <span class="hero-title">修改密码</span>
    <span class="hero-sub">修改后需重新登录，请牢记新密码</span>
  </div>

  <!-- 表单卡 -->
  <div class="auth-card">
    <div class="field">
      <span class="field-label">原密码</span>
      <div class="field-input-wrap">
        <input class="field-input" id="oldPwd" type="password" placeholder="请输入当前密码">
        <span class="field-toggle" data-target="oldPwd" onclick="toggleEye(this)"></span>
      </div>
    </div>
    <div class="field">
      <span class="field-label">新密码</span>
      <div class="field-input-wrap">
        <input class="field-input" id="newPwd" type="password" placeholder="6-20 位新密码">
        <span class="field-toggle" data-target="newPwd" onclick="toggleEye(this)"></span>
      </div>
    </div>
    <div class="field">
      <span class="field-label">确认新密码</span>
      <div class="field-input-wrap">
        <input class="field-input" id="confirmPwd" type="password" placeholder="再次输入新密码">
        <span class="field-toggle" data-target="confirmPwd" onclick="toggleEye(this)"></span>
      </div>
    </div>

    <div class="submit-btn" onclick="submitChange()">确认修改</div>
  </div>

</div>

<script>
  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  function toggleEye(el) {
    const input = document.getElementById(el.dataset.target);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    el.innerHTML = show ? EYE_OFF : EYE;
  }

  function submitChange() {
    const oldPwd = document.getElementById('oldPwd').value;
    const newPwd = document.getElementById('newPwd').value;
    const confirmPwd = document.getElementById('confirmPwd').value;
    if (!oldPwd) { toast('请输入原密码'); return; }
    if (newPwd.length < 6 || newPwd.length > 20) { toast('新密码需为 6-20 位'); return; }
    if (newPwd === oldPwd) { toast('新密码不能与原密码相同'); return; }
    if (newPwd !== confirmPwd) { toast('两次输入的新密码不一致'); return; }
    toast('密码已修改，请重新登录');
    setTimeout(() => { location.href = 'login.html'; }, 1200);
  }

  document.querySelectorAll('.field-toggle').forEach(el => { el.innerHTML = EYE; });

  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
