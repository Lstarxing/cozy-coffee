<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的券包 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F5F3; color:#2B1E16;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --primary:#753A22; --primary-deep:#5E2E1B;
    --caramel:#A9712F; --caramel-soft:#F6EAD9; --brown-soft:#F3E9DF;
    --ink:#2B1E16; --muted:#756A63; --placeholder:#9E948E;
    --border:#E3DED8; --surface:#F7F5F3; --card:#FFFFFF; --cask:#2C1E18;
    --error:#FF4D4F;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .page { padding:16px 20px 110px; }

  /* 顶部固定筛选（原生导航标题） */
  .filter-tabs {
    display:flex;
    position:sticky; top:0; z-index:10;
    background:var(--card);
    border-bottom:1px solid var(--border);
  }
  .filter-tab {
    flex:1; padding:14px 0;
    text-align:center;
    font-size:14px; color:var(--muted);
    cursor:pointer; position:relative;
    transition:color .25s;
  }
  .filter-tab.active { color:var(--ink); font-weight:600; }
  .filter-tab.active::after {
    content:''; position:absolute;
    left:50%; bottom:-1px; transform:translateX(-50%);
    width:22px; height:2px;
    background:var(--ink);
  }

  /* 选择模式：不使用优惠券（灰色提示） */
  .none-hint {
    margin:16px 4px 0; padding:12px;
    border-radius:8px; background:var(--surface);
    color:var(--muted); font-size:12px; text-align:center;
    cursor:pointer;
  }

  .coupon-list {
    display:flex; flex-direction:column; gap:12px;
    margin-top:16px;
  }

  /* ── 券卡片（主题色价值区） ── */
  .coupon-card {
    display:flex; align-items:stretch;
    border-radius:14px; background:var(--card);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .coupon-card.disabled, .coupon-card.frozen, .coupon-card.used, .coupon-card.expired { opacity:.85; }
  .card-left {
    flex:none; width:88px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    background:var(--primary); color:#fff;
  }
  .value-symbol {
    font-family:var(--serif); font-size:20px; font-weight:700; line-height:1; color:#fff;
  }
  .value-type { font-size:10px; opacity:.92; }

  .theme-black-gold .card-left { background:#171411; }
  .theme-black-gold .value-symbol, .theme-black-gold .value-type { color:#E6C97A; }
  .theme-gold .card-left { background:#C9A45C; }
  .theme-silver .card-left { background:#8C857D; }
  .theme-diamond .card-left { background:#5B7A8C; }
  .theme-promo .card-left { background:#B3562B; }
  .theme-utility .card-left { background:#6E6A64; }

  .card-center {
    flex:1; min-width:0;
    padding:14px 12px;
    display:flex; flex-direction:column; gap:5px;
  }
  .header { display:flex; align-items:center; gap:6px; }
  .title {
    min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    font-size:14px; font-weight:650; color:var(--ink);
  }
  .title.premium { color:var(--primary); }
  .source-tag {
    flex:none; padding:1px 6px; border-radius:999px;
    background:var(--surface); color:var(--muted);
    font-size:9px; font-weight:600;
  }
  .condition { font-size:11px; color:var(--muted); line-height:1.5; }
  .date-row { display:flex; align-items:center; gap:6px; }
  .date { font-size:10px; color:var(--placeholder); }
  .date.urgent { color:var(--error); font-weight:650; }
  .days-left {
    padding:1px 6px; border-radius:999px;
    background:#FFF5E8; color:#B3562B;
    font-size:9px; font-weight:650;
  }

  .card-right {
    flex:none; width:64px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:0 6px;
  }
  .urgent-tip { color:var(--error); font-size:10px; font-weight:650; }
  .use-btn {
    width:100%; height:32px;
    display:flex; align-items:center; justify-content:center;
    border-radius:999px;
    background:var(--ink); color:#fff;
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .use-btn.disabled { background:var(--border); color:var(--muted); }
  .status-tag { font-size:11px; font-weight:600; color:var(--placeholder); }

  /* 空状态 */
  .empty-state {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh;
  }
  .empty-mark {
    width:64px; height:64px; border-radius:50%;
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--primary);
  }
  .empty-mark svg { width:34px; height:34px; }
  .empty-text { margin-top:20px; font-family:var(--serif); font-size:20px; font-weight:600; color:var(--ink); }
  .empty-hint { margin-top:10px; font-size:13px; color:var(--muted); }

  /* Toast */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <div class="filter-tabs">
    <div class="filter-tab active" data-f="available" onclick="switchTab(this)">可使用</div>
    <div class="filter-tab" data-f="unavailable" onclick="switchTab(this)">不可使用</div>
  </div>

  <div class="none-hint" id="noneHint" style="display:none" onclick="toast('不使用优惠券')">不使用优惠券，按商品原价结算</div>

  <div class="coupon-list" id="couponList"></div>

</div>

<script>
  const COUPON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v4a2.2 2.2 0 0 0 0 4.4V19H4v-3.6a2.2 2.2 0 0 0 0-4.4z"/><circle cx="9" cy="12" r=".8" fill="currentColor" stroke="none"/></svg>';

  // 券数据对齐 CouponCard：theme / valueSymbol / valueType / status / sourceTag / daysLeft / expireText
  const coupons = [
    { id:1, status:'available', theme:'default',  valueSymbol:'¥5',     valueType:'代金',   name:'5 元代金券',         sourceTag:'', condition:'全场通用',          expireText:'有效期至 2026.08.18', daysLeft:2, urgent:true },
    { id:2, status:'available', theme:'utility',  valueSymbol:'免运',   valueType:'配送费', name:'配送费抵扣券',       sourceTag:'', condition:'仅限外送',            expireText:'有效期至 2026.08.13', daysLeft:5 },
    { id:3, status:'available', theme:'promo',    valueSymbol:'¥10',    valueType:'代金',   name:'新品立减券',         sourceTag:'新品礼', condition:'新品饮品可用',      expireText:'有效期至 2026.08.09', daysLeft:1, urgent:true },
    { id:4, status:'available', theme:'gold',     valueSymbol:'35减10', valueType:'代金',   name:'签到满减券',         sourceTag:'', condition:'满 ¥35 可用',          expireText:'有效期至 2026.08.21', daysLeft:8 },
    { id:5, status:'available', theme:'black-gold', valueSymbol:'尊享', valueType:'免单',   name:'黑金尊享通兑券',     sourceTag:'月权益', condition:'全场饮品通兑',      expireText:'有效期至 2026.08.30', daysLeft:12 },
    { id:6, status:'frozen',    theme:'default',  valueSymbol:'¥5',     valueType:'代金',   name:'5 元代金券',         sourceTag:'', condition:'冻结中 · 订单待支付',   expireText:'冻结中' },
    { id:7, status:'used',      theme:'default',  valueSymbol:'8.8折',  valueType:'折扣',   name:'全场 8.8 折券',      sourceTag:'', condition:'全场通用',            expireText:'已使用' },
    { id:8, status:'expired',   theme:'silver',   valueSymbol:'¥5',     valueType:'代金',   name:'配送费抵扣券',       sourceTag:'', condition:'仅限外卖配送',        expireText:'已过期' }
  ];

  const STATUS_TEXT = { available:'可使用', frozen:'冻结中', used:'已使用', expired:'已过期' };

  function render(filter) {
    const list = document.getElementById('couponList');
    const shown = filter === 'available'
      ? coupons.filter(c => c.status === 'available')
      : coupons.filter(c => ['frozen','used','expired'].includes(c.status));
    document.getElementById('noneHint').style.display = 'none';

    if (!shown.length) {
      list.innerHTML = `
        <div class="empty-state">
          <span class="empty-mark">${COUPON_ICON}</span>
          <span class="empty-text">暂无${filter === 'available' ? '可使用' : '不可使用'}的优惠券</span>
          <span class="empty-hint">去积分商城兑换更多优惠券</span>
        </div>`;
      return;
    }

    list.innerHTML = shown.map(c => {
      const available = c.status === 'available';
      const disabled = c.status === 'frozen';
      const daysLeft = c.daysLeft > 0 && c.daysLeft <= 7
        ? `<span class="days-left">剩${c.daysLeft}天</span>` : '';
      const urgentTip = c.urgent ? '<span class="urgent-tip">即将过期</span>' : '';
      const action = available
        ? `<div class="use-btn" onclick="toast('去使用')">去使用</div>`
        : `<span class="status-tag">${STATUS_TEXT[c.status]}</span>`;
      return `
      <div class="coupon-card theme-${c.theme} ${available ? '' : c.status}">
        <div class="card-left">
          <span class="value-symbol">${c.valueSymbol}</span>
          <span class="value-type">${c.valueType}</span>
        </div>
        <div class="card-center">
          <div class="header">
            <span class="title ${c.theme === 'black-gold' ? 'premium' : ''}">${c.theme === 'black-gold' ? '👑 ' : ''}${c.name}</span>
            ${c.sourceTag ? `<span class="source-tag">${c.sourceTag}</span>` : ''}
          </div>
          <span class="condition">${c.condition}</span>
          <div class="date-row">
            <span class="date ${c.urgent ? 'urgent' : ''}">${c.expireText}</span>
            ${daysLeft}
          </div>
        </div>
        <div class="card-right">
          ${urgentTip}
          ${action}
        </div>
      </div>`;
    }).join('');
  }

  function switchTab(el) {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    render(el.dataset.f);
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }

  render('available');
</script>
</body>
</html>
