<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>订单 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --ink:#2C2723; --muted:#8B8178; --primary:#753A22; --caramel:#A9712F; --caramel-soft:#F6EAD9; --brown-soft:#F3E9DF;
    --surface:#F7F3EE; --card:#FFFFFF; --border:#E3DED8;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 分类切换 ── */
  .category-switch {
    display:flex; height:48px;
    background:var(--card);
    border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  }
  .category-item {
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:14px; font-weight:600; color:var(--muted);
    cursor:pointer; position:relative;
  }
  .category-item.active { color:var(--primary); font-weight:700; }
  .category-item.active::after {
    content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:32px; height:2px; background:var(--primary);
  }
  .category-count {
    min-width:16px; padding:0 4px; height:16px;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:999px; background:var(--surface);
    font-size:10px; font-weight:700; color:var(--muted);
  }

  .page { padding:16px 12px 120px; }

  /* ── 订单收据卡 ── */
  .order-receipt {
    margin-bottom:12px; overflow:hidden;
    border:1px solid var(--border); border-radius:12px; background:var(--card);
  }
  .receipt-head {
    padding:14px 14px 12px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    border-bottom:1px solid var(--border);
  }
  .store-name { display:block; font-size:14px; font-weight:650; color:var(--ink); }
  .order-meta { display:block; margin-top:3px; font-size:10px; color:var(--muted); }
  .order-meta em { font-style:normal; color:var(--primary); font-weight:650; }
  .status-block { flex:none; text-align:right; }
  .order-status {
    display:inline-block; padding:3px 10px; border-radius:999px;
    font-size:10px; font-weight:700;
  }
  .order-status.processing { background:#EAF0F2; color:#285B70; }
  .order-status.completed { background:#E6F1EB; color:#059669; }
  .order-status.pending { background:#F4EBDD; color:#8A4D10; }
  .order-status.delivering { background:#EAF0F2; color:#285B70; }
  .order-status.cancelled { background:var(--border); color:var(--muted); }
  .expire-countdown {
    display:block; margin-top:4px; font-size:10px; color:var(--muted);
  }
  .expire-countdown.urgent { color:#9B3932; font-weight:600; }

  .delivery-info {
    margin:10px 14px 2px; padding:10px 12px; border-radius:8px;
    background:var(--surface);
    display:flex; flex-direction:column; gap:7px;
  }
  .delivery-row {
    display:flex; align-items:center; gap:7px; min-width:0;
  }
  .delivery-row svg { flex:none; width:14px; height:14px; color:var(--muted); }
  .delivery-row:nth-child(2) svg { color:var(--primary); }
  .delivery-addr {
    flex:1; min-width:0;
    font-size:12px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .delivery-arrow { flex:none; font-size:13px; line-height:1; color:var(--placeholder); }
  .delivery-store { flex:none; font-size:11px; font-weight:600; color:var(--muted); }
  .delivery-dist { font-size:11px; color:var(--placeholder); }

  .receipt-items { padding:2px 14px; }
  .order-item {
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--border);
  }
  .order-item:last-child { border-bottom:0; }
  .item-image {
    flex:none; width:56px; height:56px; border-radius:8px;
    background:linear-gradient(135deg,#E8DDD2,#D8C8B4);
  }
  .item-info { flex:1; min-width:0; }
  .item-name { display:block; font-size:13px; font-weight:650; color:var(--ink); }
  .item-spec { display:block; margin-top:3px; font-size:10px; color:var(--muted); }
  .item-right { flex:none; text-align:right; }
  .item-price { display:block; font-size:13px; font-weight:650; color:var(--ink); }
  .item-qty { display:block; margin-top:3px; font-size:10px; color:var(--muted); }
  .item-points { display:block; font-size:14px; font-weight:700; color:var(--primary); }

  .receipt-summary {
    padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:var(--card);
  }
  .summary-label { font-size:11px; color:var(--muted); }
  .summary-total { display:block; margin-top:4px; font-size:14px; font-weight:700; color:var(--primary); }
  .summary-total.virtual { color:var(--caramel); }
  .order-action {
    flex:none; padding:8px 14px;
    border:1px solid var(--ink); border-radius:8px;
    background:var(--ink); color:#fff;
    font-size:11px; font-weight:650; cursor:pointer;
  }
  .order-action:active { opacity:.85; }
  .mini-btn {
    flex:none; padding:7px 14px;
    border:1px solid var(--border); border-radius:8px;
    background:var(--card); color:var(--ink);
    font-size:11px; font-weight:600; cursor:pointer;
  }
  .mini-btn:active { background:var(--surface); }

  /* ── 空状态 ── */
  .empty-state {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:120px 40px 60px; text-align:center;
  }
  .empty-icon { font-size:40px; color:var(--muted); }
  .empty-title {
    margin-top:20px; font-family:var(--serif); font-size:22px; font-weight:600; color:var(--ink);
  }
  .empty-desc { margin-top:10px; font-size:13px; line-height:1.7; color:var(--muted); }
  .empty-action {
    margin-top:28px; padding:12px 32px;
    border-radius:999px; background:var(--ink); color:#fff;
    font-size:13px; font-weight:600; cursor:pointer;
  }

  /* ── 底部 TabBar ── */
  .tabbar {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:390px; height:54px;
    display:flex; align-items:center; justify-content:space-around;
    background:rgba(247,243,238,.94);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    z-index:10;
  }
  .tabbar-item {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:9px; font-weight:400; color:var(--muted);
    cursor:pointer; transition:color .25s;
  }
  .tabbar-item.active { color:var(--ink); }
  .tabbar-icon {
    width:20px; height:20px; display:flex; align-items:center; justify-content:center;
  }
  .tabbar-icon svg { width:19px; height:19px; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

  <!-- 分类切换 -->
  <div class="category-switch">
    <div class="category-item active" data-f="pickup" onclick="switchCat(this)">
      自取<span class="category-count" id="pickupCount">1</span>
    </div>
    <div class="category-item" data-f="delivery" onclick="switchCat(this)">
      外送<span class="category-count" id="deliveryCount">1</span>
    </div>
  </div>

  <div class="page">

    <!-- 咖啡订单（JS 渲染，按自取/外送过滤） -->
    <div id="orderList"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <span class="empty-icon">☕</span>
      <span class="empty-title" id="emptyTitle">暂无自取订单</span>
      <span class="empty-desc">选择一杯喜欢的咖啡，<br>我们会为你现制。</span>
      <span class="empty-action" onclick="go('menu.html')">去点单 →</span>
    </div>

  </div>

  <!-- 底部 TabBar -->
  <nav class="tabbar">
    <div class="tabbar-item" onclick="goTab('index.html')">
      <span class="tabbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5L12 3l8.5 7.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5"/><path d="M10 21v-6h4v6"/></svg></span><span>首页</span>
    </div>
    <div class="tabbar-item" onclick="goTab('menu.html')">
      <span class="tabbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></span><span>菜单</span>
    </div>
    <div class="tabbar-item active" onclick="goTab('order.html')">
      <span class="tabbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/></svg></span><span>订单</span>
    </div>
    <div class="tabbar-item" onclick="goTab('profile.html')">
      <span class="tabbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="3.8"/><path d="M4.5 20.5c.8-3.7 4-5.7 7.5-5.7s6.7 2 7.5 5.7"/></svg></span><span>我的</span>
    </div>
  </nav>

<script>
  function goTab(href) {
    location.href = href;
  }

  function go(href) { location.href = href; }

  // 咖啡订单数据（自取/外送，覆盖 待支付/制作中/已完成/已取消 全状态；id 与 order-detail.html 一致）
  const COFFEE_ORDERS = [
    { id:'coz2026080101', fulfillment:'pickup', status:'pending', statusText:'待支付',
      time:'2026-08-01 09:00:00', meta:'', expireAt: Date.now() + 8 * 60 * 1000,
      items:[
        { name:'经典手冲', spec:'热 / 中杯 / 默认糖', price:'¥28.00', qty:'× 1' },
        { name:'Dirty', spec:'冰 / 中杯 / 正常', price:'¥32.00', qty:'× 1' }
      ],
      count:'共 2 件 · 到店自提' },
    { id:'coz2026073110', fulfillment:'pickup', status:'processing', statusText:'制作中',
      time:'2026-07-31 15:28:45', meta:'取餐码 <em>A021</em>', note:'预计 15:32 可取',
      items:[
        { name:'经典手冲', spec:'热 / 中杯 / 默认糖', price:'¥28.00', qty:'× 1' },
        { name:'Dirty', spec:'冰 / 中杯 / 正常', price:'¥32.00', qty:'× 1' }
      ],
      count:'共 2 件 · 到店自提' },
    { id:'coz2026080112', fulfillment:'pickup', status:'completed', statusText:'已完成',
      time:'2026-08-01 12:30:10', meta:'取餐码 <em>A023</em>', note:'可取',
      items:[
        { name:'海盐焦糖拿铁', spec:'热 / 大杯 / 半糖', price:'¥34.00', qty:'× 1' }
      ],
      count:'共 1 件 · 到店自提' },
    { id:'coz2026072901', fulfillment:'pickup', status:'cancelled', statusText:'已取消',
      time:'2026-07-29 16:20:05', meta:'',
      items:[
        { name:'美式咖啡', spec:'冰 / 大杯 / 无糖', price:'¥22.00', qty:'× 1' }
      ],
      count:'共 1 件 · 到店自提' },
    { id:'coz2026080203', fulfillment:'delivery', status:'delivering', statusText:'配送中',
      time:'2026-08-02 14:58:20', meta:'外送 · 学院路 100 号', note:'预计 15:48 送达', deliveryAddress:'浙江省 杭州市 西湖区 学院路 100 号',
      items:[
        { name:'燕麦拿铁', spec:'热 / 大杯 / 无糖', price:'¥36.00', qty:'× 1' }
      ],
      count:'共 1 件 · 外送' },
    { id:'coz2026072907', fulfillment:'delivery', status:'completed', statusText:'已完成',
      time:'2026-07-29 09:12:30', meta:'外送 · 文三路 128 号', note:'已送达', deliveryAddress:'浙江省 杭州市 西湖区 文三路 128 号 CozyCoffee 大厦',
      items:[
        { name:'冷萃咖啡', spec:'冰 / 中杯 / 无糖', price:'¥28.00', qty:'× 1' },
        { name:'冰摇荔枝咖啡', spec:'冰 / 大杯 / 微糖', price:'¥38.00', qty:'× 1' }
      ],
      count:'共 2 件 · 外送' }
  ];

  let activeFulfillment = 'pickup';

  function render() {
    const list = document.getElementById('orderList');
    document.getElementById('pickupCount').textContent = COFFEE_ORDERS.filter(o => o.fulfillment === 'pickup').length;
    document.getElementById('deliveryCount').textContent = COFFEE_ORDERS.filter(o => o.fulfillment === 'delivery').length;
    const shown = COFFEE_ORDERS.filter(o => o.fulfillment === activeFulfillment);

    if (!shown.length) {
      document.getElementById('orderList').style.display = 'none';
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('emptyTitle').textContent = '暂无' + (activeFulfillment === 'pickup' ? '自取' : '外送') + '订单';
      return;
    }
    document.getElementById('orderList').style.display = 'block';
    document.getElementById('emptyState').style.display = 'none';

    list.innerHTML = shown.map(o => `
      <div class="order-receipt" onclick="go('order-detail.html?id=${o.id}')">
        <div class="receipt-head">
          <div>
            <span class="store-name">CozyCoffee 中心店</span>
            <span class="order-meta">${o.time}${o.meta ? ' · ' + o.meta : ''}</span>
          </div>
          <div class="status-block">
            <span class="order-status ${o.status}">${o.statusText}</span>
            ${o.status === 'pending'
              ? '<span class="expire-countdown" data-pending="' + o.id + '">' + fmtCountdown(o.id) + '</span>'
              : (o.note ? '<span class="expire-countdown">' + o.note + '</span>' : '')}
          </div>
        </div>
        ${o.fulfillment === 'delivery' ? `
        <div class="delivery-info">
          <div class="delivery-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.2-6-11a6 6 0 0 1 12 0c0 5.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
            <span class="delivery-addr">${o.deliveryAddress || '—'}</span>
            <span class="delivery-arrow">›</span>
          </div>
          <div class="delivery-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
            <span class="delivery-store">CozyCoffee 中心店</span>
            <span class="delivery-dist"> | 1.2km</span>
          </div>
        </div>` : ''}
        <div class="receipt-items">
          ${o.items.map(it => `
            <div class="order-item">
              <div class="item-image"></div>
              <div class="item-info">
                <span class="item-name">${it.name}</span>
                <span class="item-spec">${it.spec}</span>
              </div>
              <div class="item-right">
                <span class="item-price">${it.price}</span>
                <span class="item-qty">${it.qty}</span>
              </div>
            </div>`).join('')}
        </div>
        <div class="receipt-summary">
          <span class="summary-label">${o.count}</span>
          ${(o.status === 'completed' || o.status === 'cancelled')
            ? `<span class="order-action" onclick="event.stopPropagation(); reorder('${o.id}')">再来一单</span>`
            : `<span class="mini-btn" onclick="event.stopPropagation(); go('order-detail.html?id=${o.id}')">查看详情</span>`}
        </div>
      </div>`).join('');
  }

  function switchCat(el) {
    document.querySelectorAll('.category-item').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    activeFulfillment = el.dataset.f;
    render();
  }

  // 再来一单：订单项 → localStorage → 菜单页恢复购物车
  const REORDER = {
    coz2026080112: [
      { productName:'海盐焦糖拿铁', name:'海盐焦糖拿铁', spec:'热 · 大杯 · 半糖', price:34, qty:1 }
    ],
    coz2026072901: [
      { productName:'美式咖啡', name:'美式咖啡', spec:'冰 · 大杯 · 无糖', price:22, qty:1 }
    ],
    coz2026073110: [
      { productName:'经典手冲', name:'云南保山 SOE', spec:'热 · 中杯 · 微甜', price:28, qty:1 },
      { productName:'Dirty', name:'Dirty', spec:'冰 · 中杯 · 正常', price:32, qty:1 }
    ],
    coz2026072907: [
      { productName:'瓶装冷萃', name:'冷萃咖啡', spec:'冰 · 中杯 · 无糖', price:28, qty:1 },
      { productName:'冰摇荔枝咖啡', name:'冰摇荔枝咖啡', spec:'冰 · 大杯 · 微糖', price:38, qty:1 }
    ]
  };
  function reorder(id) {
    const items = REORDER[id];
    if (!items) return;
    localStorage.setItem('cozy_reorder', JSON.stringify({ items }));
    location.href = 'menu.html';
  }

  // 待支付订单实时倒计时（对齐小程序订单页 ticker）
  function findPending(id) { return COFFEE_ORDERS.find(o => o.id === id); }
  function remainSeconds(o) {
    if (!o || !o.expireAt) return null;
    return Math.max(0, Math.floor((o.expireAt - Date.now()) / 1000));
  }
  function fmtCountdown(id) {
    const remain = remainSeconds(findPending(id));
    if (remain == null) return '等待支付';
    if (remain <= 0) return '即将自动取消';
    const mm = String(Math.floor(remain / 60)).padStart(2, '0');
    const ss = String(remain % 60).padStart(2, '0');
    return `剩余 ${mm}:${ss}`;
  }
  let ticker = null;
  function startTicker() {
    stopTicker();
    ticker = setInterval(() => {
      document.querySelectorAll('[data-pending]').forEach(el => {
        const o = findPending(el.dataset.pending);
        el.textContent = fmtCountdown(el.dataset.pending);
        el.classList.toggle('urgent', remainSeconds(o) != null && remainSeconds(o) <= 30);
      });
    }, 1000);
  }
  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

  render();
  startTicker();

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
