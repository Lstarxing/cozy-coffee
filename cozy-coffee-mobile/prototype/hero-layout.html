    <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy Coffee Hero Layout</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body { display:flex; justify-content:center; padding:40px; background:#e8e4df; }

  .frame {
    width:390px; height:464px;
    position:relative; overflow:hidden;
    background:#F7F3EE;
    /* Replace this gradient block with your coffee photo */
    background-image:
      /* warm window light from top-right */
      radial-gradient(ellipse at 75% 30%, rgba(255,248,240,.9) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(245,235,220,.6) 0%, transparent 55%),
      /* table surface */
      linear-gradient(180deg, #E8DDD2 0%, #DDCFC0 55%, #D4C4B2 70%, #C8B8A4 100%);
    font-family:'Inter',-apple-system,sans-serif;
    color:#2C2723;
  }

  /* Subtle grain texture */
  .frame::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.06;
    background-image:
      radial-gradient(circle at 20% 30%,#000 .3px,transparent .3px),
      radial-gradient(circle at 60% 70%,#000 .2px,transparent .2px),
      radial-gradient(circle at 80% 40%,#000 .4px,transparent .4px);
    background-size:24px 24px,32px 32px,20px 20px;
  }

  /* Shadow from window frame / soft vignette */
  .frame::after {
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      linear-gradient(195deg, rgba(44,39,35,.06) 0%, transparent 30%),
      linear-gradient(180deg, transparent 70%, rgba(44,39,35,.1) 100%);
  }

  /* ═══ WeChat Capsule Placeholder ═══ */
  .capsule {
    position:absolute; top:24px; right:10px; z-index:10;
    height:32px; padding:0 12px;
    display:flex; align-items:center; gap:7px;
    border-radius:16px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .capsule-dot {
    width:10px; height:10px; border-radius:50%;
    border:1.5px solid #2C2723; opacity:.45;
  }
  .capsule-line {
    width:1px; height:16px; background:#2C2723; opacity:.2;
  }
  .capsule-oval {
    width:10px; height:17px; border-radius:6px;
    border:1.5px solid #2C2723; opacity:.45;
  }

  /* ═══ Typography — left third ═══ */
  .copy {
    position:absolute; top:24px; left:22px; z-index:5;
    width:120px;
    display:flex; flex-direction:column; align-items:flex-start;
  }
  .copy-kicker {
    font-size:9px; font-weight:600; letter-spacing:.22em;
    color:rgba(44,39,35,.55);
    font-family:'Inter',sans-serif; line-height:1;
  }
  .copy-cn {
    margin-top:22px;
    font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
    font-size:28px; font-weight:600;
    color:#2C2723; line-height:1.28; letter-spacing:.03em;
  }
  .copy-en {
    margin-top:14px;
    font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
    font-size:12px; font-weight:400;
    color:rgba(44,39,35,.6); line-height:1.6; letter-spacing:.04em;
    font-style:italic;
  }
  .copy-divider {
    align-self:center;
    margin-top:22px;
    width:1px; height:24px;
    background:rgba(44,39,35,.4);
  }

  /* ═══ Coffee still life hints (right side) ═══ */
  .coffee-scene {
    position:absolute; right:-10px; top:30px; z-index:0;
    width:260px; height:420px;
    opacity:.92;
    /* Simulated coffee scene with circles/blobs */
    background:
      /* cup body */
      radial-gradient(ellipse at 55% 52%, rgba(220,210,200,.85) 0%, rgba(200,185,170,.5) 30%, transparent 50%),
      /* warm glow on cup */
      radial-gradient(ellipse at 60% 48%, rgba(255,245,235,.7) 0%, transparent 28%),
      /* shadow under cup */
      radial-gradient(ellipse at 58% 68%, rgba(180,165,150,.4) 0%, transparent 20%),
      /* beans scatter */
      radial-gradient(circle at 48% 72%, rgba(140,100,70,.4) 0px, transparent 8px),
      radial-gradient(circle at 62% 74%, rgba(140,100,70,.35) 0px, transparent 6px),
      radial-gradient(circle at 55% 76%, rgba(130,90,60,.3) 0px, transparent 5px),
      /* carafe / equipment hint */
      radial-gradient(ellipse at 70% 40%, rgba(210,200,190,.5) 0%, transparent 35%);
  }

  /* Decorative coffee bean dots */
  .bean {
    position:absolute; z-index:3;
    width:7px; height:10px; border-radius:50%;
    background:rgba(120,85,55,.25);
    transform:rotate(var(--r));
  }

  .leaf {
    position:absolute; z-index:3;
    width:14px; height:20px;
    border-radius:2px 14px 2px 14px;
    background:rgba(145,170,130,.35);
    transform:rotate(var(--r));
  }

  /* Label */
  .label {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    z-index:10;
    font-size:8px; letter-spacing:.12em; color:rgba(44,39,35,.3);
    font-family:'Inter',sans-serif;
  }
</style>
</head>
<body>

<div class="frame">

  <!-- WeChat Capsule -->
  <div class="capsule">
    <div class="capsule-dot"></div>
    <div class="capsule-line"></div>
    <div class="capsule-oval"></div>
  </div>

  <!-- Coffee scene hints -->
  <div class="coffee-scene"></div>

  <!-- Beans and leaves scattered -->
  <div class="bean" style="top:370px;left:200px;--r:15deg;"></div>
  <div class="bean" style="top:378px;left:218px;--r:-20deg;"></div>
  <div class="bean" style="top:365px;left:240px;--r:35deg;"></div>
  <div class="leaf" style="top:340px;left:250px;--r:-25deg;"></div>

  <!-- Typography -->
  <div class="copy">
    <span class="copy-kicker">COZY COFFEE</span>
    <span class="copy-cn">一杯咖啡</span>
    <span class="copy-cn" style="margin-top:2px;">一段安静时光</span>
    <span class="copy-en">A quiet moment<br>with coffee</span>
    <div class="copy-divider"></div>
  </div>

  <span class="label">390 × 464 px · Hero Layout</span>
</div>

</body>
</html>
