    <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy Coffee Hero Layout</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body { display:flex; justify-content:center; padding:40px; background:#e8e4df; }

  .frame {
    width:390px; height:520px;
    position:relative; overflow:hidden;
    /* 与移动端首页 Hero 相同的暖奶油底（aspect-ratio 3:4） */
    background: linear-gradient(180deg, #F0E7DC 0%, #E4D5C2 55%, #D8C4AC 100%);
    /* Replace this gradient block with your coffee photo */
    font-family:'Inter',-apple-system,sans-serif;
    color:#2B1E16;
  }

  /* Subtle grain texture */
  .frame::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.06;
    background-image:
      radial-gradient(circle at 20% 30%,#000 .3px,transparent .3px),
      radial-gradient(circle at 60% 70%,#000 .2px,transparent .2px),
      radial-gradient(circle at 80% 40%,#000 .4px,transparent .4px);
    background-size:24px 24px,32px 32px,20px 20px;
  }

  /* Soft vignette */
  .frame::after {
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      linear-gradient(195deg, rgba(43,30,22,.06) 0%, transparent 30%),
      linear-gradient(180deg, transparent 70%, rgba(43,30,22,.1) 100%);
  }

  /* ═══ WeChat Capsule Placeholder (系统胶囊，非品牌设计) ═══ */
  .capsule {
    position:absolute; top:24px; right:10px; z-index:10;
    height:32px; padding:0 12px;
    display:flex; align-items:center; gap:7px;
    border-radius:16px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .capsule-dot {
    width:10px; height:10px; border-radius:50%;
    border:1.5px solid #2B1E16; opacity:.45;
  }
  .capsule-line {
    width:1px; height:16px; background:#2B1E16; opacity:.2;
  }
  .capsule-oval {
    width:10px; height:17px; border-radius:6px;
    border:1.5px solid #2B1E16; opacity:.45;
  }

  /* ═══ Typography — 与移动端首页 Hero 一致（左上文案，宽度 ~125px）═══ */
  .copy {
    position:absolute; top:94px; left:42px; z-index:5;
    width:125px;
    display:flex; flex-direction:column; align-items:flex-start;
  }
  .copy-kicker {
    font-size:12.5px; font-weight:500; letter-spacing:.42em;
    color:rgba(43,30,22,.55);
    font-family:'Inter',sans-serif; line-height:1;
    white-space:nowrap;
  }
  .copy-cn {
    margin-top:73px;
    font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
    font-size:29px; font-weight:400;
    color:#3A342E; line-height:1; letter-spacing:.03em;
    white-space:nowrap;
  }
  .copy-cn.sub {
    margin-top:21px;
    font-size:23px;
  }
  .copy-en {
    margin-top:42px;
    font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
    font-size:12.5px; font-weight:400;
    color:rgba(43,30,22,.55); line-height:1.6; letter-spacing:.08em;
    font-style:italic;
  }

  /* ═══ Coffee still life hints（照片占位，右上方） ═══ */
  .coffee-scene {
    position:absolute; right:-10px; top:30px; z-index:0;
    width:260px; height:420px;
    opacity:.8;
    /* Simulated coffee scene with circles/blobs */
    background:
      /* cup body */
      radial-gradient(ellipse at 55% 52%, rgba(220,210,200,.85) 0%, rgba(200,185,170,.5) 30%, transparent 50%),
      /* warm glow on cup */
      radial-gradient(ellipse at 60% 48%, rgba(255,245,235,.7) 0%, transparent 28%),
      /* shadow under cup */
      radial-gradient(ellipse at 58% 68%, rgba(180,165,150,.4) 0%, transparent 20%),
      /* beans scatter */
      radial-gradient(circle at 48% 72%, rgba(140,100,70,.4) 0px, transparent 8px),
      radial-gradient(circle at 62% 74%, rgba(140,100,70,.35) 0px, transparent 6px),
      radial-gradient(circle at 55% 76%, rgba(130,90,60,.3) 0px, transparent 5px),
      /* carafe / equipment hint */
      radial-gradient(ellipse at 70% 40%, rgba(210,200,190,.5) 0%, transparent 35%);
  }

  /* Decorative coffee bean dots */
  .bean {
    position:absolute; z-index:3;
    width:7px; height:10px; border-radius:50%;
    background:rgba(120,85,55,.25);
    transform:rotate(var(--r));
  }

  .leaf {
    position:absolute; z-index:3;
    width:14px; height:20px;
    border-radius:2px 14px 2px 14px;
    background:rgba(145,170,130,.35);
    transform:rotate(var(--r));
  }

  /* Label */
  .label {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    z-index:10;
    font-size:8px; letter-spacing:.12em; color:rgba(43,30,22,.3);
    font-family:'Inter',sans-serif;
  }
</style>
</head>
<body>

<div class="frame">

  <!-- WeChat Capsule -->
  <div class="capsule">
    <div class="capsule-dot"></div>
    <div class="capsule-line"></div>
    <div class="capsule-oval"></div>
  </div>

  <!-- Coffee scene hints -->
  <div class="coffee-scene"></div>

  <!-- Beans and leaves scattered -->
  <div class="bean" style="top:370px;left:200px;--r:15deg;"></div>
  <div class="bean" style="top:378px;left:218px;--r:-20deg;"></div>
  <div class="bean" style="top:365px;left:240px;--r:35deg;"></div>
  <div class="leaf" style="top:340px;left:250px;--r:-25deg;"></div>

  <!-- Typography -->
  <div class="copy">
    <span class="copy-kicker">COZY COFFEE</span>
    <span class="copy-cn">一杯咖啡</span>
    <span class="copy-cn sub">一段安静时光</span>
    <span class="copy-en">A quiet moment with coffee</span>
  </div>

  <span class="label">390 × 520 px · Hero (3:4)</span>
</div>

</body>
</html>
