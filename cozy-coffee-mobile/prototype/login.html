<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>登录 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --glaze-green:#526C43; --glaze-green-soft:#E8EDE5;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22; --accent:#526C43;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部原生式导航：返回 + 居中标题 ── */
  .top-nav {
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
  }
  .nav-back {
    font-size:26px; line-height:1; color:var(--ink);
    cursor:pointer; padding:6px 4px; width:32px;
  }
  .nav-back:active { opacity:.5; }
  .nav-title {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:16px; font-weight:600; color:var(--ink);
    white-space:nowrap;
  }
  .nav-right { width:32px; }

  .page {
    padding:0 24px 30px;
    display:flex; flex-direction:column; min-height:calc(100vh - 60px);
  }

  /* ── 品牌区（无咖啡豆 logo） ── */
  .auth-hero { text-align:center; padding:16px 0 20px; }
  .brand-word {
    display:block;
    font-size:11px; font-weight:800; letter-spacing:.3em; color:var(--ink);
  }
  .hero-title {
    display:block; margin-top:10px;
    font-family:var(--serif); font-size:26px; font-weight:600; color:var(--ink);
  }
  .hero-sub {
    display:block; margin-top:7px;
    font-size:12px; color:var(--muted);
  }

  /* ── 表单卡 ── */
  .auth-card {
    background:var(--card); border-radius:14px;
    padding:20px 20px 16px;
  }
  .field { padding:12px 0; border-bottom:1px solid var(--border); }
  .field-label { display:block; font-size:11px; font-weight:650; color:var(--muted); }
  .field-input-wrap { margin-top:6px; display:flex; align-items:center; gap:8px; }
  .field-input {
    flex:1; min-width:0;
    border:none; background:transparent;
    font-size:15px; color:var(--ink); font-family:inherit;
    padding:4px 0;
  }
  .field-input::placeholder { color:var(--placeholder); }
  .field-input:focus { outline:none; }
  .field-toggle {
    flex:none; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); cursor:pointer;
  }
  .field-toggle:active { opacity:.6; }
  .field-toggle svg { width:20px; height:20px; }

  .submit-btn {
    width:100%; height:46px; margin-top:20px;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius:999px;
    background:var(--ink); color:#fff;
    font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .submit-btn:active { opacity:.85; }
  .submit-btn.disabled { opacity:.4; cursor:default; }

  .auth-links {
    margin-top:14px; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .auth-link { font-size:12px; color:var(--muted); cursor:pointer; }
  .auth-link:active { opacity:.6; }
  .auth-dot { width:5px; height:5px; border-radius:50%; background:var(--border); }

  /* ── 其他登录 ── */
  .alt-login { margin-top:22px; }
  .divider { display:flex; align-items:center; gap:10px; }
  .divider-line { flex:1; height:1px; background:var(--border); }
  .divider-text { font-size:11px; color:var(--placeholder); }
  .alt-btn {
    width:100%; height:46px; margin-top:14px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    border:1px solid var(--border); border-radius:999px;
    background:var(--card); color:var(--ink); cursor:pointer; font-family:inherit;
  }
  .alt-btn:active { opacity:.8; }
  .alt-btn svg { width:26px; height:26px; }
  .alt-label { font-size:13px; font-weight:600; }

  /* ── 协议 ── */
  .agreement {
    display:flex; align-items:flex-start;
    margin-top:auto; padding-top:26px;
  }
  .checkbox {
    flex:none; width:18px; height:18px; border:1.5px solid var(--border);
    border-radius:5px; background:var(--card);
    display:flex; align-items:center; justify-content:center;
    margin:1px 8px 0 0;
    font-size:12px; color:#fff; cursor:pointer;
    transition:all .2s;
  }
  .checkbox.checked { background:var(--ink); border-color:var(--ink); }
  .agreement-text { font-size:11px; color:var(--placeholder); line-height:1.6; }
  .agreement-text .link { color:var(--muted); cursor:pointer; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <!-- 顶部导航 -->
  <div class="top-nav">
    <span class="nav-back" onclick="goBack('index.html')">‹</span>
    <span class="nav-title">登录</span>
    <span class="nav-right"></span>
  </div>

  <!-- 品牌区（无咖啡豆 logo） -->
  <div class="auth-hero">
    <span class="brand-word">COZY COFFEE</span>
    <span class="hero-title">欢迎回来</span>
    <span class="hero-sub">登录后继续你的点单与会员日常</span>
  </div>

  <!-- 表单卡 -->
  <div class="auth-card">
    <div class="field">
      <span class="field-label">账号</span>
      <div class="field-input-wrap">
        <input class="field-input" id="account" type="text" maxlength="100" placeholder="手机号 / 邮箱" oninput="updateBtn()">
      </div>
    </div>
    <div class="field">
      <span class="field-label">密码</span>
      <div class="field-input-wrap">
        <input class="field-input" id="pwd" type="password" placeholder="请输入密码" oninput="updateBtn()">
        <span class="field-toggle" data-target="pwd" onclick="toggleEye(this)"></span>
      </div>
    </div>

    <div class="submit-btn disabled" id="submitBtn" onclick="handleLogin()">登录</div>

    <div class="auth-links">
      <span class="auth-link" onclick="go('register.html')">新用户注册</span>
      <span class="auth-dot"></span>
      <span class="auth-link" onclick="go('reset.html')">忘记密码</span>
    </div>
  </div>

  <!-- 其他登录 -->
  <div class="alt-login">
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">其他登录方式</span>
      <div class="divider-line"></div>
    </div>
    <div class="alt-btn" onclick="wechatLogin()">
      <svg viewBox="0 0 24 24" fill="#526C43"><path d="M8.9 3C5.1 3 2 5.6 2 8.9c0 1.8 1 3.4 2.6 4.5L4 16l2.8-1.5c.7.2 1.4.3 2.1.3.3 0 .6 0 .9-.05C9.5 14 9.4 13.5 9.4 13 9.4 10.4 11.7 8 14.7 8c-.4-2.9-3.1-5-5.8-5zm-1.3 4.1a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6zM9.5 9.5a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6z"/><path d="M20.4 11c0-2.7-2.6-4.9-5.7-4.9S9 8.3 9 11s2.6 4.9 5.7 4.9c.6 0 1.2-.1 1.8-.25l2.5 1.35-.7-2.2A4.6 4.6 0 0 0 20.4 11zm-4.2.9a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4zm-3 0a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4z"/></svg>
      <span class="alt-label">微信登录</span>
    </div>
  </div>

  <!-- 协议 -->
  <div class="agreement">
    <div class="checkbox" id="agree" onclick="toggleAgree()"></div>
    <span class="agreement-text">我已阅读并同意 <span class="link">《用户协议》</span> 和 <span class="link">《隐私政策》</span></span>
  </div>

</div>

<script>
  const PHONE = /^1[3-9]\d{9}$/;
  const EMAIL = /^[\w.-]+@[\w.-]+\.\w+$/;
  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  let agreed = false;

  function toggleAgree() {
    agreed = !agreed;
    document.getElementById('agree').classList.toggle('checked', agreed);
    updateBtn();
  }

  function toggleEye(el) {
    const input = document.getElementById(el.dataset.target);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    el.innerHTML = show ? EYE_OFF : EYE;
  }

  function updateBtn() {
    const a = document.getElementById('account').value.trim();
    const p = document.getElementById('pwd').value;
    const ok = (PHONE.test(a) || EMAIL.test(a)) && p.length >= 6 && agreed;
    document.getElementById('submitBtn').classList.toggle('disabled', !ok);
  }

  function handleLogin() {
    const a = document.getElementById('account').value.trim();
    const p = document.getElementById('pwd').value;
    if (!agreed) { toast('请先阅读并同意协议'); return; }
    if (!(PHONE.test(a) || EMAIL.test(a))) { toast('请输入正确的手机号或邮箱'); return; }
    if (p.length < 6) { toast('密码长度至少为 6 位'); return; }
    toast('登录成功');
    setTimeout(() => { location.href = 'index.html'; }, 900);
  }

  function wechatLogin() {
    if (!agreed) { toast('请先阅读并同意协议'); return; }
    toast('微信开发登录成功');
    setTimeout(() => { location.href = 'index.html'; }, 900);
  }

  document.querySelectorAll('.field-toggle').forEach(el => { el.innerHTML = EYE; });

  function go(href) { location.href = href; }
  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
