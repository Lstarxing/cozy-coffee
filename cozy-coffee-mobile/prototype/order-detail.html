<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>订单详情 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --glaze-green:#526C43; --glaze-green-soft:#E8EDE5;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22; --accent:#526C43;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部原生式导航 ── */
  .top-nav {
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
  }
  .nav-back { font-size:26px; line-height:1; color:var(--ink); cursor:pointer; padding:6px 4px; width:32px; }
  .nav-back:active { opacity:.5; }
  .nav-title {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:16px; font-weight:600; color:var(--ink);
    white-space:nowrap;
  }
  .nav-right { width:32px; }

  .page { padding:0 20px 110px; }

  /* ── 状态区（品牌色，紧凑） ── */
  .pickup-panel {
    margin-top:6px;
    padding:18px 24px 16px;
    border-radius:14px;
    text-align:center;
    color:#fff;
  }
  .pickup-panel.processing,
  .pickup-panel.pending,
  .pickup-panel.shipped { background:var(--roast-brown); }
  .pickup-panel.completed { background:var(--glaze-green); }
  .pickup-panel.cancelled { background:#756A63; }
  .pickup-eyebrow { display:block; font-size:10px; font-weight:700; letter-spacing:.24em; opacity:.8; }
  .pickup-code {
    display:block; margin-top:8px;
    font-family:var(--serif); font-size:34px; font-weight:800; letter-spacing:.06em; line-height:1;
    word-break:break-all;
  }
  .code-caption { display:block; margin-top:8px; font-size:10px; letter-spacing:.16em; opacity:.75; }
  .pickup-status { display:block; margin-top:8px; font-size:12px; opacity:.85; }

  /* ── 门店/配送（第一主体） ── */
  .store-block {
    display:flex; align-items:center; gap:12px;
    padding:22px 2px 18px;
    border-bottom:1px solid var(--border);
  }
  .store-copy { flex:1; min-width:0; }
  .store-name { display:block; font-family:var(--serif); font-size:20px; font-weight:600; color:var(--ink); }
  .store-addr { display:block; margin-top:5px; font-size:12px; color:var(--muted); }
  .store-actions { flex:none; display:flex; gap:8px; }
  .store-act {
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center;
    color:var(--primary); cursor:pointer;
  }
  .store-act svg { width:17px; height:17px; }
  .store-act:active { opacity:.6; }

  /* ── 商品（缩略图 + 规格） ── */
  .products { padding:4px 2px; }
  .product-row {
    display:flex; align-items:center; gap:14px;
    padding:16px 0;
    border-bottom:1px solid var(--border);
  }
  .product-row:last-child { border-bottom:0; }
  .product-img {
    flex:none; width:64px; height:64px; border-radius:12px;
    background:linear-gradient(135deg,#E8DDD2,#D8C8B4);
  }
  .product-main { flex:1; min-width:0; }
  .product-name { display:block; font-family:var(--serif); font-size:16px; font-weight:600; color:var(--ink); }
  .product-spec { display:block; margin-top:5px; font-size:12px; color:var(--muted); line-height:1.5; }
  .product-right { flex:none; text-align:right; }
  .product-price { display:block; font-size:15px; font-weight:650; color:var(--ink); }
  .product-qty { display:block; margin-top:4px; font-size:11px; color:var(--muted); }
  .product-points { display:block; font-size:15px; font-weight:700; color:var(--primary); }

  /* ── 金额（优惠总结） ── */
  .amount-block { padding:6px 2px 10px; }
  .amount-row {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:9px 0; font-size:13px; color:var(--ink);
  }
  .amount-row .coupon-tag { font-size:10px; color:var(--muted); }
  .amount-row.discount { color:var(--roast-brown); }
  .amount-divider { height:1px; background:var(--border); margin:8px 0 4px; }
  .amount-row.total { padding-top:12px; font-weight:700; }
  .amount-row.total span:last-child { color:var(--primary); font-size:20px; font-weight:750; }

  /* ── 订单信息（低权重，底部） ── */
  .meta-block {
    padding:14px 2px 4px;
    border-top:1px solid var(--border);
  }
  .meta-row {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:8px 0; font-size:12px; color:var(--muted);
  }
  .meta-row span:last-child { color:var(--quiet-ink); text-align:right; }
  .copy-btn {
    display:inline-block; margin-left:6px;
    padding:0 7px; border-radius:6px;
    border:1px solid var(--border); color:var(--quiet-ink);
    font-size:11px; font-weight:600; cursor:pointer;
  }
  .copy-btn:active { opacity:.6; }

  /* ── 底部操作 ── */
  .detail-footer {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:390px;
    padding:12px 20px max(12px, env(safe-area-inset-bottom));
    background:rgba(247,243,238,.94);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    z-index:10;
  }
  .reorder-btn {
    height:48px; border-radius:10px;
    background:var(--roast-brown); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:600; cursor:pointer;
    transition:background .25s;
  }
  .reorder-btn:active { background:var(--roast-brown-deep); }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <!-- 顶部导航 -->
  <div class="top-nav">
    <span class="nav-back" onclick="goBack('order.html')">‹</span>
    <span class="nav-title">订单详情</span>
    <span class="nav-right"></span>
  </div>

  <!-- 状态区 -->
  <div class="pickup-panel processing" id="pickupPanel">
    <span class="pickup-eyebrow" id="pickupEyebrow">COZY PICKUP</span>
    <span class="pickup-code" id="pickupCode">A021</span>
    <span class="code-caption" id="codeCaption">取餐码</span>
    <span class="pickup-status" id="pickupStatus">正在制作 · 预计 15:32 完成</span>
  </div>

  <!-- 门店/配送（第一主体） -->
  <div class="store-block">
    <div class="store-copy">
      <span class="store-name" id="storeName">CozyCoffee 中心店</span>
      <span class="store-addr" id="storeAddr">杭州 · 文三路 128 号</span>
    </div>
    <div class="store-actions" id="storeActions">
      <span class="store-act" onclick="toast('拨打门店电话')" title="电话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.1.9-2 2-2h2l1.5 4.5L7 10a13 13 0 0 0 7 7l1.5-2.5L20 16v2a2 2 0 0 1-2 2A14 14 0 0 1 4 6z"/></svg>
      </span>
      <span class="store-act" onclick="toast('打开导航')" title="导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.2-6-11a6 6 0 0 1 12 0c0 5.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
      </span>
    </div>
  </div>

  <!-- 商品 -->
  <div class="products" id="itemList"></div>

  <!-- 金额 -->
  <div class="amount-block" id="priceList"></div>

  <!-- 订单信息（低权重） -->
  <div class="meta-block">
    <div class="meta-row"><span>下单时间</span><span id="orderTime">07-31 15:28:45</span></div>
    <div class="meta-row"><span>订单编号</span><span><span id="orderNo">COZ2026073110</span><em class="copy-btn" onclick="copyOrderNo()">复制</em></span></div>
    <div class="meta-row"><span id="metaFulfillLabel">取餐码</span><span id="metaFulfill">A021</span></div>
  </div>

</div>

<!-- 底部操作 -->
<div class="detail-footer">
  <div class="reorder-btn" id="footerBtn" onclick="footerAction()">再来一单</div>
</div>

<script>
  const ORDERS = {
    /* ── 咖啡订单 ── */
    coz2026073110: {
      type:'coffee', fulfillment:'pickup', status:'processing',
      eyebrow:'COZY PICKUP', code:'A021', codeCaption:'取餐码', statusText:'正在制作 · 预计 15:32 完成',
      store:'CozyCoffee 中心店', storeAddr:'杭州 · 文三路 128 号',
      items:[
        { name:'云南保山 SOE', productName:'经典手冲', spec:'热 / 中杯 / 默认糖', price:'¥28.00', qty:'× 1' },
        { name:'Dirty', productName:'Dirty', spec:'冰 / 中杯 / 正常', price:'¥32.00', qty:'× 1' }
      ],
      coupon:{ label:'满35减10', discount:'-¥10.00' },
      goodsAmount:'¥60.00', paid:'¥50.00',
      time:'2026-07-31 15:28:45', orderNo:'COZ2026073110'
    },
    coz2026072907: {
      type:'coffee', fulfillment:'delivery', status:'completed',
      eyebrow:'COZY DELIVERY', code:'SF1068192000', codeCaption:'物流单号', statusText:'订单已完成 · 已送达',
      store:'CozyCoffee 中心店', deliveryAddr:'文三路 128 号 3 幢 1 单元',
      items:[
        { name:'冷萃咖啡', productName:'瓶装冷萃', spec:'冰 / 中杯 / 无糖', price:'¥28.00', qty:'× 1' },
        { name:'冰摇荔枝咖啡', productName:'冰摇荔枝咖啡', spec:'冰 / 大杯 / 微糖', price:'¥38.00', qty:'× 1' }
      ],
      coupon:null,
      goodsAmount:'¥66.00', paid:'¥66.00',
      time:'2026-07-29 09:12:30', orderNo:'COZ2026072907'
    },

    /* ── 兑换订单 ── */
    rd202607280002: {
      type:'redeem', fulfillment:'pickup', status:'completed',
      eyebrow:'COZY PICKUP', code:'P72811', codeCaption:'取货码', statusText:'已完成 · 到店自提',
      store:'杭州中心店', storeAddr:'文三路 128 号',
      items:[ { name:'Cozy 品牌贴纸包', productName:'Cozy 品牌贴纸包', spec:'数量 × 1', points:'100 积分' } ],
      consumePoints:'100', remainingPoints:'3,180',
      time:'2026-07-28 11:05:32', orderNo:'RD202607280002'
    },
    rd202607200003: {
      type:'redeem', fulfillment:'delivery', status:'shipped',
      eyebrow:'COZY DELIVERY', code:'SF1068192001', codeCaption:'物流单号', statusText:'已发货 · 顺丰速运',
      store:'杭州中心店', deliveryAddr:'浙江省杭州市西湖区文三路 128 号',
      items:[ { name:'Cozy 经典帆布包', productName:'Cozy 经典帆布包', spec:'数量 × 1', points:'1,600 积分' } ],
      consumePoints:'1,600', remainingPoints:'2,080',
      time:'2026-07-20 16:42:10', orderNo:'RD202607200003'
    },
    rd202607120004: {
      type:'redeem', fulfillment:'delivery', status:'processing',
      eyebrow:'COZY DELIVERY', code:'SF1068192002', codeCaption:'物流单号', statusText:'处理中 · 等待揽收',
      store:'杭州中心店', deliveryAddr:'浙江省杭州市西湖区文三路 128 号',
      items:[ { name:'挂耳咖啡精选礼盒', productName:'挂耳咖啡精选礼盒', spec:'数量 × 1', points:'3,500 积分' } ],
      consumePoints:'3,500', remainingPoints:'1,580',
      time:'2026-07-12 09:30:44', orderNo:'RD202607120004'
    },
    rd202607050005: {
      type:'redeem', fulfillment:'delivery', status:'pending',
      eyebrow:'COZY DELIVERY', code:'待出库', codeCaption:'物流单号', statusText:'待处理 · 即将发货',
      store:'杭州中心店', deliveryAddr:'浙江省杭州市西湖区文三路 128 号',
      items:[ { name:'定制拿铁金搅拌勺', productName:'定制拿铁金搅拌勺', spec:'数量 × 1', points:'600 积分' } ],
      consumePoints:'600', remainingPoints:'2,280',
      time:'2026-07-05 14:18:22', orderNo:'RD202607050005'
    },
    rd202606300006: {
      type:'redeem', fulfillment:'pickup', status:'cancelled',
      eyebrow:'COZY PICKUP', code:'P63019', codeCaption:'取货码', statusText:'已取消 · 积分已退还',
      store:'杭州中心店', storeAddr:'文三路 128 号',
      items:[ { name:'拿铁金定制马克杯', productName:'拿铁金定制马克杯', spec:'数量 × 1', points:'1,200 积分' } ],
      consumePoints:'1,200', remainingPoints:'2,080',
      time:'2026-06-30 19:05:11', orderNo:'RD202606300006'
    }
  };

  let currentOrder = null;

  (function init() {
    const id = new URLSearchParams(location.search).get('id');
    const o = ORDERS[id] || ORDERS.coz2026073110;
    currentOrder = o;

    document.getElementById('pickupPanel').className = 'pickup-panel ' + o.status;
    document.getElementById('pickupEyebrow').textContent = o.eyebrow;
    document.getElementById('pickupCode').textContent = o.code;
    document.getElementById('codeCaption').textContent = o.codeCaption;
    document.getElementById('pickupStatus').textContent = o.statusText;

    document.getElementById('storeName').textContent = o.store || 'CozyCoffee 中心店';
    document.getElementById('storeAddr').textContent = o.fulfillment === 'delivery'
      ? '配送至 · ' + (o.deliveryAddr || '')
      : (o.storeAddr || '');
    document.getElementById('storeActions').style.display = o.fulfillment === 'pickup' ? 'flex' : 'none';

    document.getElementById('itemList').innerHTML = o.items.map(it => `
      <div class="product-row">
        <div class="product-img"></div>
        <div class="product-main">
          <span class="product-name">${it.name}</span>
          <span class="product-spec">${it.spec}</span>
        </div>
        <div class="product-right">
          ${it.price
            ? `<span class="product-price">${it.price}</span><span class="product-qty">${it.qty}</span>`
            : `<span class="product-points">${it.points}</span>`}
        </div>
      </div>`).join('');

    let amountHTML;
    if (o.type === 'coffee') {
      amountHTML = `<div class="amount-row"><span>商品金额</span><span>${o.goodsAmount}</span></div>`;
      if (o.coupon) {
        amountHTML += `<div class="amount-row discount"><span>优惠券 <span class="coupon-tag">(${o.coupon.label})</span></span><span>${o.coupon.discount}</span></div>`;
      }
      amountHTML += `<div class="amount-divider"></div>
        <div class="amount-row total"><span>实付金额</span><span>${o.paid}</span></div>`;
    } else {
      amountHTML = `
        <div class="amount-row"><span>消耗积分</span><span>${o.consumePoints} 积分</span></div>
        <div class="amount-row"><span>兑换后剩余</span><span>${o.remainingPoints} 积分</span></div>
        <div class="amount-divider"></div>
        <div class="amount-row total"><span>实付</span><span>${o.consumePoints} 积分</span></div>`;
    }
    document.getElementById('priceList').innerHTML = amountHTML;

    document.getElementById('orderTime').textContent = o.time;
    document.getElementById('orderNo').textContent = o.orderNo;
    document.getElementById('metaFulfillLabel').textContent = o.codeCaption;
    document.getElementById('metaFulfill').textContent = o.code;

    document.getElementById('footerBtn').textContent = o.type === 'coffee' ? '再来一单' : '再次兑换';
  })();

  function footerAction() {
    if (!currentOrder) return;
    if (currentOrder.type === 'coffee') {
      localStorage.setItem('cozy_reorder', JSON.stringify({
        items: currentOrder.items.map(it => ({ productName: it.productName, name: it.name, spec: it.spec, price: it.price, qty: it.qty }))
      }));
      location.href = 'menu.html';
    } else {
      localStorage.setItem('cozy_rereedeem', JSON.stringify({ productName: currentOrder.items[0].productName }));
      location.href = 'mall.html';
    }
  }

  function copyOrderNo() {
    const no = document.getElementById('orderNo').textContent.trim();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(no).then(() => toast('订单号已复制')).catch(() => {});
    } else {
      toast('订单号：' + no);
    }
  }

  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
