<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>订单详情 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F5F3; color:#2B1E16;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --primary:#753A22; --primary-deep:#5E2E1B;
    --accent:#526C43; --accent-soft:#E8EDE5;
    --ink:#2B1E16; --muted:#756A63; --placeholder:#9E948E;
    --border:#E3DED8; --surface:#F7F5F3; --card:#FFFFFF; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部导航 ── */
  .top-nav {
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:#fff;
  }
  .nav-back { font-size:26px; line-height:1; color:var(--ink); cursor:pointer; padding:6px 4px; width:32px; }
  .nav-title { position:absolute; left:50%; transform:translateX(-50%); font-size:16px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .nav-right { width:32px; }

  .page { padding:6px 20px 60px; }

  /* ── 未支付：等待支付卡（无取餐码，取消/立即支付 CTA） ── */
  .pending-card {
    margin-top:12px; padding:20px 16px 16px;
    border-radius:14px; background:var(--card);
  }
  .pending-title { display:block; font-family:var(--serif); font-size:20px; font-weight:600; color:var(--ink); }
  .pending-sub { display:block; margin-top:6px; font-size:12px; color:var(--muted); }
  .pending-actions { display:flex; gap:10px; margin-top:18px; }
  .pending-btn {
    flex:1; height:42px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:650; cursor:pointer;
  }
  .pending-btn.ghost { border:1px solid var(--border); background:var(--card); color:var(--ink); }
  .pending-btn.solid { background:var(--ink); color:#fff; }
  .pending-btn:active { opacity:.85; }

  /* ── 状态卡（白卡：取餐码居中 + 三节点进度） ── */
  .status-card {
    margin-top:12px; padding:22px 16px 20px;
    border-radius:14px; background:var(--card); text-align:center;
  }
  .status-line { display:block; font-size:13px; color:var(--ink); }
  .pickup-code-block { margin-top:15px; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .pickup-label { font-size:13px; color:var(--muted); }
  .pickup-code {
    font-family:var(--serif); font-size:32px; font-weight:700;
    letter-spacing:.06em; line-height:1; word-break:break-all;
  }
  .pickup-code.long { font-size:21px; letter-spacing:.02em; }
  .pickup-eta { display:block; margin-top:9px; font-size:12px; color:var(--muted); }

  /* 三节点进度：短线在 icon 之间下方，仅当前节点墨黑高亮 */
  .progress { position:relative; display:flex; margin-top:20px; }
  .progress-seg { position:absolute; top:38px; height:2px; background:var(--border); transition:background .3s; }
  .progress-seg.on { background:var(--ink); }
  .seg-a { left:25.83%; width:15%; }
  .seg-b { left:59.17%; width:15%; }
  .progress-step { flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .progress-icon { position:relative; z-index:1; width:24px; height:24px; }
  .progress-icon svg { width:24px; height:24px; }
  .progress-label { font-size:11px; color:var(--muted); }
  .progress-step.current .progress-label { color:var(--ink); font-weight:650; }

  /* ── 门店 + 商品（白卡，合并为一个板块） ── */
  .store-products {
    margin-top:12px; padding:4px 16px 20px;
    border-radius:14px; background:var(--card);
  }
  .sp-store {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:15px 2px 13px;
  }
  .sp-store-copy { flex:1; min-width:0; }
  .sp-store-name { display:block; font-family:var(--serif); font-size:15px; font-weight:600; color:var(--ink); }
  .sp-store-addr { display:block; margin-top:4px; font-size:11px; line-height:1.5; color:var(--muted); }
  .sp-store-actions { flex:none; display:flex; gap:6px; }
  .store-act {
    width:30px; height:30px; border-radius:50%;
    border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center;
    color:var(--primary); cursor:pointer;
  }
  .store-act svg { width:16px; height:16px; }

  .sp-divider { height:1px; background:var(--border); margin:10px 0; }

  .sp-product { display:flex; align-items:center; gap:12px; padding:13px 2px; }
  .sp-product-img {
    flex:none; width:56px; height:56px; border-radius:10px;
    background:linear-gradient(135deg,#E8DDD2,#D8C8B4);
  }
  .sp-product-main { flex:1; min-width:0; }
  .sp-name { display:block; font-size:14px; font-weight:650; color:var(--ink); }
  .sp-spec { display:block; margin-top:4px; font-size:11px; line-height:1.5; color:var(--muted); }
  .sp-right { flex:none; text-align:right; }
  .sp-price { display:block; font-size:14px; font-weight:650; color:var(--ink); }
  .sp-qty { display:block; margin-top:4px; font-size:11px; color:var(--muted); }
  .sp-points { display:block; font-size:13px; font-weight:700; color:var(--primary); }

  /* ── 金额（商品小计/配送费/优惠合计可折叠/实付） ── */
  .sp-amount { padding:4px 2px 0; }
  .sp-amount-row {
    min-height:28px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-size:13px; color:var(--ink);
  }
  .sp-amount-row.discount { color:var(--primary); }
  .sp-collapse { cursor:pointer; }
  .collapse-left { display:flex; align-items:center; gap:5px; }
  .collapse-arrow {
    font-size:16px; line-height:1; color:var(--placeholder);
    transform:rotate(90deg); transition:transform .3s;
  }
  .sp-collapse.open .collapse-arrow { transform:rotate(270deg); }
  .sp-collapse-body { max-height:0; overflow:hidden; opacity:0; transition:max-height .3s, opacity .25s; }
  .sp-collapse-body.open { max-height:100px; opacity:1; }
  .sp-coupon-line {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:2px 2px 2px 12px; padding:7px 2px 7px 10px;
    border-left:1px solid var(--border);
    font-size:12px; color:var(--ink);
  }
  .sp-coupon-line span:last-child { color:var(--primary); font-weight:650; }

  .sp-total-line {
    display:flex; align-items:baseline; justify-content:flex-end; gap:6px;
    margin-top:6px; padding-top:10px;
    font-size:13px;
  }
  .total-muted { color:var(--muted); }
  .total-value { color:var(--primary); font-size:17px; font-weight:750; }

  /* ── 订单信息（实付下方，分隔线分隔） ── */
  .meta-row {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:8px 2px; font-size:12px; color:var(--muted);
  }
  .meta-row span:last-child { color:var(--ink); text-align:right; }
  .meta-value { display:flex; align-items:center; gap:6px; min-width:0; }
  .meta-value .addr-text { max-width:220px; }
  .copy-btn {
    flex:none; padding:0 7px; border-radius:6px;
    border:1px solid var(--border); color:var(--muted);
    font-size:11px; font-weight:600; cursor:pointer;
  }
  .copy-btn:active { opacity:.6; }

  /* ── 本次获得（完成咖啡订单） ── */
  .sp-reward {
    display:flex; align-items:center; justify-content:flex-end; gap:8px;
    padding:0 2px 12px;
  }
  .sp-reward-label { flex:none; color:var(--muted); font-size:11px; }
  .sp-reward-values { display:flex; align-items:center; gap:8px; }
  .sp-reward-item { display:flex; align-items:center; gap:3px; }
  .sp-reward-item svg { width:11px; height:11px; }
  .sp-reward-text { color:var(--primary); font-size:11px; font-weight:650; }
  .sp-reward-sep { color:var(--border); font-size:11px; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>

      type:'redeem', status:'cancelled', statusText:'已取消 · 积分已退还',
      productName:'拿铁金定制马克杯', pointsCost:1200, qty:1,
      time:'2026-06-30 19:05:11', orderNo:'RD202606300006',
      storeName:'杭州中心店', storeAddr:'到店自提 · 文三路 128 号'
    }
  };

  const MEMBER_POINTS = 2460;

  let currentOrder = null;
  let countdownTimer = null;

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtPoints(n) { return Number(n || 0).toLocaleString(); }

  function renderCountdown() {
    if (!currentOrder || currentOrder.status !== 'pending') return;
    const remain = Math.max(0, Math.floor((currentOrder.expireAt - Date.now()) / 1000));
    document.getElementById('pendingTitle').textContent = '等待支付，剩余 ' + pad(Math.floor(remain / 60)) + ':' + pad(remain % 60);
  }

  (function init() {
    const id = new URLSearchParams(location.search).get('id');
    const o = ORDERS[id] || ORDERS.coz2026073110;
    currentOrder = o;

    const redeem = o.type === 'redeem';
    const delivery = !!o.delivery;
    const virtual = !!o.virtual;
    const pending = !redeem && o.status === 'pending';
    const cancelled = o.status === 'cancelled';
    const completed = o.status === 'completed';

    // 未支付（咖啡单）→ 等待支付卡
    document.getElementById('pendingCard').style.display = pending ? 'block' : 'none';
    document.getElementById('statusCard').style.display = pending ? 'none' : 'block';
    if (pending) { countdownTimer = setInterval(renderCountdown, 1000); renderCountdown(); }

    if (!pending) {
      // 状态行：兑换单 / 已取消
      document.getElementById('statusLine').style.display = (redeem || cancelled) ? 'block' : 'none';
      document.getElementById('statusLine').textContent = o.statusText || '';

      // 取餐码 / 预计送达(咖啡外送) / 物流单号(兑换快递) / 兑换码 / 取货码
      const caption = !redeem && delivery ? '预计送达'
        : (delivery ? '物流单号' : (virtual ? '兑换码' : (redeem ? '取货码' : '取餐码')));
      const code = cancelled ? '—' : (o.code || o.pickupCode || o.deliveryTime || '—');
      document.getElementById('pickupLabel').textContent = caption;
      document.getElementById('pickupCode').textContent = code;
      document.getElementById('pickupCode').classList.toggle('long', code.length > 6);
      document.getElementById('pickupEta').textContent = cancelled ? '' : (o.eta || '');
      document.getElementById('pickupBlock').style.display = cancelled ? 'none' : 'flex';

      // 三节点进度（咖啡单；配送用 truck / 待送达；已取消单不展示）
      if (!redeem && !cancelled) {
        document.getElementById('progress').style.display = 'flex';
        const reached = o.status === 'processing' ? 1 : (completed ? 2 : -1);
        const icons = ['receipt', 'coffee', delivery ? 'truck' : 'bell'];
        const labels = ['已下单', '制作中', delivery ? '待送达' : '待取餐'];
        for (let i = 0; i < 3; i++) {
          const icon = document.getElementById('icon' + i);
          icon.innerHTML = ICONS[icons[i]];
          icon.style.color = i === reached ? '#2B1E16' : '#C0B8B1';
          document.getElementById('step' + i).querySelector('.progress-label').textContent = labels[i];
          document.getElementById('step' + i).classList.toggle('current', i === reached);
        }
        document.getElementById('segA').classList.toggle('on', reached >= 1);
        document.getElementById('segB').classList.toggle('on', reached >= 2);
      } else {
        document.getElementById('progress').style.display = 'none';
      }
    }

    // 门店 + 商品
    document.getElementById('storeName').textContent = o.storeName || (delivery ? '配送至' : 'CozyCoffee 中心店');
    document.getElementById('storeAddr').textContent = o.storeAddr || (delivery ? '配送至 · ' + (o.receiver || '') : '杭州 · 文三路 128 号');
    document.getElementById('storeActions').style.display = (delivery || virtual) ? 'none' : 'flex';

    const productName = o.productName || '';
    document.getElementById('productList').innerHTML = (o.items || [{
      name: productName,
      spec: redeem ? '数量 ×' + (o.qty || 1) : '',
      price: redeem ? fmtPoints(o.pointsCost) + ' 积分' : '',
      qty: redeem ? '' : '× 1'
    }]).map(it => `
      <div class="sp-product">
        <div class="sp-product-img"></div>
        <div class="sp-product-main">
          <span class="sp-name">${it.name}</span>
          <span class="sp-spec">${it.spec}</span>
        </div>
        <div class="sp-right">
          ${redeem
            ? `<span class="sp-points">${it.price}</span>`
            : `<span class="sp-price">${it.price}</span><span class="sp-qty">${it.qty}</span>`}
        </div>
      </div>`).join('');

    // 金额：兑换单 消耗积分 / 咖啡单 小计+可折叠配送费/优惠
    const amountRows = document.getElementById('amountRows');
    if (redeem) {
      amountRows.innerHTML = `
        <div class="sp-amount-row"><span>消耗积分</span><span>${fmtPoints(o.pointsCost)} 积分</span></div>
        <div class="sp-amount-row"><span>兑换后剩余</span><span>${fmtPoints(MEMBER_POINTS)} 积分</span></div>
        <div class="sp-total-line"><span class="total-muted">共 ${o.qty || 1} 件商品，实付</span><span class="total-value">${fmtPoints(o.pointsCost)} 积分</span></div>`;
    } else {
      const hasFee = Number(o.deliveryFee || 0) > 0;
      const hasDiscount = o.discount && Number(o.discount.replace(/[^0-9.-]/g, '')) > 0;
      const totalQty = (o.items || []).reduce((s, it) => s + Number(it.qty.replace(/[^\d]/g, '') || 1), 0);
      amountRows.innerHTML = `
        <div class="sp-amount-row"><span>商品小计</span><span>${o.goodsAmount}</span></div>
        ${(hasFee || hasDiscount) ? `
          <div class="sp-collapse" onclick="toggleCollapse(this)">
            ${hasFee ? `<div class="sp-amount-row"><span>配送费</span><span>${o.deliveryFee}</span></div>` : ''}
            ${hasDiscount ? `<div class="sp-amount-row discount">
              <div class="collapse-left"><span>优惠合计</span><span class="collapse-arrow">›</span></div>
              <span>${o.discount}</span>
            </div>` : ''}
          </div>
          <div class="sp-collapse-body">
            <div class="sp-coupon-line"><span>${o.couponName || '优惠券'}</span><span>${o.discount}</span></div>
          </div>` : ''}
        <div class="sp-total-line"><span class="total-muted">共 ${totalQty} 件商品，实付</span><span class="total-value">${o.paid}</span></div>`;
    }

    // 订单信息
    document.getElementById('orderTime').textContent = o.time;
    document.getElementById('orderNo').textContent = o.orderNo;
    const isDelivery = !!o.delivery;
    document.getElementById('deliveryDivider').style.display = isDelivery ? 'block' : 'none';
    document.getElementById('deliveryMethodRow').style.display = isDelivery ? 'flex' : 'none';
    document.getElementById('deliveryAddrRow').style.display = isDelivery ? 'flex' : 'none';
    document.getElementById('deliveryAddr').textContent = o.receiver || '';

    // 本次获得（完成咖啡订单）
    const rewardRow = document.getElementById('rewardRow');
    if (!redeem && completed && o.points) {
      rewardRow.style.display = 'flex';
      rewardRow.innerHTML = `
        <span class="sp-reward-label">本次获得</span>
        <div class="sp-reward-values">
          <div class="sp-reward-item">${ICONS.star}<span class="sp-reward-text">积分 ${o.points}</span></div>
          <span class="sp-reward-sep">|</span>
          <div class="sp-reward-item">${ICONS.sparkle}<span class="sp-reward-text">成长值 ${o.exp}</span></div>
        </div>`;
    }
  })();

  function toggleCollapse(el) {
    el.classList.toggle('open');
    const body = el.parentElement.querySelector('.sp-collapse-body');
    if (body) body.classList.toggle('open', el.classList.contains('open'));
  }

  function copyOrderNo() {
    const no = document.getElementById('orderNo').textContent.trim();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(no).then(() => toast('订单号已复制')).catch(() => {});
    } else {
      toast('订单号：' + no);
    }
  }

  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
