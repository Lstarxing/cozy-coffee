<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>订单详情 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F5F3; color:#2B1E16;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --primary:#753A22; --primary-deep:#5E2E1B;
    --accent:#526C43; --accent-soft:#E8EDE5;
    --ink:#2B1E16; --muted:#756A63; --placeholder:#9E948E;
    --border:#E3DED8; --surface:#F7F5F3; --card:#FFFFFF; --cask:#2C1E18;
    --error:#FF4D4F;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部导航 ── */
  .top-nav {
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:#fff;
  }
  .nav-back { font-size:26px; line-height:1; color:var(--ink); cursor:pointer; padding:6px 4px; width:32px; }
  .nav-title { position:absolute; left:50%; transform:translateX(-50%); font-size:16px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .nav-right { width:32px; }

  .page { padding:8px 20px 60px; }

  /* ── 未支付：等待支付卡 ── */
  .pending-card {
    margin-top:12px; padding:26px 20px 20px;
    border-radius:14px; background:var(--card);
  }
  .pending-title { display:block; font-family:var(--serif); font-size:20px; font-weight:600; color:var(--ink); }
  .pending-sub { display:block; margin-top:6px; font-size:12px; color:var(--muted); }
  .pending-actions { display:flex; gap:10px; margin-top:18px; }
  .pending-btn {
    flex:1; height:42px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:650; cursor:pointer;
  }
  .pending-btn.ghost { border:1px solid var(--border); background:var(--card); color:var(--ink); }
  .pending-btn.solid { background:var(--ink); color:#fff; }
  .pending-btn:active { opacity:.85; }

  /* ── 状态卡（白卡：取餐号居中 + 三节点进度） ── */
  .status-card {
    margin-top:12px; padding:26px 20px 22px;
    border-radius:14px; background:var(--card); text-align:center;
  }
  .status-line { display:block; font-size:13px; color:var(--ink); }
  .pickup-label { display:block; margin-top:14px; font-size:12px; color:var(--muted); }
  .pickup-code {
    display:block; margin-top:6px;
    font-family:var(--serif); font-size:36px; font-weight:700; letter-spacing:.06em; line-height:1;
  }
  .pickup-eta { display:block; margin-top:10px; font-size:12px; color:var(--muted); }

  /* 三节点进度 */
  .progress { position:relative; display:flex; margin-top:26px; }
  .progress-track, .progress-fill { position:absolute; top:11px; height:2px; }
  .progress-track { left:16.66%; right:16.66%; background:var(--border); }
  .progress-fill { left:16.66%; background:var(--ink); }
  .progress-step { flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .progress-icon { position:relative; z-index:1; width:24px; height:24px; }
  .progress-icon svg { width:24px; height:24px; }
  .progress-label { font-size:11px; color:var(--muted); }
  .progress-step.current .progress-label { color:var(--ink); font-weight:650; }

  /* ── 门店 + 商品（白卡） ── */
  .store-products {
    margin-top:12px; padding:8px 16px 24px;
    border-radius:14px; background:var(--card);
  }
  .sp-store {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:18px 2px 16px;
  }
  .sp-store-copy { flex:1; min-width:0; }
  .sp-store-name { display:block; font-family:var(--serif); font-size:18px; font-weight:600; color:var(--ink); }
  .sp-store-addr { display:block; margin-top:4px; font-size:12px; color:var(--muted); }
  .sp-store-actions { flex:none; display:flex; gap:8px; }
  .store-act {
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center;
    color:var(--primary); cursor:pointer;
  }
  .store-act svg { width:16px; height:16px; }

  .sp-divider { height:1px; background:var(--border); margin:10px 0; }

  .sp-product { display:flex; align-items:center; gap:14px; padding:14px 0; }
  .sp-product-img {
    flex:none; width:56px; height:56px; border-radius:10px;
    background:linear-gradient(135deg,#E8DDD2,#D8C8B4);
  }
  .sp-product-main { flex:1; min-width:0; }
  .sp-name { display:block; font-size:14px; font-weight:650; color:var(--ink); }
  .sp-spec { display:block; margin-top:4px; font-size:12px; color:var(--muted); line-height:1.5; }
  .sp-right { flex:none; text-align:right; }
  .sp-price { display:block; font-size:14px; font-weight:650; color:var(--ink); }
  .sp-qty { display:block; margin-top:4px; font-size:11px; color:var(--muted); }
  .sp-points { display:block; font-size:13px; font-weight:700; color:var(--primary); }

  /* ── 金额（商品小计/优惠合计可折叠/实付） ── */
  .sp-amount { padding:8px 2px 0; }
  .sp-amount-row {
    min-height:28px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-size:13px; color:var(--ink);
  }
  .sp-amount-row.discount { color:var(--primary); }
  .collapse-left { display:flex; align-items:center; gap:5px; }
  .collapse-arrow {
    font-size:16px; line-height:1; color:var(--placeholder);
    transform:rotate(90deg); transition:transform .3s;
  }
  .collapse-arrow.open { transform:rotate(270deg); }
  .sp-collapse-body { max-height:0; overflow:hidden; opacity:0; transition:max-height .3s, opacity .25s; }
  .sp-collapse-body.open { max-height:120px; opacity:1; }
  .sp-coupon-line {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:2px 2px 2px 12px; padding:7px 2px 7px 10px;
    border-left:1px solid var(--border);
    font-size:12px; color:var(--ink);
  }
  .sp-coupon-line span:last-child { color:var(--primary); font-weight:650; }

  .sp-total-line {
    display:flex; align-items:baseline; justify-content:flex-end; gap:6px;
    margin-top:6px; padding-top:12px;
    font-size:13px;
  }
  .total-muted { color:var(--muted); }
  .total-value { color:var(--primary); font-size:17px; font-weight:750; }

  /* ── 订单信息（实付下方，分隔线分隔） ── */
  .meta-row {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:9px 2px; font-size:12px; color:var(--muted);
  }
  .meta-row span:last-child { color:var(--ink); text-align:right; }
  .meta-value { display:flex; align-items:center; gap:6px; min-width:0; }
  .meta-value .addr-text { max-width:220px; }
  .copy-btn {
    flex:none; padding:0 7px; border-radius:6px;
    border:1px solid var(--border); color:var(--muted);
    font-size:11px; font-weight:600; cursor:pointer;
  }
  .copy-btn:active { opacity:.6; }

  /* ── 本次获得（完成订单） ── */
  .sp-reward {
    display:flex; align-items:center; justify-content:flex-end; gap:8px;
    padding:2px 2px 4px; font-size:12px;
  }
  .sp-reward .reward-label { color:var(--muted); }
  .sp-reward .reward-value { color:var(--primary); font-weight:650; }
  .sp-reward .reward-sep { color:var(--border); }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <div class="top-nav">
    <span class="nav-back" onclick="goBack('order.html')">‹</span>
    <span class="nav-title">订单详情</span>
    <span class="nav-right"></span>
  </div>

  <!-- 未支付：等待支付卡 -->
  <div class="pending-card" id="pendingCard" style="display:none">
    <span class="pending-title" id="pendingTitle">等待支付，剩余 09:08</span>
    <span class="pending-sub">超过15分钟未支付，订单将自动取消</span>
    <div class="pending-actions">
      <div class="pending-btn ghost" onclick="toast('取消订单')">取消订单</div>
      <div class="pending-btn solid" onclick="toast('立即支付')">立即支付</div>
    </div>
  </div>

  <!-- 状态卡（白卡：取餐号 + 三节点进度） -->
  <div class="status-card" id="statusCard">
    <span class="status-line" id="statusLine" style="display:none"></span>
    <span class="pickup-label" id="pickupLabel">取餐码</span>
    <span class="pickup-code" id="pickupCode">A021</span>
    <span class="pickup-eta" id="pickupEta">预计 15:32 可取</span>

    <!-- 三节点进度 -->
    <div class="progress" id="progress">
      <div class="progress-track"></div>
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-step" id="step0"><span class="progress-icon" id="icon0"></span><span class="progress-label">已下单</span></div>
      <div class="progress-step" id="step1"><span class="progress-icon" id="icon1"></span><span class="progress-label">制作中</span></div>
      <div class="progress-step" id="step2"><span class="progress-icon" id="icon2"></span><span class="progress-label">待取餐</span></div>
    </div>
  </div>

  <!-- 门店 + 商品（白卡） -->
  <div class="store-products">
    <div class="sp-store">
      <div class="sp-store-copy">
        <span class="sp-store-name" id="storeName">CozyCoffee 中心店</span>
        <span class="sp-store-addr" id="storeAddr">杭州 · 文三路 128 号</span>
      </div>
      <div class="sp-store-actions" id="storeActions">
        <span class="store-act" onclick="toast('拨打门店电话')" title="电话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.1.9-2 2-2h2l1.5 4.5L7 10a13 13 0 0 0 7 7l1.5-2.5L20 16v2a2 2 0 0 1-2 2A14 14 0 0 1 4 6z"/></svg>
        </span>
        <span class="store-act" onclick="toast('打开导航')" title="导航">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.2-6-11a6 6 0 0 1 12 0c0 5.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
        </span>
      </div>
    </div>

    <div class="sp-divider"></div>

    <div id="productList"></div>

    <div class="sp-divider"></div>

    <!-- 金额 -->
    <div class="sp-amount" id="amountArea">
      <div class="sp-amount-row"><span>商品小计</span><span id="subtotal">¥60.00</span></div>

      <div class="sp-collapse" id="collapse" style="display:none">
        <div class="sp-amount-row" id="deliveryFeeRow" style="display:none"><span>配送费</span><span id="deliveryFeeVal">¥3.00</span></div>
        <div class="sp-amount-row discount">
          <div class="collapse-left">
            <span>优惠合计</span>
            <span class="collapse-arrow" id="collapseArrow" onclick="toggleCollapse()">›</span>
          </div>
          <span id="discountVal">-¥10.00</span>
        </div>
      </div>
      <div class="sp-collapse-body" id="collapseBody">
        <div class="sp-coupon-line"><span>满35减10</span><span id="couponAmt">-¥10.00</span></div>
      </div>

      <div class="sp-total-line">
        <span class="total-muted" id="totalCount">共 2 件商品，实付</span>
        <span class="total-value" id="paid">¥50.00</span>
      </div>

      <div class="sp-divider"></div>

      <div class="meta-row"><span>下单时间</span><span id="orderTime">2026-07-31 15:28:45</span></div>
      <div class="meta-row"><span>订单编号</span><span class="meta-value"><span id="orderNo">COZ2026073110</span><em class="copy-btn" onclick="copyOrderNo()">复制</em></span></div>
      <div class="meta-row" id="deliveryMethodRow" style="display:none"><span>配送方式</span><span>外送</span></div>
      <div class="meta-row" id="deliveryAddrRow" style="display:none"><span>配送地址</span><span class="meta-value"><span class="addr-text" id="deliveryAddr"></span></span></div>
    </div>
  </div>

  <!-- 本次获得（完成订单） -->
  <div class="sp-reward" id="rewardRow" style="display:none">
    <span class="reward-label">本次获得</span>
    <span class="reward-value">+50 积分</span>
    <span class="reward-sep">|</span>
    <span class="reward-value">+10 成长值</span>
  </div>

</div>

<script>
  const ICONS = {
    receipt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>',
    coffee: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg>',
    bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>'
  };

  const ORDERS = {
    /* 待支付 */
    coz2026080101: {
      type:'coffee', status:'pending',
      goodsAmount:'¥22.00', discount:'¥0.00', paid:'¥22.00',
      time:'2026-08-01 09:00:00', orderNo:'COZ2026080101'
    },
    /* 制作中 · 自提 */
    coz2026073110: {
      type:'coffee', status:'processing',
      goodsAmount:'¥60.00', discount:'¥10.00', paid:'¥50.00',
      couponName:'满35减10', totalQty:2,
      items:[
        { name:'经典手冲', spec:'热 / 中杯 / 默认糖', price:'¥28.00', qty:'× 1' },
        { name:'Dirty', spec:'冰 / 中杯 / 正常', price:'¥32.00', qty:'× 1' }
      ],
      time:'2026-07-31 15:28:45', orderNo:'COZ2026073110'
    },
    /* 已完成 · 外送 */
    coz2026072907: {
      type:'coffee', status:'completed', fulfillment:'delivery',
      goodsAmount:'¥66.00', discount:'¥0.00', paid:'¥69.00', deliveryFee:'¥3.00',
      deliveryAddr:'文三路 128 号 3 幢 1 单元 · 张三（先生）15168226973',
      items:[
        { name:'瓶装冷萃', spec:'冰 / 中杯 / 无糖', price:'¥28.00', qty:'× 1' },
        { name:'冰摇荔枝咖啡', spec:'冰 / 大杯 / 微糖', price:'¥38.00', qty:'× 1' }
      ],
      points:'+66', exp:'+66',
      time:'2026-07-29 09:12:30', orderNo:'COZ2026072907'
    }
  };

  let currentOrder = null;

  (function init() {
    const id = new URLSearchParams(location.search).get('id');
    const o = ORDERS[id] || ORDERS.coz2026073110;
    currentOrder = o;

    const pending = o.status === 'pending';
    document.getElementById('pendingCard').style.display = pending ? 'block' : 'none';
    document.getElementById('statusCard').style.display = pending ? 'none' : 'block';

    if (!pending) {
      document.getElementById('pickupCode').textContent = o.type === 'coffee' ? 'A021' : 'P72811';
      document.getElementById('pickupLabel').textContent = o.fulfillment === 'delivery' ? '预计送达' : '取餐码';
      document.getElementById('pickupEta').textContent = o.fulfillment === 'delivery'
        ? (o.status === 'completed' ? '订单已完成 · 已送达' : '预计 15:32 送达')
        : (o.status === 'completed' ? '已完成 · 待取餐' : '预计 15:32 可取');
      document.getElementById('statusLine').style.display = o.type === 'redeem' ? 'block' : 'none';
      document.getElementById('statusLine').textContent = o.statusText || '';

      // 三节点进度（咖啡单）
      if (o.type === 'coffee') {
        document.getElementById('progress').style.display = 'flex';
        const reached = o.status === 'processing' ? 1 : 2;
        const icons = ['receipt', 'coffee', 'bell'];
        for (let i = 0; i < 3; i++) {
          document.getElementById('icon' + i).innerHTML = ICONS[icons[i]];
          document.getElementById('icon' + i).style.color = i <= reached ? '#2B1E16' : '#9E948E';
          if (i === reached) document.getElementById('step' + i).className = 'progress-step current';
        }
        document.getElementById('progressFill').style.width = (reached / 2) * 66.66 + '%';
      }
    }

    // 门店 + 商品
    document.getElementById('storeName').textContent = 'CozyCoffee 中心店';
    document.getElementById('storeAddr').textContent = o.fulfillment === 'delivery' ? '配送至 · ' + (o.deliveryAddr || '') : '杭州 · 文三路 128 号';
    document.getElementById('storeActions').style.display = o.fulfillment === 'delivery' ? 'none' : 'flex';

    if (o.items) {
      document.getElementById('productList').innerHTML = o.items.map(it => `
        <div class="sp-product">
          <div class="sp-product-img"></div>
          <div class="sp-product-main">
            <span class="sp-name">${it.name}</span>
            <span class="sp-spec">${it.spec}</span>
          </div>
          <div class="sp-right">
            <span class="sp-price">${it.price}</span><span class="sp-qty">${it.qty}</span>
          </div>
        </div>`).join('');
    }

    // 金额
    document.getElementById('subtotal').textContent = o.goodsAmount;
    const hasDiscount = Number(o.discount) > 0;
    const hasFee = Number(o.deliveryFee || 0) > 0;
    document.getElementById('collapse').style.display = (hasDiscount || hasFee) ? 'block' : 'none';
    document.getElementById('deliveryFeeRow').style.display = hasFee ? 'flex' : 'none';
    document.getElementById('deliveryFeeVal').textContent = o.deliveryFee;
    document.getElementById('discountVal').textContent = o.discount;
    document.getElementById('collapseBody').style.display = hasDiscount ? 'block' : 'none';
    document.querySelector('#collapseBody .sp-coupon-line span:first-child').textContent = o.couponName || '优惠券';
    document.getElementById('couponAmt').textContent = o.discount;
    if (!hasDiscount) document.getElementById('collapseBody').style.display = 'none';

    document.getElementById('totalCount').textContent = `共 ${o.totalQty || (o.items ? o.items.length : 1)} 件商品，实付`;
    document.getElementById('paid').textContent = o.paid;

    // 订单信息
    document.getElementById('orderTime').textContent = o.time;
    document.getElementById('orderNo').textContent = o.orderNo;
    document.getElementById('deliveryMethodRow').style.display = o.fulfillment === 'delivery' ? 'flex' : 'none';
    document.getElementById('deliveryAddrRow').style.display = o.fulfillment === 'delivery' ? 'flex' : 'none';
    document.getElementById('deliveryAddr').textContent = o.deliveryAddr || '';

    // 本次获得
    const rewardRow = document.getElementById('rewardRow');
    if (o.status === 'completed' && o.points) {
      rewardRow.style.display = 'flex';
      rewardRow.innerHTML = `
        <span class="reward-label">本次获得</span>
        <span class="reward-value">${o.points} 积分</span>
        <span class="reward-sep">|</span>
        <span class="reward-value">${o.exp} 成长值</span>`;
    }
  })();

  function toggleCollapse() {
    const arrow = document.getElementById('collapseArrow');
    const body = document.getElementById('collapseBody');
    const open = arrow.classList.toggle('open');
    body.classList.toggle('open', open);
  }

  function copyOrderNo() {
    const no = document.getElementById('orderNo').textContent.trim();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(no).then(() => toast('订单号已复制')).catch(() => {});
    } else {
      toast('订单号：' + no);
    }
  }

  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
