<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>商品详情 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F5F3; color:#2B1E16;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --primary:#753A22; --primary-deep:#5E2E1B;
    --accent:#526C43; --accent-soft:#E8EDE5;
    --ink:#2B1E16; --muted:#756A63; --placeholder:#9E948E;
    --border:#E3DED8; --surface:#F7F5F3; --card:#FFFFFF; --cask:#2C1E18;
    --muted-on-dark:#C7BEB7;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部导航 ── */
  .top-nav {
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:#fff;
    border-bottom:1px solid var(--border);
  }
  .nav-back { font-size:26px; line-height:1; color:var(--ink); cursor:pointer; padding:6px 4px; width:32px; text-decoration:none; }
  .nav-title { position:absolute; left:50%; transform:translateX(-50%); font-size:16px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .nav-right { width:32px; }

  .detail-content { padding-bottom:28px; }

  /* ── 商品大图 ── */
  .product-hero {
    width:100%; height:320px; display:block;
    background:linear-gradient(135deg,#E8DDD2,#D8C8B4);
  }

  /* ── 商品信息卡（上叠） ── */
  .product-info {
    margin:-17px 12px 0; padding:17px 15px 15px;
    position:relative; border-radius:14px; background:#fff;
  }
  .product-category { display:block; color:var(--primary); font-size:10px; font-weight:750; letter-spacing:.08em; }
  .product-name { display:block; margin-top:6px; color:var(--ink); font-size:22px; font-family:var(--serif); font-weight:600; }
  .product-description { display:block; margin-top:8px; color:var(--muted); font-size:12px; line-height:1.65; }
  .price-row { margin-top:13px; padding-top:11px; display:flex; align-items:baseline; justify-content:space-between; border-top:1px solid var(--border); }
  .price-label { color:var(--muted); font-size:11px; }
  .product-price { color:var(--primary); font-size:19px; font-weight:760; }

  /* ── 选规格入口（深色卡） ── */
  .spec-hint {
    margin:10px 12px 0; padding:13px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-radius:14px; background:var(--cask); color:#fff; cursor:pointer;
  }
  .hint-title { display:block; font-size:13.5px; font-weight:700; }
  .hint-copy { display:block; margin-top:4px; color:var(--muted-on-dark); font-size:10px; line-height:1.5; }
  .hint-arrow { flex:none; font-size:17px; }

  .detail-spacer { height:76px; }

  /* ── 底部操作栏 ── */
  .action-bar {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:390px; min-height:54px;
    padding:8px 13px; display:flex; align-items:center; gap:11px;
    border-top:1px solid var(--border); background:#fff; z-index:30;
  }
  .cart-summary { min-width:105px; display:flex; align-items:center; gap:7px; cursor:pointer; }
  .cart-count {
    width:27px; height:27px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:var(--cask); color:#fff;
    font-size:11px; font-weight:750;
  }
  .cart-label { display:block; color:var(--muted); font-size:9.5px; }
  .cart-total { display:block; margin-top:2px; color:var(--ink); font-size:12.5px; font-weight:700; }
  .select-button {
    flex:1; height:42px; display:flex; align-items:center; justify-content:center;
    border-radius:12px; background:var(--primary); color:#fff;
    font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .select-button:active { background:var(--primary-deep); }
</style>
</head>
<body>

  <!-- 顶部导航 -->
  <div class="top-nav">
    <a class="nav-back" href="menu.html">‹</a>
    <span class="nav-title">商品详情</span>
    <span class="nav-right"></span>
  </div>

  <div class="detail-content">
    <!-- 商品大图 -->
    <div class="product-hero"></div>

    <!-- 商品信息 -->
    <div class="product-info">
      <span class="product-category">拿铁系列</span>
      <span class="product-name">海盐焦糖拿铁</span>
      <span class="product-description">海盐 · 焦糖 · 丝滑</span>
      <div class="price-row">
        <span class="price-label">基础价</span>
        <span class="product-price">¥34.00</span>
      </div>
    </div>

    <!-- 选规格入口 -->
    <div class="spec-hint" onclick="go('spec.html')">
      <div>
        <span class="hint-title">选择你的口味</span>
        <span class="hint-copy">杯型、温度、甜度、奶型与咖啡浓度以当前商品配置为准。</span>
      </div>
      <span class="hint-arrow">→</span>
    </div>

    <div class="detail-spacer"></div>
  </div>

  <!-- 底部操作栏 -->
  <div class="action-bar">
    <div class="cart-summary" onclick="go('menu.html')">
      <span class="cart-count">0</span>
      <div>
        <span class="cart-label">购物车</span>
        <span class="cart-total">¥0.00</span>
      </div>
    </div>
    <div class="select-button" onclick="go('spec.html')">选择规格</div>
  </div>

<script>
  function go(href) { location.href = href; }
</script>
</body>
</html>
