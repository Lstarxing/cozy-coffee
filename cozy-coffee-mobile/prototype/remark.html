<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>订单备注 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F5F3; color:#2B1E16;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --primary:#753A22; --accent:#526C43; --accent-soft:#E8EDE5;
    --ink:#2B1E16; --muted:#756A63; --placeholder:#9E948E;
    --border:#E3DED8; --surface:#F7F5F3; --card:#FFFFFF;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部导航 ── */
  .top-nav {
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:#fff;
    border-bottom:1px solid var(--border);
  }
  .nav-back { font-size:26px; line-height:1; color:var(--ink); cursor:pointer; padding:6px 4px; width:32px; text-decoration:none; }
  .nav-title { position:absolute; left:50%; transform:translateX(-50%); font-size:16px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .nav-right { width:32px; }

  .page { padding:16px 16px 120px; }

  /* ── 备注输入框 ── */
  .remark-box { position:relative; background:var(--card); border-radius:14px; padding:18px 20px 32px; }
  .remark-input {
    width:100%; height:110px; resize:none; border:0; outline:none;
    font-family:'Inter',-apple-system,sans-serif;
    font-size:15px; line-height:1.6; color:var(--ink);
  }
  .remark-input::placeholder { color:var(--placeholder); }
  .char-count {
    position:absolute; right:20px; bottom:12px;
    font-size:11px; color:var(--placeholder);
  }

  /* ── 快捷输入 ── */
  .quick-section { margin-top:20px; }
  .quick-title {
    display:block; font-size:12px; font-weight:650; color:var(--muted);
    letter-spacing:.04em;
  }
  .quick-list { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .quick-chip {
    padding:8px 18px; border-radius:999px;
    border:1px solid var(--border); background:var(--card);
    color:var(--ink); font-size:13px; cursor:pointer; user-select:none;
  }
  .quick-chip.on {
    background:#F1E4DA; border-color:var(--primary); color:var(--primary); font-weight:650;
  }

  /* ── 底部保存条 ── */
  .submit-bar {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:390px; padding:10px 16px;
    border-top:1px solid var(--border); background:#fff; z-index:80;
  }
  .submit-btn {
    height:46px; display:flex; align-items:center; justify-content:center;
    border-radius:999px; background:var(--ink); color:#fff;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .submit-btn:active { opacity:.85; }
  .submit-btn.disabled { opacity:.4; }
</style>
</head>
<body>

  <!-- 顶部导航 -->
  <div class="top-nav">
    <a class="nav-back" href="confirm.html">‹</a>
    <span class="nav-title">订单备注</span>
    <span class="nav-right"></span>
  </div>

  <div class="page">
    <!-- 备注输入框 -->
    <div class="remark-box">
      <textarea class="remark-input" id="remarkInput" maxlength="50" placeholder="给这杯咖啡一点备注，如少冰、去糖…"></textarea>
      <span class="char-count" id="charCount">0/50</span>
    </div>

    <!-- 快捷输入（无“堂食”） -->
    <div class="quick-section">
      <span class="quick-title">快捷输入</span>
      <div class="quick-list" id="quickList">
        <span class="quick-chip" data-q="少冰" onclick="toggle(this)">少冰</span>
        <span class="quick-chip" data-q="去冰" onclick="toggle(this)">去冰</span>
        <span class="quick-chip" data-q="多冰" onclick="toggle(this)">多冰</span>
        <span class="quick-chip" data-q="少糖" onclick="toggle(this)">少糖</span>
        <span class="quick-chip" data-q="无糖" onclick="toggle(this)">无糖</span>
        <span class="quick-chip" data-q="不要杯套" onclick="toggle(this)">不要杯套</span>
        <span class="quick-chip" data-q="打包带走" onclick="toggle(this)">打包带走</span>
      </div>
    </div>
  </div>

  <!-- 底部保存 -->
  <div class="submit-bar">
    <div class="submit-btn disabled" id="saveBtn" onclick="save()">保存备注</div>
  </div>

<script>
  const input = document.getElementById('remarkInput');
  const QUICK = ['少冰','去冰','多冰','少糖','无糖','不要杯套','打包带走'];

  function tokens() {
    return input.value.split(/[\s，,。]+/).filter(Boolean);
  }

  function refresh() {
    const toks = tokens();
    // 输入 → 高亮 chips
    document.querySelectorAll('.quick-chip').forEach(chip => {
      chip.classList.toggle('on', toks.includes(chip.dataset.q));
    });
    // 字数
    document.getElementById('charCount').textContent = input.value.length + '/50';
    // 保存按钮可用态
    document.getElementById('saveBtn').classList.toggle('disabled', !input.value.trim());
  }

  // 与源码一致：按 token 切分加入/移除，不超过 50 字
  function toggle(chip) {
    const q = chip.dataset.q;
    let toks = tokens();
    if (toks.includes(q)) {
      input.value = toks.filter(t => t !== q).join(' ');
    } else {
      const next = [...toks, q].join(' ');
      if (next.length <= 50) input.value = next;
    }
    refresh();
  }

  function save() {
    if (!input.value.trim()) return;
    location.href = 'confirm.html';
  }

  input.addEventListener('input', refresh);
  refresh();
</script>
</body>
</html>
