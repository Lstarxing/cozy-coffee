<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --glaze-green:#526C43; --glaze-green-soft:#E8EDE5;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    /* aliases */
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22; --accent:#526C43;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .page { padding:20px 20px 110px; }

  /* ═══════════════════════════════════════
     会员卡片（紧凑 · 等级主题）
     ═══════════════════════════════════════ */
  .member-card {
    position:relative; overflow:hidden;
    padding:18px 20px 18px;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(43,30,22,.08);
    transition:background .35s ease, color .35s ease;
  }
  .member-card > * { position:relative; z-index:1; }
  .layer-shine {
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.05) 40%, transparent 70%);
  }
  .member-card.is-dark .layer-shine {
    background:linear-gradient(160deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.02) 45%, transparent 70%);
  }

  .card-top { display:flex; align-items:center; }
  .brand-row { display:flex; align-items:center; gap:7px; }
  .brand-logo { width:18px; height:18px; display:flex; align-items:center; justify-content:center; }
  .brand-logo svg { width:100%; height:100%; }
  .brand-text { font-size:10px; font-weight:800; letter-spacing:.24em; opacity:.84; }

  .card-identity {
    display:flex; align-items:center; gap:16px;
    margin-top:22px;
  }
  .level-emblem-wrap {
    position:relative; width:66px; height:66px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .level-emblem { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .level-emblem svg { width:100%; height:100%; filter: drop-shadow(0 8px 14px rgba(0,0,0,.22)); }
  .emblem-shine {
    position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.06) 40%, transparent 62%);
    border-radius:50%;
    mix-blend-mode:screen;
  }
  .identity-copy { flex:1; min-width:0; }
  .level-name {
    display:block;
    font-family:var(--serif); font-size:30px; font-weight:600; line-height:1.1;
  }
  .user-name {
    display:block; margin-top:6px;
    font-size:13px; opacity:.72;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .points-row {
    margin-top:18px; padding-top:16px;
    border-top:1px solid var(--line, currentColor);
    cursor:pointer;
  }
  .points-value {
    display:block;
    font-family:var(--serif); font-size:34px; font-weight:700; line-height:1;
    letter-spacing:-.01em;
  }
  .points-label {
    display:block; margin-top:7px;
    font-size:10px; font-weight:650; letter-spacing:.18em; opacity:.72;
  }

  .level-progress { margin-top:20px; }
  .growth-row {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:9px;
  }
  .growth-label { font-size:11px; opacity:.74; }
  .growth-exp { font-size:12px; font-weight:650; }
  .progress-track {
    height:3px; border-radius:2px;
    background:var(--track, rgba(60,40,30,.12));
    overflow:hidden;
  }
  .progress-fill {
    height:100%; border-radius:2px;
    background:var(--accent, currentColor);
    transition:width .4s ease;
  }

  /* ═══════════════════════════════════════
     等级预览（原型工具 · 紧凑）
     ═══════════════════════════════════════ */
  .level-preview {
    display:flex; align-items:center; gap:8px;
    margin-top:12px;
  }
  .preview-label {
    flex:none;
    font-size:9px; font-weight:700; letter-spacing:.14em;
    color:var(--placeholder);
  }
  .preview-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .preview-chip {
    display:flex; align-items:center; gap:5px;
    padding:4px 9px; border-radius:6px;
    border:1px solid var(--hairline);
    background:var(--card); color:var(--muted);
    font-size:10px; font-weight:600; cursor:pointer;
    transition:all .2s;
  }
  .preview-chip .chip-emblem { width:12px; height:12px; display:flex; }
  .preview-chip .chip-emblem svg { width:100%; height:100%; }
  .preview-chip.active {
    border-color:var(--roast-brown); color:var(--roast-brown);
    background:var(--porcelain-muted);
  }
  .preview-chip:active { opacity:.6; }

  /* ═══════════════════════════════════════
     卡片容器
     ═══════════════════════════════════════ */
  .entry-card {
    margin-top:14px;
    border-radius:14px; background:var(--card);
    overflow:hidden;
  }
  .entry-card.first { margin-top:26px; }

  /* ── 我的订单（两行入口，权重最高）── */
  .order-row {
    display:flex; align-items:center; gap:14px;
    padding:16px 18px;
    border-bottom:1px solid var(--border); cursor:pointer;
  }
  .order-row:last-child { border-bottom:0; }
  .order-ic {
    flex:none; width:36px; height:36px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); color:var(--quiet-ink);
  }
  .order-ic svg { width:19px; height:19px; }
  .order-copy { flex:1; min-width:0; }
  .order-name {
    display:block;
    font-size:14px; font-weight:600; color:var(--ink);
  }
  .order-note {
    display:block; margin-top:3px;
    font-size:11px; color:var(--muted);
  }
  .order-count {
    flex:none; min-width:22px; height:22px; padding:0 7px;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:999px;
    background:var(--surface); color:var(--muted);
    font-size:11px; font-weight:700;
  }
  .order-arrow { flex:none; font-size:18px; color:var(--placeholder); line-height:1; }

  /* ── 会员功能（一行 4 格 icon，无容器）── */
  .func-grid {
    display:grid; grid-template-columns:repeat(4,1fr);
    padding:28px 6px 26px;
  }
  .f-item {
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer; transition:opacity .2s;
  }
  .f-item:active { opacity:.55; }
  .f-icon {
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    color:var(--quiet-ink);
  }
  .f-icon svg { width:24px; height:24px; }
  .f-label { font-size:11px; color:var(--ink); font-weight:500; letter-spacing:.02em; }

  /* ── 服务（安静文字列表）── */
  .svc-row {
    display:flex; align-items:center; gap:12px;
    padding:16px 18px;
    border-bottom:1px solid var(--border); cursor:pointer;
  }
  .svc-row:last-child { border-bottom:0; }
  .svc-name { font-size:14px; color:var(--ink); }
  .svc-note { flex:1; text-align:right; font-size:11px; color:var(--muted); }
  .svc-arrow { flex:none; font-size:18px; color:var(--placeholder); line-height:1; }

  /* ═══════════════════════════════════════
     底部品牌区域
     ═══════════════════════════════════════ */
  .profile-footer { padding:46px 0 10px; text-align:center; }
  .footer-kicker {
    display:block;
    font-size:9px; font-weight:700; letter-spacing:.26em; color:var(--placeholder);
  }
  .footer-brand {
    display:block; margin-top:14px;
    font-family:var(--serif); font-size:18px; font-weight:700;
    letter-spacing:.3em; color:var(--ink);
  }
  .footer-tag {
    display:block; margin-top:10px;
    font-size:11px; letter-spacing:.08em; color:var(--muted);
  }
  .footer-about {
    display:inline-block; margin-top:18px;
    font-size:11px; letter-spacing:.08em;
    color:var(--placeholder); cursor:pointer;
    text-decoration:none;
  }
  .footer-about:active { opacity:.6; }

  /* ═══════════════════════════════════════
     底部 TabBar
     ═══════════════════════════════════════ */
  .tabbar {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:390px; height:54px;
    display:flex; align-items:center; justify-content:space-around;
    background:rgba(247,243,238,.94);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    z-index:10;
  }
  .tabbar-item {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:9px; font-weight:400; color:var(--muted);
    cursor:pointer; transition:color .25s;
  }
  .tabbar-item.active { color:var(--ink); }
  .tabbar-icon {
    width:20px; height:20px; display:flex; align-items:center; justify-content:center;
  }
  .tabbar-icon svg { width:19px; height:19px; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <!-- 会员卡片（紧凑） -->
  <div class="member-card" id="memberCard">
    <div class="layer-shine"></div>

    <div class="card-top">
      <div class="brand-row">
        <span class="brand-logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.5,8H19C20.66,8 22,9.34 22,11V13C22,14.66 20.66,16 19,16H18.28C17.76,18.29 15.63,20 13,20H7C4.24,20 2,17.76 2,15V8H18.5ZM19,10H18V14H19C19.55,14 20,13.55 20,13V11C20,10.45 19.55,10 19,10ZM7,3H9V6H7V3ZM11,3H13V6H11V3ZM15,3H17V6H15V3Z"/></svg></span>
        <span class="brand-text">COZY MEMBER</span>
      </div>
    </div>

    <div class="card-identity">
      <div class="level-emblem-wrap">
        <div class="level-emblem" id="levelEmblem"></div>
        <span class="emblem-shine"></span>
      </div>
      <div class="identity-copy">
        <span class="level-name" id="levelName">白银会员</span>
        <span class="user-name">Cozy 咖啡爱好者</span>
      </div>
    </div>

    <div class="points-row" onclick="go('points-history.html')">
      <span class="points-value" id="ledPoints">1,200</span>

    <div class="level-progress">
      <div class="growth-row">
        <span class="growth-label" id="growthLabel">距离黄金会员</span>
        <span class="growth-exp" id="growthExp">400 EXP</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- 等级预览（原型工具） -->
  <div class="level-preview">
    <span class="preview-label">预览</span>
    <div class="preview-chips" id="previewChips"></div>
  </div>

  <!-- 我的订单 -->
  <div class="entry-card first">
    <div class="order-row" onclick="go('order.html')">
      <span class="order-ic" id="icOrder"></span>
      <div class="order-copy">
        <span class="order-name">我的订单</span>
        <span class="order-note">制作进度与取餐</span>
      </div>
      <span class="order-count">3</span>
      <span class="order-arrow">›</span>
    </div>
    <div class="order-row" onclick="go('points-redemptions.html')">
      <span class="order-ic" id="icRedeem"></span>
      <div class="order-copy">
        <span class="order-name">兑换订单</span>
        <span class="order-note">积分兑换商品记录</span>
      </div>
      <span class="order-count">6</span>
      <span class="order-arrow">›</span>
    </div>
  </div>

  <!-- 会员功能 -->
  <div class="entry-card">
    <div class="func-grid">
      <div class="f-item" onclick="go('mall.html')">
        <span class="f-icon" id="icMall"></span>
        <span class="f-label">积分商城</span>
      </div>
      <div class="f-item" onclick="go('coupons.html')">
        <span class="f-icon" id="icCoupon"></span>
        <span class="f-label">优惠券</span>
      </div>
      <div class="f-item" onclick="go('signin.html')">
        <span class="f-icon" id="icSignin"></span>
        <span class="f-label">每日签到</span>
      </div>
      <div class="f-item" onclick="go('benefits.html')">
        <span class="f-icon" id="icBenefits"></span>
        <span class="f-label">会员权益</span>
      </div>
    </div>
  </div>

  <!-- 服务 -->
  <div class="entry-card">
    <div class="svc-row" onclick="go('address.html')">
      <span class="svc-name">收货地址</span>
      <span class="svc-note">配送地址管理</span>
      <span class="svc-arrow">›</span>
    </div>
    <div class="svc-row" onclick="toast('联系客服')">
      <span class="svc-name">联系客服</span>
      <span class="svc-note">在线咨询与反馈</span>
      <span class="svc-arrow">›</span>
    </div>
    <div class="svc-row" onclick="go('settings.html')">
      <span class="svc-name">账户设置</span>
      <span class="svc-note">安全、隐私与退出登录</span>
      <span class="svc-arrow">›</span>
    </div>
    <div class="svc-row" onclick="go('about.html')">
      <span class="svc-name">关于我们</span>
      <span class="svc-note">品牌故事与咖啡旅程</span>
      <span class="svc-arrow">›</span>
    </div>
  </div>

  <!-- 品牌收尾 -->
  <div class="profile-footer">
    <span class="footer-kicker">CRAFTED WITH CARE · SINCE 2026</span>
    <span class="footer-brand">COZY COFFEE</span>
    <span class="footer-tag">Roasted in Hangzhou · Origin · Craft · Warmth</span>
    <a class="footer-about" onclick="go('about.html')">关于我们 · 帮助与反馈</a>
  </div>
</div>

<!-- 底部 TabBar -->
<nav class="tabbar">
  <div class="tabbar-item" onclick="go('index.html')">
    <span class="tabbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5L12 3l8.5 7.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5"/><path d="M10 21v-6h4v6"/></svg></span><span>首页</span>
  </div>
  <div class="tabbar-item" onclick="go('menu.html')">
    <span class="tabbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></span><span>菜单</span>
  </div>
  <div class="tabbar-item" onclick="go('order.html')">
    <span class="tabbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/></svg></span><span>订单</span>
  </div>
  <div class="tabbar-item active" onclick="go('profile.html')">
    <span class="tabbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="3.8"/><path d="M4.5 20.5c.8-3.7 4-5.7 7.5-5.7s6.7 2 7.5 5.7"/></svg></span><span>我的</span>
  </div>
</nav>

<script>
  // 等级主题映射 —— 与 constants/member.js MEMBER_LEVEL_THEMES 保持一致
  const THEMES = {
    basic:   { name:'基础会员', en:'BASIC',   surface:'#F7F5F3', text:'#2B1E16', accent:'#8D6E63', isDark:false, exp:100,   points:'50',    exchange:0, coupons:0 },
    silver:  { name:'白银会员', en:'SILVER',  surface:'linear-gradient(135deg,#F1EEE9 0%,#D1CCC6 48%,#A8A39C 100%)', text:'#2C2824', accent:'#857F78', isDark:false, exp:800,   points:'1,200', exchange:1, coupons:2 },
    gold:    { name:'黄金会员', en:'GOLD',    surface:'linear-gradient(135deg,#F9E7B0 0%,#E8C078 50%,#B58224 100%)', text:'#3A2412', accent:'#8A5B12', isDark:false, exp:2000,  points:'3,600', exchange:2, coupons:3 },
    diamond: { name:'钻石会员', en:'DIAMOND', surface:'linear-gradient(135deg,#7C9DB9,#4A6FA5)', text:'#FFFFFF', accent:'#D5E3EE', isDark:false, exp:4500,  points:'8,888', exchange:3, coupons:5 },
    black:   { name:'黑金会员', en:'BLACK',   surface:'#171411', text:'#E6C97A', accent:'#C9A227', isDark:true,  exp:9500,  points:'18,888', exchange:5, coupons:8 }
  };
  const THRESHOLDS = { basic:0, silver:500, gold:1500, diamond:4000, black:9000 };
  const ORDER = ['basic','silver','gold','diamond','black'];

  // 等级徽章 —— 与 LevelBadge.vue 对应（咖啡豆/勋章/星/钻石/王冠）
  const EMBLEMS = {
    basic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><ellipse cx="12" cy="12" rx="6.4" ry="8.6" transform="rotate(32 12 12)"/><path d="M12 4.6c2.6 2.4 2.6 12.4 0 14.8"/></svg>',
    silver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.2"/></svg>',
    gold: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4l2.3 5.4 5.9.5-4.5 3.9 1.4 5.7L12 14.8l-5.1 3.1 1.4-5.7-4.5-3.9 5.9-.5z"/></svg>',
    diamond: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2L20.4 7 12 21.8 3.6 7z"/></svg>',
    black: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 17l2.1-8.4 3 3.2 4.3-9.4 4.3 9.4 3-3.2L21.4 17z"/></svg>'
  };

  // 入口图标 —— 细线、更轻（stroke 1.6）
  const ICONS = {
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 13H6.2z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></svg>',
    swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M14 4l4 4-4 4"/><path d="M20 16H7M10 12l-4 4 4 4"/></svg>',
    coupon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v4a2.2 2.2 0 0 0 0 4.4V19H4v-3.6a2.2 2.2 0 0 0 0-4.4z"/><circle cx="9" cy="12" r=".8" fill="currentColor" stroke="none"/></svg>',
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12" rx="1.5"/><path d="M3.5 13h17"/><path d="M12 8v12"/><path d="M12 8c-3.5 0-6-1.8-6-3.5S8.5 2.5 10 4c1 1 1 4 2 4z"/><path d="M12 8c3.5 0 6-1.8 6-3.5S15.5 2.5 14 4c-1 1-1 4-2 4z"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 18.5V8.5l1.3-1.5L9.2 11 12 5l2.8 6 3.4-4L19.5 8.5V18.5z"/><path d="M6.5 13.5h11"/></svg>'
  };

  let currentLevel = 'silver';

  function applyTheme(level) {
    const t = THEMES[level];
    const card = document.getElementById('memberCard');
    card.style.background = t.surface;
    card.style.color = t.text;
    card.style.setProperty('--accent', t.accent);
    card.style.setProperty('--line', t.isDark ? 'rgba(255,255,255,.18)' : 'rgba(60,40,30,.14)');
    card.style.setProperty('--track', t.isDark ? 'rgba(255,255,255,.18)' : 'rgba(60,40,30,.10)');
    card.classList.toggle('is-dark', t.isDark);

    document.getElementById('levelEmblem').innerHTML = EMBLEMS[level];
    document.getElementById('levelName').textContent = t.name;
    document.getElementById('ledPoints').textContent = t.points;

    // 等级进度
    const idx = ORDER.indexOf(level);
    const isMax = idx >= ORDER.length - 1;
    let pct = 100, label = '已达到最高等级', exp = t.name;
    if (!isMax) {
      const cur = THRESHOLDS[level], next = THRESHOLDS[ORDER[idx + 1]];
      pct = Math.max(0, Math.min(100, Math.round(((t.exp - cur) / (next - cur)) * 100)));
      label = '距离' + THEMES[ORDER[idx + 1]].name;
      exp = Math.max(0, next - t.exp).toLocaleString() + ' EXP';
    }
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('growthLabel').textContent = label;
    document.getElementById('growthExp').textContent = exp;

    // 预览 chips
    document.querySelectorAll('.preview-chip').forEach(chip => {
      chip.classList.toggle('active', chip.dataset.level === level);
    });
  }

  function renderChips() {
    const box = document.getElementById('previewChips');
    box.innerHTML = ORDER.map(level => {
      const t = THEMES[level];
      return `
        <div class="preview-chip ${level === currentLevel ? 'active' : ''}" data-level="${level}" onclick="switchLevel('${level}')">
          <span class="chip-emblem">${EMBLEMS[level]}</span>
          <span>${t.name.slice(0, 2)}</span>
        </div>`;
    }).join('');
  }

  function switchLevel(level) { currentLevel = level; applyTheme(level); }

  function mountIcons() {
    const map = { icOrder:'bag', icRedeem:'swap', icMall:'gift', icCoupon:'coupon', icSignin:'calendar', icBenefits:'shield' };
    Object.keys(map).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = ICONS[map[id]];
    });
  }

  function go(href) { location.href = href; }
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }

  mountIcons();
  renderChips();
  applyTheme('silver');
</script>
</body>
</html>
