<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>关于 Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --ink:#2C2723; --muted:#8B8178; --primary:#753A22; --accent:#526C43;
    --surface:#F7F3EE; --card:#FFFFFF; --border:#E3DED8;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }


  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:14px;
    font-size:26px; line-height:1;
    color:var(--ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 20px 160px; }

  /* ── 通用 ── */
  .section { padding:48px 24px; }
  .eyebrow {
    display:block; font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--muted);
  }
  .eyebrow--center { text-align:center; }
  .section-title {
    display:block; margin-top:10px;
    font-family:var(--serif); font-size:26px; font-weight:600; color:var(--ink);
  }
  .section-lead {
    display:block; margin-top:10px;
    font-size:14px; line-height:1.7; color:var(--muted);
  }
  .section-head { margin-bottom:32px; }
  .section-head--center { text-align:center; }
  .section-divider {
    width:48px; height:1px; margin-top:18px;
    background:var(--primary); opacity:.3;
  }

  /* ── 为什么开始 ── */
  .story { background:var(--card); }
  .story-lead {
    display:block; margin-top:18px;
    font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
  }
  .story-body {
    display:block; margin-top:12px;
    font-size:14px; line-height:1.8; color:var(--muted);
  }
  .story-media {
    margin-top:24px; overflow:hidden; border-radius:12px;
    background:linear-gradient(135deg,#E8DDD2,#D8C8B4);
  }
  .story-media img { width:100%; height:auto; object-fit:cover; }

  /* ── 从土地到杯中 ── */
  .journey { background:var(--surface); }
  .journey-step {
    display:flex; gap:16px; padding:20px 0;
    border-bottom:1px solid var(--border);
  }
  .journey-step:last-child { border-bottom:0; }
  .journey-num {
    flex:none; width:34px;
    font-size:13px; font-weight:700; color:var(--primary); letter-spacing:.08em;
  }
  .journey-body { min-width:0; flex:1; }
  .journey-name {
    display:block; font-family:var(--serif); font-size:17px; font-weight:600; color:var(--ink);
  }
  .journey-en {
    display:block; margin-top:2px;
    font-size:10px; letter-spacing:.14em; color:var(--muted);
  }
  .journey-desc {
    display:block; margin-top:6px;
    font-size:13px; line-height:1.7; color:var(--muted);
  }

  /* ── 我们坚持的事情 ── */
  .values { background:var(--card); }
  .value-item {
    padding:24px 0; text-align:left;
    border-bottom:1px solid var(--border);
  }
  .value-item:last-child { border-bottom:0; }
  .value-num {
    display:block; font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.1em;
  }
  .value-en {
    display:block; margin-top:8px;
    font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--ink);
  }
  .value-zh {
    display:block; margin-top:4px;
    font-family:var(--serif); font-size:15px; color:var(--muted);
  }
  .value-desc {
    display:block; margin-top:10px;
    font-size:13px; line-height:1.7; color:var(--muted);
  }

  /* ── 咖啡幕后 ── */
  .behind { background:var(--surface); }
  .behind-list {
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .behind-cell { overflow:hidden; border-radius:10px; background:var(--card); }
  .behind-image {
    width:100%; aspect-ratio:3/4; object-fit:cover;
    display:block;
  }
  .behind-caption {
    display:block; padding:10px 12px 12px;
    font-size:11px; color:var(--muted);
  }

  /* ── 品牌宣言 ── */
  .manifesto {
    padding:64px 24px;
    background:var(--card);
    text-align:center;
  }
  .manifesto .eyebrow { color:var(--muted); }
  .manifesto-title {
    display:block; margin-top:20px;
    font-family:var(--serif); font-size:26px; font-weight:500;
    line-height:1.7; color:var(--ink);
  }
  .manifesto-sign {
    display:block; margin-top:24px;
    font-size:12px; letter-spacing:.22em; color:var(--muted);
  }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

  <div class="page">

    <a class="back-btn" href="index.html">‹</a>

    <!-- 为什么开始 -->
    <div class="section story">
      <span class="eyebrow">OUR BEGINNING</span>
      <span class="section-title">我们为什么开始</span>
      <span class="story-lead">咖啡不只是提神的饮品。</span>
      <span class="story-body">它来自遥远的土地，经过种植、处理、烘焙，最终成为人与人之间的一段时间。</span>
      <span class="story-body">Cozy Coffee 希望记录这些关于产地、风味和人的故事。</span>
      <div class="story-media">
        <img src="assets/about-store.jpg" alt="门店环境">
      </div>
    </div>

    <!-- 从土地，到杯中 -->
    <div class="section journey">
      <div class="section-head">
        <span class="eyebrow">FROM ORIGIN TO CUP</span>
        <span class="section-title">从土地，到杯中</span>
        <span class="section-lead">一颗咖啡豆，要走过很远的路，才能成为你面前这一杯。</span>
      </div>
      <div id="journeyRail"></div>
    </div>

    <!-- 我们坚持的事情 -->
    <div class="section values">
      <div class="section-head">
        <span class="eyebrow">WHAT WE BELIEVE</span>
        <span class="section-title">我们坚持的事情</span>
        <span class="section-lead">不强调规模，只回应每一杯。</span>
        <div class="section-divider"></div>
      </div>
      <div id="valuesList"></div>
    </div>

    <!-- 咖啡幕后 -->
    <div class="section behind">
      <div class="section-head">
        <span class="eyebrow">BEHIND THE COFFEE</span>
        <span class="section-title">咖啡师与烘焙幕后</span>
        <span class="section-lead">每一次烘焙，都是对风味的一次重新理解。</span>
      </div>
      <div class="behind-list" id="behindGrid"></div>
    </div>

    <!-- 品牌宣言 -->
    <div class="manifesto">
      <span class="eyebrow">A QUIET PROMISE</span>
      <span class="manifesto-title">一杯咖啡<br>始于土地<br>终于与你相遇</span>
      <span class="manifesto-sign">Cozy Coffee</span>
    </div>
  </div>

<script>
  const journeySteps = [
    { num:'01', zh:'产地探索', en:'Origin', desc:'走遍世界八大产区，理解每一片土地的风味语言。' },
    { num:'02', zh:'精选咖啡豆', en:'Selection', desc:'从处理法到批次，只留下值得被记录的那一颗。' },
    { num:'03', zh:'杭州烘焙', en:'Roasting', desc:'小批量、慢火候，寻找每一支豆子最合适的表达。' },
    { num:'04', zh:'门店萃取', en:'Extraction', desc:'从研磨到注水，把风味完整地交到你的杯里。' },
    { num:'05', zh:'你的这一杯', en:'Your Cup', desc:'一杯咖啡，连接土地与你的距离。' }
  ];
  const values = [
    { num:'01', en:'Origin', zh:'尊重每一片土地', desc:'从云南到埃塞俄比亚，记录产地、海拔与处理法，让风味被看清，而不是被盖住。' },
    { num:'02', en:'Roasting', zh:'寻找最适合的表达', desc:'不是越深越好。每一次烘焙，都是对风味轮廓的一次重新理解。' },
    { num:'03', en:'Experience', zh:'让咖啡成为日常的一部分', desc:'门店不只是取餐点。我们希望它是一个你愿意慢下来、坐一会儿的地方。' }
  ];
  const behindCells = [
    { image:'assets/about-beans.jpg', caption:'豆子 · 从生到熟的两次旅途' },
    { image:'assets/about-cupping.jpg', caption:'杯测 · 听风味的语言' },
    { image:'assets/about-roastery.jpg', caption:'烘焙 · 看见风味在变化' },
    { image:'assets/about-pour-over.jpg', caption:'手冲 · 把水流写进风味' }
  ];

  document.getElementById('journeyRail').innerHTML = journeySteps.map(s => `
    <div class="journey-step">
      <span class="journey-num">${s.num}</span>
      <div class="journey-body">
        <span class="journey-name">${s.zh}</span>
        <span class="journey-en">${s.en}</span>
        <span class="journey-desc">${s.desc}</span>
      </div>
    </div>`).join('');

  document.getElementById('valuesList').innerHTML = values.map(v => `
    <div class="value-item">
      <span class="value-num">${v.num}</span>
      <span class="value-en">${v.en}</span>
      <span class="value-zh">${v.zh}</span>
      <span class="value-desc">${v.desc}</span>
    </div>`).join('');

  document.getElementById('behindGrid').innerHTML = behindCells.map(c => `
    <div class="behind-cell">
      <img class="behind-image" src="${c.image}" alt="${c.caption}">
      <span class="behind-caption">${c.caption}</span>
    </div>`).join('');

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
