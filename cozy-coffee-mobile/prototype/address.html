<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>收货地址 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --glaze-green:#526C43; --glaze-green-soft:#E8EDE5;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22; --accent:#526C43;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:14px;
    font-size:26px; line-height:1;
    color:var(--ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 20px 110px; }

  /* ── 地址列表 ── */
  .address-list {
    display:flex; flex-direction:column; gap:12px;
  }
  .address-card {
    border-radius:14px; background:var(--card);
    border:1px solid var(--hairline);
    padding:16px 18px 14px;
  }
  .address-card.default { border-color:#E3CDB6; }

  .addr-main {
    display:flex; align-items:flex-start; gap:12px;
  }
  .addr-pin {
    flex:none; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    color:var(--roast-brown); margin-top:1px;
  }
  .addr-pin svg { width:22px; height:22px; }
  .addr-copy { flex:1; min-width:0; }
  .addr-region {
    display:block;
    font-size:15px; font-weight:600; color:var(--ink);
    line-height:1.4;
  }
  .addr-detail {
    display:block; margin-top:4px;
    font-size:12px; color:var(--quiet-ink);
    line-height:1.5;
  }
  .default-badge {
    flex:none;
    margin-left:8px; padding:3px 9px; border-radius:6px;
    background:var(--glaze-green-soft); color:var(--glaze-green);
    font-size:10px; font-weight:700; letter-spacing:.04em;
  }

  .addr-receiver {
    display:flex; align-items:center; gap:10px;
    margin-top:12px; padding-top:12px;
    border-top:1px solid var(--border);
  }
  .receiver-name {
    font-size:13px; font-weight:600; color:var(--roastery-ink);
  }
  .receiver-honorific {
    font-size:12px; color:var(--quiet-ink);
  }
  .receiver-phone {
    font-size:12px; color:var(--quiet-ink);
  }

  /* 操作：icon 按钮（无色块） */
  .addr-actions {
    display:flex; align-items:center; gap:6px;
    margin-top:12px; padding-top:10px;
    border-top:1px solid var(--border);
    justify-content:flex-end;
  }
  .act {
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    color:var(--quiet-ink); cursor:pointer;
    transition:color .2s;
  }
  .act svg { width:19px; height:19px; }
  .act:active { opacity:.5; }
  .act.default.on { color:var(--roast-brown); }

  /* ── 空状态 ── */
  .empty-state {
    display:flex; flex-direction:column; align-items:center;
    padding:80px 0 56px;
  }
  .empty-mark {
    width:64px; height:64px; border-radius:50%;
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--primary);
  }
  .empty-mark svg { width:28px; height:28px; }
  .empty-text { margin-top:16px; font-size:14px; font-weight:600; color:var(--ink); }
  .empty-hint { margin-top:8px; font-size:12px; color:var(--muted); }

  /* ── 新增地址入口（icon 行，非色块）── */
  .add-entry {
    display:flex; align-items:center; gap:10px;
    margin-top:18px;
    padding:16px 18px;
    border-radius:14px; background:var(--card);
    border:1px solid var(--hairline);
    cursor:pointer;
  }
  .add-entry:active { opacity:.75; }
  .add-plus {
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    color:var(--roast-brown);
  }
  .add-plus svg { width:20px; height:20px; }
  .add-text {
    flex:1; font-size:14px; font-weight:600; color:var(--ink);
  }
  .add-arrow { font-size:18px; color:var(--placeholder); line-height:1; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <a class="back-btn" onclick="goBack('profile.html')">‹</a>

  <div class="address-list" id="addressList"></div>

  <div class="add-entry" onclick="go('address-edit.html')">
    <span class="add-plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <span class="add-text">新增收货地址</span>
    <span class="add-arrow">›</span>
  </div>

</div>

<script>
  const ICONS = {
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.2-6-11a6 6 0 0 1 12 0c0 5.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l2.3 5.4 5.9.5-4.5 3.9 1.4 5.7L12 14.8l-5.1 3.1 1.4-5.7-4.5-3.9 5.9-.5z"/></svg>',
    starFilled: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l2.3 5.4 5.9.5-4.5 3.9 1.4 5.7L12 14.8l-5.1 3.1 1.4-5.7-4.5-3.9 5.9-.5z"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 6l4 4"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M18 7l-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/><path d="M10 11v6M14 11v6"/></svg>'
  };

  const DEFAULT_ADDRESSES = [
    { id:1, name:'张苏宁', phone:'13811110421', gender:'MALE', region:'浙江省 杭州市 西湖区', detail:'文三路 128 号 CozyCoffee 大厦', isDefault:true },
    { id:2, name:'李雨', phone:'13655559872', gender:'FEMALE', region:'浙江省 杭州市 滨江区', detail:'江南大道 588 号 3 幢 1 单元', isDefault:false }
  ];

  function getAddresses() { try { return JSON.parse(localStorage.getItem('cozy_addresses')) || []; } catch (e) { return []; } }
  function persist(list) { localStorage.setItem('cozy_addresses', JSON.stringify(list)); }

  function maskName(n) { return n.length > 1 ? n[0] + '*' + n.slice(-1) : n; }
  function maskPhone(p) { return String(p).replace(/(\d{3})\d{4}(\d{4})/, '$1****$2'); }

  function render() {
    let list = getAddresses();
    if (!list.length) { persist(DEFAULT_ADDRESSES.slice()); list = DEFAULT_ADDRESSES; }
    const box = document.getElementById('addressList');

    if (!list.length) {
      box.innerHTML = `
        <div class="empty-state">
          <span class="empty-mark">${ICONS.pin}</span>
          <span class="empty-text">暂无收货地址</span>
          <span class="empty-hint">添加地址后，兑换实物礼品可配送上门</span>
        </div>`;
      return;
    }

    box.innerHTML = list.map(a => {
      const honorific = String(a.gender || '').toUpperCase() === 'FEMALE' ? '女士' : '先生';
      return `
      <div class="address-card ${a.isDefault ? 'default' : ''}">
        <div class="addr-main">
          <span class="addr-pin">${ICONS.pin}</span>
          <div class="addr-copy">
            <span class="addr-region">${a.region}</span>
            <span class="addr-detail">${a.detail}</span>
          </div>
          ${a.isDefault ? '<span class="default-badge">默认</span>' : ''}
        </div>
        <div class="addr-receiver">
          <span class="receiver-name">${maskName(a.name)}</span>
          <span class="receiver-honorific">${honorific}</span>
          <span class="receiver-phone">${maskPhone(a.phone)}</span>
        </div>
        <div class="addr-actions">
          <div class="act default ${a.isDefault ? 'on' : ''}" onclick="setDefault(${a.id})" title="${a.isDefault ? '已是默认' : '设为默认'}">${a.isDefault ? ICONS.starFilled : ICONS.star}</div>
          <div class="act" onclick="go('address-edit.html?id=' + ${a.id})" title="编辑">${ICONS.pencil}</div>
          <div class="act" onclick="removeAddress(${a.id})" title="删除">${ICONS.trash}</div>
        </div>
      </div>`;
    }).join('');
  }

  function setDefault(id) {
    const list = getAddresses();
    list.forEach(a => a.isDefault = (a.id === id));
    persist(list);
    render();
    toast('已设为默认');
  }

  function removeAddress(id) {
    if (confirm('确定删除这个地址吗？')) {
      const list = getAddresses().filter(a => a.id !== id);
      persist(list);
      render();
      toast('已删除');
    }
  }

  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }
  function go(href) { location.href = href; }
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }

  render();
</script>
</body>
</html>
