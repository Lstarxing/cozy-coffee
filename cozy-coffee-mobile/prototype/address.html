<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>收货地址 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --glaze-green:#526C43; --glaze-green-soft:#E8EDE5;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22; --accent:#526C43;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:14px;
    font-size:26px; line-height:1;
    color:var(--ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 20px 110px; }

  .page-head { padding:8px 8px 18px; }
  .page-kicker {
    display:block;
    font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--muted);
  }
  .page-title {
    display:block; margin-top:8px;
    font-family:var(--serif); font-size:24px; font-weight:600; color:var(--ink);
  }

  /* ── 地址列表 ── */
  .address-list {
    display:flex; flex-direction:column; gap:12px;
  }
  .address-card {
    border-radius:14px; background:var(--card);
    border:1px solid var(--hairline);
    padding:16px 18px;
  }
  .address-card.default { border-color:#E3CDB6; }
  .address-head {
    display:flex; align-items:center; gap:10px;
  }
  .address-name {
    font-size:15px; font-weight:650; color:var(--ink);
  }
  .address-phone {
    font-size:12px; color:var(--muted);
  }
  .default-badge {
    margin-left:auto;
    padding:3px 9px; border-radius:6px;
    background:var(--glaze-green-soft); color:var(--glaze-green);
    font-size:10px; font-weight:700; letter-spacing:.04em;
  }
  .address-region {
    display:block; margin-top:10px;
    font-size:13px; line-height:1.6; color:var(--roastery-ink);
  }
  .address-actions {
    display:flex; align-items:center; gap:8px;
    margin-top:14px; padding-top:12px;
    border-top:1px solid var(--border);
  }
  .addr-action {
    padding:6px 12px; border-radius:6px;
    font-size:12px; font-weight:600; cursor:pointer;
    border:1px solid var(--hairline); background:var(--card); color:var(--ink);
  }
  .addr-action:active { background:var(--surface); }
  .addr-action.primary {
    border-color:var(--roast-brown); background:var(--roast-brown); color:#fff;
  }
  .addr-action.primary:active { background:var(--roast-brown-deep); }

  /* ── 空状态 ── */
  .empty-state {
    display:flex; flex-direction:column; align-items:center;
    padding:80px 0 56px;
  }
  .empty-mark {
    width:64px; height:64px; border-radius:50%;
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:16px; font-weight:700; letter-spacing:.08em;
    color:var(--primary);
  }
  .empty-text { margin-top:16px; font-size:14px; font-weight:600; color:var(--ink); }
  .empty-hint { margin-top:8px; font-size:12px; color:var(--muted); }

  /* ── 新增按钮 ── */
  .add-btn {
    margin-top:22px;
    height:48px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    border-radius:10px;
    background:var(--roast-brown); color:#fff;
    font-size:15px; font-weight:600; cursor:pointer;
    transition:background .25s;
  }
  .add-btn:active { background:var(--roast-brown-deep); }
  .add-btn .plus { font-size:18px; font-weight:400; }

  /* ── 编辑弹层 ── */
  .modal-mask {
    position:fixed; inset:0; z-index:60;
    background:rgba(44,39,35,.4);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s;
  }
  .modal-mask.open { opacity:1; pointer-events:auto; }
  .modal-card {
    width:86%; max-width:320px;
    border-radius:14px; background:var(--card);
    padding:24px 22px 20px;
  }
  .modal-title {
    display:block;
    font-family:var(--serif); font-size:18px; font-weight:600; color:var(--ink);
    margin-bottom:16px;
  }
  .field { margin-bottom:12px; }
  .field-label {
    display:block; margin-bottom:6px;
    font-size:11px; color:var(--muted);
  }
  .field-input {
    width:100%; height:42px;
    padding:0 12px;
    border:1px solid var(--border); border-radius:6px;
    font-size:14px; color:var(--ink);
    font-family:inherit;
    background:var(--porcelain);
  }
  .field-input:focus { outline:none; border-color:var(--roast-brown); }
  .field-default {
    display:flex; align-items:center; gap:8px;
    margin-top:4px; cursor:pointer;
    font-size:13px; color:var(--ink);
  }
  .field-check {
    width:18px; height:18px; border-radius:4px;
    border:1px solid var(--hairline); background:var(--porcelain);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff;
  }
  .field-check.on { background:var(--roast-brown); border-color:var(--roast-brown); }
  .modal-actions {
    display:flex; gap:10px; margin-top:20px;
  }
  .modal-btn {
    flex:1; height:44px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .modal-btn.ghost { background:var(--surface); color:var(--ink); }
  .modal-btn.solid { background:var(--roast-brown); color:#fff; }
  .modal-btn:active { opacity:.85; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <a class="back-btn" onclick="goBack('profile.html')">‹</a>

  <div class="page-head">
    <span class="page-kicker">ADDRESSES</span>
    <span class="page-title">收货地址</span>
  </div>

  <div class="address-list" id="addressList"></div>

  <div class="add-btn" onclick="openModal()">
    <span class="plus">+</span><span>新增收货地址</span>
  </div>

</div>

<!-- 编辑弹层 -->
<div class="modal-mask" id="addrMask">
  <div class="modal-card">
    <span class="modal-title" id="addrModalTitle">新增收货地址</span>
    <div class="field">
      <span class="field-label">收货人</span>
      <input class="field-input" id="fName" placeholder="请输入姓名">
    </div>
    <div class="field">
      <span class="field-label">手机号</span>
      <input class="field-input" id="fPhone" placeholder="请输入手机号">
    </div>
    <div class="field">
      <span class="field-label">地区</span>
      <input class="field-input" id="fRegion" placeholder="省 / 市 / 区">
    </div>
    <div class="field">
      <span class="field-label">详细地址</span>
      <input class="field-input" id="fDetail" placeholder="街道、门牌号等">
    </div>
    <div class="field-default" onclick="toggleDefault()">
      <span class="field-check" id="fDefault"></span>
      <span>设为默认收货地址</span>
    </div>
    <div class="modal-actions">
      <div class="modal-btn ghost" onclick="closeModal()">取消</div>
      <div class="modal-btn solid" onclick="saveAddress()">保存</div>
    </div>
  </div>
</div>

<script>
  // 地址字段对齐 AddressDTO：receiverName / receiverPhone / province+city+district / detailAddress / isDefault
  let addresses = [
    { id:1, name:'张*宁', phone:'138****0421', region:'浙江省 杭州市 西湖区', detail:'文三路 128 号 CozyCoffee 大厦', isDefault:true },
    { id:2, name:'李*',   phone:'136****9872', region:'浙江省 杭州市 滨江区', detail:'江南大道 588 号 3 幢 1 单元', isDefault:false }
  ];

  function render() {
    const list = document.getElementById('addressList');
    if (!addresses.length) {
      list.innerHTML = `
        <div class="empty-state">
          <span class="empty-mark">址</span>
          <span class="empty-text">暂无收货地址</span>
          <span class="empty-hint">添加地址后，兑换实物礼品可配送上门</span>
        </div>`;
      return;
    }
    list.innerHTML = addresses.map(a => `
      <div class="address-card ${a.isDefault ? 'default' : ''}">
        <div class="address-head">
          <span class="address-name">${a.name}</span>
          <span class="address-phone">${a.phone}</span>
          ${a.isDefault ? '<span class="default-badge">默认</span>' : ''}
        </div>
        <span class="address-region">${a.region} ${a.detail}</span>
        <div class="address-actions">
          ${a.isDefault ? '' : `<div class="addr-action primary" onclick="setDefault(${a.id})">设为默认</div>`}
          <div class="addr-action" onclick="openModal(${a.id})">编辑</div>
          <div class="addr-action" onclick="removeAddress(${a.id})">删除</div>
        </div>
      </div>
    `).join('');
  }

  let editingId = null;

  function openModal(id) {
    editingId = id || null;
    document.getElementById('addrModalTitle').textContent = id ? '编辑收货地址' : '新增收货地址';
    if (id) {
      const a = addresses.find(x => x.id === id);
      document.getElementById('fName').value = a.name.replace('*', '');
      document.getElementById('fPhone').value = a.phone.replace(/[*]/g, '');
      document.getElementById('fRegion').value = a.region;
      document.getElementById('fDetail').value = a.detail;
      syncDefaultCheck(a.isDefault);
    } else {
      document.getElementById('fName').value = '';
      document.getElementById('fPhone').value = '';
      document.getElementById('fRegion').value = '';
      document.getElementById('fDetail').value = '';
      syncDefaultCheck(false);
    }
    document.getElementById('addrMask').classList.add('open');
  }
  function closeModal() {
    editingId = null;
    document.getElementById('addrMask').classList.remove('open');
  }

  let wantDefault = false;
  function syncDefaultCheck(v) { wantDefault = v; const el = document.getElementById('fDefault'); el.classList.toggle('on', v); el.textContent = v ? '✓' : ''; }
  function toggleDefault() { syncDefaultCheck(!wantDefault); }

  function saveAddress() {
    const name = document.getElementById('fName').value.trim();
    const phone = document.getElementById('fPhone').value.trim();
    const region = document.getElementById('fRegion').value.trim();
    const detail = document.getElementById('fDetail').value.trim();
    if (!name || !phone || !region || !detail) { toast('请填写完整信息'); return; }

    if (editingId) {
      const a = addresses.find(x => x.id === editingId);
      a.name = name.slice(0,1) + '*' + (name.length > 2 ? name.slice(2) : '');
      a.phone = phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
      a.region = region;
      a.detail = detail;
      if (wantDefault) makeDefault(a.id);
    } else {
      const id = addresses.length ? Math.max(...addresses.map(a => a.id)) + 1 : 1;
      const na = { id, name: name.slice(0,1) + '*' + (name.length > 2 ? name.slice(2) : ''), phone: phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2'), region, detail, isDefault: wantDefault };
      if (wantDefault) addresses.forEach(a => a.isDefault = false);
      addresses.push(na);
    }
    closeModal();
    render();
    toast('保存成功');
  }

  function makeDefault(id) {
    addresses.forEach(a => a.isDefault = (a.id === id));
  }
  function setDefault(id) {
    makeDefault(id);
    render();
    toast('已设为默认');
  }
  function removeAddress(id) {
    if (confirm('确定删除这个地址吗？')) {
      addresses = addresses.filter(a => a.id !== id);
      render();
      toast('已删除');
    }
  }

  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }
  function go(href) { location.href = href; }
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }

  render();
</script>
</body>
</html>
