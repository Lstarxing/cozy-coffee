<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>会员权益 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --ink:#2C2723; --muted:#8B8178; --primary:#753A22; --accent:#526C43;
    --surface:#F7F3EE; --card:#FFFFFF; --border:#E3DED8;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:14px;
    font-size:26px; line-height:1;
    color:var(--ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 20px 120px; }

  /* ── 等级 tabs ── */
  .level-tabs {
    display:flex; gap:8px;
    overflow-x:auto; white-space:nowrap;
    padding:4px 2px 14px;
    border-bottom:1px solid var(--border);
  }
  .level-tab {
    flex:none; padding:8px 16px;
    border-radius:999px;
    background:var(--card); border:1px solid var(--border);
    font-size:13px; color:var(--muted);
    cursor:pointer; transition:all .25s;
  }
  .level-tab.active { color:#fff; font-weight:600; }
  .level-tab.active.basic { background:#8D6E63; border-color:#8D6E63; }
  .level-tab.active.silver { background:#90A4AE; border-color:#90A4AE; }
  .level-tab.active.gold { background:#FF8F00; border-color:#FF8F00; }
  .level-tab.active.diamond { background:#1565C0; border-color:#1565C0; }
  .level-tab.active.black { background:#171411; border-color:#171411; color:#E6C97A; }

  /* ── feature 卡 ── */
  .feature-card {
    margin-top:18px;
    padding:26px 22px 28px;
    border-radius:16px;
    background:var(--card);
    box-shadow:0 8px 24px rgba(0,0,0,.06);
    transition:background .3s;
  }
  .feature-card.is-black { background:#0C0C0C; }

  /* 3D 卡面 */
  .card-visual { display:flex; justify-content:center; padding:6px 0 26px; }
  .physical-card {
    position:relative;
    width:296px; height:180px;
    border-radius:14px;
    transform:perspective(700px) rotateY(-14deg) rotateX(6deg);
    box-shadow:-14px 16px 30px rgba(0,0,0,.28), inset 0 0 24px rgba(0,0,0,.2);
  }
  .card-face {
    position:absolute; inset:0;
    padding:16px;
    display:flex; flex-direction:column; justify-content:space-between;
    border-radius:inherit;
    background-image:linear-gradient(45deg, rgba(255,255,255,.06) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.06) 50%, rgba(255,255,255,.06) 75%, transparent 75%, transparent);
    background-size:22px 22px;
  }
  .card-brand { display:flex; }
  .card-brand svg { width:26px; height:26px; }
  .card-logo {
    align-self:flex-end;
    font-family:var(--serif); font-weight:900; letter-spacing:2px;
    font-size:15px; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .card-number {
    font-family:'Courier New',monospace; letter-spacing:3px;
    font-size:17px; color:#fff; opacity:.92;
    text-shadow:0 1px 3px #000;
  }
  .card-member { font-size:9px; letter-spacing:1.5px; color:rgba(255,255,255,.55); }

  .physical-card.basic { background:linear-gradient(135deg,#A1887F,#8D6E63); }
  .physical-card.basic .card-logo, .physical-card.basic .card-number { color:#3E2723; text-shadow:0 1px 0 rgba(255,255,255,.2); }
  .physical-card.basic .card-member { color:rgba(62,39,35,.6); }

  .physical-card.silver { background:linear-gradient(135deg,#E0E0E0,#BDBDBD 45%,#FFFFFF 55%,#9E9E9E); }
  .physical-card.silver .card-logo, .physical-card.silver .card-number { color:#424242; text-shadow:0 1px 1px rgba(255,255,255,.8); }
  .physical-card.silver .card-member { color:#616161; }

  .physical-card.gold { background:linear-gradient(135deg,#FFECB3,#FFC107 45%,#FF8F00); box-shadow:inset 0 0 24px rgba(255,215,0,.3); }
  .physical-card.gold .card-logo, .physical-card.gold .card-number { color:#795548; text-shadow:0 1px 1px rgba(255,255,255,.5); }
  .physical-card.gold .card-member { color:#8D6E63; }

  .physical-card.diamond { background:linear-gradient(135deg,#01579B,#0288D1 50%,#29B6F6); border:1px solid rgba(255,255,255,.5); }
  .physical-card.diamond .card-logo, .physical-card.diamond .card-number { color:#E1F5FE; text-shadow:0 0 10px rgba(255,255,255,.5); }
  .physical-card.diamond .card-member { color:#81D4FA; }

  .physical-card.black { background:linear-gradient(135deg,#1a1a1a,#000); border:1px solid rgba(255,215,0,.3); }
  .physical-card.black .card-logo, .physical-card.black .card-number { color:#FFD700; }
  .physical-card.black .card-member { color:rgba(255,215,0,.5); }

  /* 权益列表 */
  .benefit-list { padding:0 4px; }
  .benefit-row {
    display:flex; align-items:center; gap:12px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
  }
  .benefit-row:last-child { border-bottom:0; }
  .b-icon {
    flex:none; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:8px;
    background:var(--surface); color:var(--primary);
    font-size:11px; font-weight:800; letter-spacing:.04em;
  }
  .b-copy { flex:1; min-width:0; }
  .b-name { display:block; font-size:14px; font-weight:600; color:var(--ink); }
  .b-desc { display:block; margin-top:3px; font-size:11px; color:var(--muted); }

  .feature-card.is-black .b-icon { background:rgba(255,215,0,.14); color:#FFD700; }
  .feature-card.is-black .b-name { color:#F7E7CE; }
  .feature-card.is-black .b-desc { color:rgba(247,231,206,.55); }
  .feature-card.is-black .benefit-row { border-bottom:1px solid rgba(255,255,255,.08); }

  /* 领取按钮 */
  .benefit-action { margin-top:6px; }
  .receive-btn {
    height:46px;
    display:flex; align-items:center; justify-content:center;
    border-radius:9px;
    font-size:14px; font-weight:600;
    color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#A1887F,#8D6E63);
    box-shadow:0 4px 14px rgba(141,110,99,.3);
  }
  .receive-btn.silver { background:linear-gradient(135deg,#CFD8DC,#90A4AE); }
  .receive-btn.gold { background:linear-gradient(135deg,#FFD54F,#FF8F00); }
  .receive-btn.diamond { background:linear-gradient(135deg,#64B5F6,#1565C0); }
  .receive-btn.black { background:linear-gradient(135deg,#424242,#212121); color:#FFD700; }
  .upgrade-tip {
    display:block; margin-top:10px;
    font-size:11px; line-height:1.6;
    color:var(--accent); text-align:center;
  }

  /* ── 会员进度 footer ── */
  .member-progress-footer {
    margin-top:18px;
    padding:22px 20px;
    border-radius:16px; background:var(--card);
  }
  .progress-info {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px;
  }
  .current-status { display:flex; align-items:center; gap:8px; }
  .status-icon { font-size:20px; }
  .status-text { font-size:14px; font-weight:800; color:var(--ink); }
  .progress-numbers { display:flex; align-items:baseline; gap:4px; }
  .current-exp { font-size:24px; font-weight:800; color:#222; letter-spacing:-.5px; }
  .total-exp { font-size:11px; color:var(--muted); }
  .progress-track { height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .progress-fill { height:100%; border-radius:inherit; transition:width .6s ease; }
  .progress-fill.basic { background:linear-gradient(90deg,#D7CCC8,#A1887F); }
  .progress-fill.silver { background:linear-gradient(90deg,#ECEFF1,#B0BEC5); }
  .progress-fill.gold { background:linear-gradient(90deg,#FFF176,#FFB300); }
  .progress-fill.diamond { background:linear-gradient(90deg,#64B5F6,#1976D2); }
  .progress-fill.black { background:linear-gradient(90deg,#757575,#212121); }
  .progress-motivation {
    margin-top:12px;
    font-size:11px; text-align:center; color:var(--muted);
  }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

  <div class="page">

    <a class="back-btn" onclick="goBack('profile.html')">‹</a>

    <!-- 等级 tabs -->
    <div class="level-tabs" id="levelTabs"></div>

    <!-- feature 卡 -->
    <div class="feature-card" id="featureCard">
      <div class="card-visual">
        <div class="physical-card" id="physicalCard">
          <div class="card-face">
            <div class="card-brand" id="cardBrand"></div>
            <span class="card-logo" id="cardLogo">COZY SILVER</span>
            <span class="card-number">8888 8888 8888 8888</span>
            <span class="card-member">MEMBER</span>
          </div>
        </div>
      </div>
      <div class="benefit-list" id="benefitList"></div>
      <div class="benefit-action" id="benefitAction"></div>
    </div>

    <!-- 会员进度 footer -->
    <div class="member-progress-footer">
      <div class="progress-info">
        <div class="current-status">
          <span class="status-icon" id="statusIcon">🥈</span>
          <span class="status-text" id="statusText">白银会员 SILVER</span>
        </div>
        <div class="progress-numbers">
          <span class="current-exp" id="currentExp">1,120</span>
          <span class="total-exp" id="totalExp">/ 1,500 EXP</span>
        </div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-motivation" id="progressMotivation"></div>
    </div>

  </div>

<script>
  const levels = ['basic','silver','gold','diamond','black'];
  const levelNames = { basic:'基础会员', silver:'白银会员', gold:'黄金会员', diamond:'钻石会员', black:'黑金会员' };
  const USER_LEVEL = 'silver';
  const CURRENT_EXP = 1120;
  const THRESHOLDS = { basic:0, silver:500, gold:1500, diamond:4000, black:9000 };
  const LEVEL_EMOJI = { basic:'☕', silver:'🥈', gold:'🏆', diamond:'💎', black:'👑' };

  // 等级徽章（咖啡豆/勋章/星/钻石/王冠）
  const EMBLEMS = {
    basic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><ellipse cx="12" cy="12" rx="6.4" ry="8.6" transform="rotate(32 12 12)"/><path d="M12 4.6c2.6 2.4 2.6 12.4 0 14.8"/></svg>',
    silver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.2"/></svg>',
    gold: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4l2.3 5.4 5.9.5-4.5 3.9 1.4 5.7L12 14.8l-5.1 3.1 1.4-5.7-4.5-3.9 5.9-.5z"/></svg>',
    diamond: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2L20.4 7 12 21.8 3.6 7z"/></svg>',
    black: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 17l2.1-8.4 3 3.2 4.3-9.4 4.3 9.4 3-3.2L21.4 17z"/></svg>'
  };

  // 权益：中文为主，英文 code 装饰
  const benefitsData = {
    basic: [
      { code:'PTS', name:'积分累积', desc:'消费积分 ×1.0' },
      { code:'ORD', name:'订单追踪', desc:'实时查看订单制作进度' }
    ],
    silver: [
      { code:'PTS', name:'积分倍率提升', desc:'消费积分 ×1.2' },
      { code:'DISC', name:'兑换优惠', desc:'积分商城兑换 95 折' },
      { code:'BRT', name:'生日礼遇', desc:'生日当月赠送双倍积分' }
    ],
    gold: [
      { code:'PTS', name:'积分倍率提升', desc:'消费积分 ×1.5' },
      { code:'DISC', name:'兑换优惠', desc:'积分商城兑换 9 折' },
      { code:'NEW', name:'新品优先', desc:'季节限定新品优先尝鲜' }
    ],
    diamond: [
      { code:'PTS', name:'积分倍率提升', desc:'消费积分 ×2.0' },
      { code:'DISC', name:'兑换优惠', desc:'积分商城兑换 85 折' },
      { code:'CUP', name:'专属咖啡', desc:'每月专属特调 · 会员专属价' }
    ],
    black: [
      { code:'PTS', name:'积分倍率提升', desc:'消费积分 ×3.0' },
      { code:'DISC', name:'兑换优惠', desc:'积分商城兑换 8 折' },
      { code:'ALL', name:'全权益解锁', desc:'新品优先 · 专属咖啡 · 专属客服' }
    ]
  };

  let selectedLevel = USER_LEVEL;

  function renderTabs() {
    document.getElementById('levelTabs').innerHTML = levels.map(l =>
      `<div class="level-tab ${selectedLevel === l ? 'active ' + l : ''}" data-level="${l}" onclick="selectLevel('${l}')">${levelNames[l]}</div>`
    ).join('');
  }

  function selectLevel(level) {
    selectedLevel = level;
    renderTabs();

    document.getElementById('physicalCard').className = 'physical-card ' + level;
    document.getElementById('cardLogo').textContent = 'COZY ' + level.toUpperCase();
    document.getElementById('cardBrand').innerHTML = EMBLEMS[level];

    document.getElementById('benefitList').innerHTML = benefitsData[level].map(b =>
      `<div class="benefit-row">
        <span class="b-icon">${b.code}</span>
        <div class="b-copy">
          <span class="b-name">${b.name}</span>
          <span class="b-desc">${b.desc}</span>
        </div>
      </div>`).join('');

    const action = document.getElementById('benefitAction');
    if (level === USER_LEVEL) {
      action.innerHTML = `
        <div class="receive-btn ${level}" onclick="toast('本月权益已领取')">领取月度权益礼包</div>
        <span class="upgrade-tip">本月已按白银会员领取，当前等级礼包将在下月生效</span>`;
    } else {
      action.innerHTML = '';
    }

    document.getElementById('featureCard').className = 'feature-card ' + level + (level === 'black' ? ' is-black' : '');
  }

  function renderProgress() {
    const idx = levels.indexOf(USER_LEVEL);
    const next = idx < levels.length - 1 ? THRESHOLDS[levels[idx + 1]] : null;
    const cur = THRESHOLDS[USER_LEVEL];
    const pct = next == null ? 100 : Math.round(((CURRENT_EXP - cur) / (next - cur)) * 100);

    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.className = 'progress-fill ' + USER_LEVEL;

    document.getElementById('statusIcon').textContent = LEVEL_EMOJI[USER_LEVEL];
    document.getElementById('statusText').textContent = levelNames[USER_LEVEL] + ' ' + USER_LEVEL.toUpperCase();
    document.getElementById('currentExp').textContent = CURRENT_EXP.toLocaleString();
    document.getElementById('totalExp').textContent = next != null ? '/ ' + next.toLocaleString() + ' EXP' : '';
    document.getElementById('progressMotivation').textContent = next == null
      ? '已到达最高等级，尊享全部会员权益'
      : '再积 ' + (next - CURRENT_EXP).toLocaleString() + ' EXP 升级至' + levelNames[levels[idx + 1]];
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }

  renderTabs();
  selectLevel(USER_LEVEL);
  renderProgress();
</script>
</body>
</html>
