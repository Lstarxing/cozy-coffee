<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>会员权益 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --ink:#2C2723; --muted:#8B8178; --primary:#753A22; --accent:#526C43;
    --surface:#F7F3EE; --card:#FFFFFF; --border:#E3DED8;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:18px;
    font-size:26px; line-height:1;
    color:var(--ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 22px 40px; }

  /* ── 页头（安静身份行，非卡） ── */
  .page-head { padding:6px 2px 26px; }
  .page-title {
    display:block;
    font-family:var(--serif); font-size:24px; font-weight:600; color:var(--ink);
  }
  .page-sub {
    display:block; margin-top:8px;
    font-size:12px; color:var(--muted);
  }
  .page-sub em { font-style:normal; color:var(--primary); font-weight:650; }

  /* ── Editorial section：线性分隔 + 留白 ── */
  .section { margin-top:32px; }
  .section-head {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:4px;
  }
  .section-title {
    font-size:11px; font-weight:700; letter-spacing:.18em; color:var(--muted);
  }
  .section-sub { font-size:11px; color:var(--muted); }

  /* 本月可用：行式 */
  .benefit-row {
    display:flex; align-items:center; gap:16px;
    padding:18px 2px;
    border-bottom:1px solid var(--border);
  }
  .benefit-row:last-child { border-bottom:0; }
  .b-icon {
    flex:none; width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    color:var(--primary);
  }
  .b-icon svg { width:22px; height:22px; }
  .b-copy { flex:1; min-width:0; }
  .b-name { display:block; font-size:14px; font-weight:600; color:var(--ink); }
  .b-desc { display:block; margin-top:4px; font-size:12px; color:var(--muted); line-height:1.5; }
  .b-state { flex:none; font-size:12px; font-weight:600; color:var(--accent); }
  .b-btn {
    flex:none; padding:7px 16px; border-radius:6px;
    border:1px solid var(--primary); background:transparent; color:var(--primary);
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .b-btn:active { background:var(--card); }

  /* 权益对比：每级一行 */
  .compare-list { margin-top:6px; }
  .compare-row {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:14px 2px;
    border-bottom:1px solid var(--border);
  }
  .compare-row:last-child { border-bottom:0; }
  .compare-name { font-size:14px; color:var(--ink); font-weight:500; }
  .compare-text { font-size:12px; color:var(--muted); }
  .compare-row.current .compare-name { color:var(--primary); font-weight:700; }
  .compare-row.current .compare-text { color:var(--primary); font-weight:600; }
  .compare-row.current .compare-name::before {
    content:''; display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--primary); margin-right:8px; vertical-align:2px;
  }

  /* 升级规则：一行门槛 */
  .rule-line {
    padding:16px 2px 0;
    font-size:13px; line-height:1.9; color:var(--ink);
  }
  .rule-line em { font-style:normal; color:var(--primary); font-weight:650; }
  .rule-note {
    padding:10px 2px 0;
    font-size:11px; line-height:1.7; color:var(--muted);
  }

  /* ── 会员进度（复用 web 端进度条，适配 Editorial） ── */
  .member-progress {
    margin-top:40px;
    padding:22px 2px 0;
    border-top:1px solid var(--border);
  }
  .progress-top {
    display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    margin-bottom:14px;
  }
  .progress-level {
    font-family:var(--serif); font-size:18px; font-weight:600; color:var(--ink);
  }
  .progress-level em {
    font-style:normal; font-size:11px; font-weight:700; letter-spacing:.12em;
    color:var(--muted); margin-left:8px;
  }
  .progress-exp { font-size:13px; font-weight:650; color:var(--ink); }
  .progress-exp i { font-style:normal; font-size:11px; font-weight:400; color:var(--muted); }
  .progress-track {
    height:3px; border-radius:2px;
    background:var(--border); overflow:hidden;
  }
  .progress-fill {
    height:100%; border-radius:2px;
    background:var(--primary); transition:width .6s ease;
  }
  .progress-motivation {
    margin-top:10px;
    font-size:11px; text-align:center; color:var(--muted);
  }
  .progress-motivation em { font-style:normal; color:var(--primary); font-weight:650; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

  <div class="page">

    <a class="back-btn" onclick="goBack('profile.html')">‹</a>

    <!-- 页头：安静身份行 -->
    <div class="page-head">
      <span class="page-title">会员权益</span>
      <span class="page-sub">白银会员 <em>· SILVER</em></span>
    </div>

    <!-- 本月可用 -->
    <div class="section">
      <div class="section-head">
        <span class="section-title">本月可用</span>
        <span class="section-sub">白银会员专享</span>
      </div>
      <div class="benefit-row">
        <span class="b-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v3.5a2 2 0 0 0 0 4V18H4v-3.5a2 2 0 0 0 0-4z"/><circle cx="9" cy="12" r=".8" fill="currentColor" stroke="none"/></svg>
        </span>
        <div class="b-copy">
          <span class="b-name">月度兑换券</span>
          <span class="b-desc">95 折兑换券 · 有效期 2026.08.01 - 08.31</span>
        </div>
        <span class="b-state">已领取 ✓</span>
      </div>
      <div class="benefit-row">
        <span class="b-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12" rx="1.5"/><path d="M3.5 13h17"/><path d="M12 8v12"/><path d="M12 8c-3.5 0-6-1.8-6-3.5S8.5 2.5 10 4c1 1 1 4 2 4z"/><path d="M12 8c3.5 0 6-1.8 6-3.5S15.5 2.5 14 4c-1 1-1 4-2 4z"/></svg>
        </span>
        <div class="b-copy">
          <span class="b-name">生日礼遇</span>
          <span class="b-desc">生日当月赠送双倍积分</span>
        </div>
        <button class="b-btn" onclick="toast('生日礼遇已领取')">去领取</button>
      </div>
    </div>

    <!-- 权益对比（每级一行） -->
    <div class="section">
      <div class="section-head">
        <span class="section-title">会员权益对比</span>
      </div>
      <div class="compare-list" id="compareList"></div>
    </div>

    <!-- 升级规则 -->
    <div class="section">
      <div class="section-head">
        <span class="section-title">升级规则</span>
      </div>
      <div class="rule-line">
        基础 <em>0</em> · 白银 <em>500</em> · 黄金 <em>1,500</em> · 钻石 <em>4,000</em> · 黑金 <em>9,000</em> EXP
      </div>
      <div class="rule-note">消费 1 元 = 1 EXP，达到门槛自动升级，升级后权益永久生效。</div>
    </div>

    <!-- 会员进度（web 端进度条复用，置底） -->
    <div class="member-progress">
      <div class="progress-top">
        <span class="progress-level">白银会员 <em>SILVER</em></span>
        <span class="progress-exp">1,120 <i>/ 1,500 EXP</i></span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:62%"></div>
      </div>
      <div class="progress-motivation">再积 <em>380</em> EXP 升级至黄金会员</div>
    </div>

  </div>

<script>
  const USER_LEVEL = 'silver';

  const compare = [
    { name:'基础会员', text:'1× 积分' },
    { name:'白银会员', text:'1.2× 积分 · 95 折兑换' },
    { name:'黄金会员', text:'1.5× 积分 · 9 折兑换' },
    { name:'钻石会员', text:'2× 积分 · 85 折兑换' },
    { name:'黑金会员', text:'3× 积分 · 8 折兑换' }
  ];
  const levelKeys = ['basic','silver','gold','diamond','black'];

  function renderCompare() {
    document.getElementById('compareList').innerHTML = compare.map((c, i) => `
      <div class="compare-row ${levelKeys[i] === USER_LEVEL ? 'current' : ''}">
        <span class="compare-name">${c.name}</span>
        <span class="compare-text">${c.text}</span>
      </div>`).join('');
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }

  renderCompare();
</script>
</body>
</html>
