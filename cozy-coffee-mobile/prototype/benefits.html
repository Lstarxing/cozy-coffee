<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>会员权益 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F5F3; color:#2B1E16;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --primary:#753A22; --primary-deep:#5E2E1B;
    --caramel:#A9712F; --caramel-soft:#F6EAD9; --brown-soft:#F3E9DF;
    --ink:#2B1E16; --muted:#756A63; --placeholder:#9E948E;
    --border:#E3DED8; --surface:#F7F5F3; --card:#FFFFFF; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  .back-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    margin-bottom:14px;
    font-size:26px; line-height:1;
    color:var(--ink);
    text-decoration:none; cursor:pointer;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--border);
  }
  .back-btn:active { opacity:.55; }

  .page { padding:20px 22px 40px; }

  /* ── 页头（安静身份行，非卡） ── */
  .page-head { padding:6px 2px 20px; }
  .head-identity { display:flex; align-items:center; gap:10px; }
  .head-badge {
    flex:none; width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    color:#857F78;
  }
  .head-badge svg { width:100%; height:100%; filter: drop-shadow(0 3px 5px rgba(0,0,0,.18)); }
  .head-level { display:flex; align-items:baseline; gap:6px; }
  .head-level-name {
    font-size:15px;
    font-weight:650;
    color:var(--ink);
  }
  .head-level-en {
    font-size:10px;
    font-weight:700;
    letter-spacing:.12em;
    color:var(--muted);
  }

  /* ── Editorial section：线性分隔 + 留白 ── */
  .section { margin-top:16px; }
  .section-head {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:4px;
  }
  .section-title {
    font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--muted);
  }
  .section-sub { font-size:10px; color:var(--muted); }

  /* 本月可用：行式 */
  .benefit-row {
    display:flex; align-items:center; gap:12px;
    padding:17px 2px;
    border-bottom:1px solid var(--border);
  }
  .benefit-row:last-child { border-bottom:0; }
  .b-icon {
    flex:none; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--surface);
    color:var(--primary);
    font-family:var(--serif); font-size:13px; font-weight:700;
  }
  .b-copy { flex:1; min-width:0; }
  .b-name { display:block; font-size:14px; font-weight:600; color:var(--ink); }
  .b-desc { display:block; margin-top:4px; font-size:11px; color:var(--muted); line-height:1.5; }
  .b-btn {
    flex:none; padding:7px 15px; border-radius:6px;
    border:1px solid var(--primary); background:transparent; color:var(--primary);
    font-size:11px; font-weight:600; cursor:pointer;
  }
  .b-btn:active { background:var(--card); }
  .b-btn.muted {
    border-color:var(--border);
    color:var(--muted);
  }

  /* 权益对比：每级一行 */
  .compare-list { margin-top:6px; }
  .compare-row {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:14px 2px;
    border-bottom:1px solid var(--border);
  }
  .compare-row:last-child { border-bottom:0; }
  .compare-name { font-size:14px; color:var(--ink); font-weight:500; }
  .compare-text { font-size:11px; color:var(--muted); }
  .compare-row.current .compare-name { color:var(--primary); font-weight:700; }
  .compare-row.current .compare-text { color:var(--primary); font-weight:600; }
  .compare-row.current .compare-name::before {
    content:''; display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--primary); margin-right:8px; vertical-align:2px;
  }

  /* 升级规则：门槛表 */
  .rule-table {
    margin-top:10px;
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
  }
  .rule-row {
    display:flex; align-items:center;
    border-bottom:1px solid var(--border);
  }
  .rule-row:last-child { border-bottom:0; }
  .rule-row.current { background:var(--surface); }
  .rule-head { background:var(--surface); }
  .rule-cell {
    flex:1;
    padding:11px 14px;
    font-size:12px;
    color:var(--ink);
  }
  .rule-cell:last-child { text-align:right; }
  .rule-head .rule-cell {
    font-size:10px;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--muted);
  }
  .rule-row.current .rule-cell {
    color:var(--primary);
    font-weight:650;
  }
  .rule-note {
    padding:8px 2px 0;
    font-size:10px; line-height:1.7; color:var(--muted);
  }

  /* ── 会员进度（复用 web 端进度条，适配 Editorial） ── */
  .member-progress {
    margin-top:32px;
    padding:18px 2px 0;
    border-top:1px solid var(--border);
  }
  .progress-top {
    display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    margin-bottom:13px;
  }
  .progress-level {
    font-family:var(--serif); font-size:18px; font-weight:600; color:var(--ink);
  }
  .progress-level em {
    font-style:normal; font-size:10px; font-weight:700; letter-spacing:.12em;
    color:var(--muted); margin-left:6px;
  }
  .progress-exp { font-size:13px; font-weight:650; color:var(--ink); }
  .progress-exp i { font-style:normal; font-size:10px; font-weight:400; color:var(--muted); }
  .progress-track {
    height:3px; border-radius:2px;
    background:var(--border); overflow:hidden;
  }
  .progress-fill {
    height:100%; border-radius:2px;
    transition:width .6s ease;
  }
  .progress-motivation {
    margin-top:8px;
    font-size:10px; text-align:center; color:var(--muted);
  }
  .progress-motivation em { font-style:normal; color:var(--primary); font-weight:650; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F5F3;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

  <div class="page">

    <a class="back-btn" onclick="goBack('profile.html')">‹</a>

    <!-- 页头：安静身份行 -->
    <div class="page-head">
      <div class="head-identity">
        <span class="head-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.2"/></svg>
        </span>
        <div class="head-level">
          <span class="head-level-name">白银会员</span>
          <span class="head-level-en">· SILVER</span>
        </div>
      </div>
    </div>

    <!-- 本月可用 -->
    <div class="section">
      <div class="section-head">
        <span class="section-title">本月可用</span>
        <span class="section-sub">白银会员专享</span>
      </div>
      <div class="benefit-row">
        <span class="b-icon">券</span>
        <div class="b-copy">
          <span class="b-name">月度兑换券</span>
          <span class="b-desc">95 折兑换券 · 本月有效</span>
        </div>
        <button class="b-btn" onclick="toast('权益已发放至券包')">去领取</button>
      </div>
      <div class="benefit-row">
        <span class="b-icon">礼</span>
        <div class="b-copy">
          <span class="b-name">生日礼遇</span>
          <span class="b-desc">生日当月赠送双倍积分</span>
        </div>
        <button class="b-btn muted" onclick="toast('生日当月自动赠送双倍积分')">去领取</button>
      </div>
    </div>

    <!-- 权益对比（每级一行） -->
    <div class="section">
      <div class="section-head">
        <span class="section-title">会员权益对比</span>
      </div>
      <div class="compare-list" id="compareList"></div>
    </div>

    <!-- 升级规则 -->
    <div class="section">
      <div class="section-head">
        <span class="section-title">升级规则</span>
      </div>
      <div class="rule-table">
        <div class="rule-row rule-head">
          <span class="rule-cell">会员等级</span>
          <span class="rule-cell">升级门槛</span>
        </div>
        <div class="rule-row">
          <span class="rule-cell">基础会员</span>
          <span class="rule-cell">0 EXP</span>
        </div>
        <div class="rule-row current">
          <span class="rule-cell">白银会员</span>
          <span class="rule-cell">500 EXP</span>
        </div>
        <div class="rule-row">
          <span class="rule-cell">黄金会员</span>
          <span class="rule-cell">1,500 EXP</span>
        </div>
        <div class="rule-row">
          <span class="rule-cell">钻石会员</span>
          <span class="rule-cell">4,000 EXP</span>
        </div>
        <div class="rule-row">
          <span class="rule-cell">黑金会员</span>
          <span class="rule-cell">9,000 EXP</span>
        </div>
      </div>
      <div class="rule-note">消费 1 元 = 1 EXP，达到门槛自动升级，升级后权益永久生效。</div>
    </div>

    <!-- 会员进度（web 端进度条复用，置底） -->
    <div class="member-progress">
      <div class="progress-top">
        <span class="progress-level">白银会员 <em>SILVER</em></span>
        <span class="progress-exp">1,120 <i>/ 1,500 EXP</i></span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:62%; background:#857F78"></div>
      </div>
      <div class="progress-motivation">再积 <em>380</em> EXP 升级至黄金会员</div>
    </div>

  </div>

<script>
  const USER_LEVEL = 'silver';

  // 对齐 benefits/index.vue 的 compare 数组
  const compare = [
    { name:'基础会员', text:'1× 积分' },
    { name:'白银会员', text:'1.2× 积分 · 95 折兑换' },
    { name:'黄金会员', text:'1.5× 积分 · 9 折兑换' },
    { name:'钻石会员', text:'2× 积分 · 85 折兑换' },
    { name:'黑金会员', text:'3× 积分 · 8 折兑换' }
  ];
  const levelKeys = ['basic','silver','gold','diamond','black'];

  function renderCompare() {
    document.getElementById('compareList').innerHTML = compare.map((c, i) => `
      <div class="compare-row ${levelKeys[i] === USER_LEVEL ? 'current' : ''}">
        <span class="compare-name">${c.name}</span>
        <span class="compare-text">${c.text}</span>
      </div>`).join('');
  }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }

  renderCompare();
</script>
</body>
</html>
