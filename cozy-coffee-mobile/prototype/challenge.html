<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>月度挑战 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --ink:#2C2723; --muted:#8B8178; --primary:#753A22; --accent:#526C43;
    --surface:#F7F3EE; --card:#FFFFFF; --border:#E3DED8;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部原生式导航 ── */
  .top-nav {
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
  }
  .nav-back { font-size:26px; line-height:1; color:var(--ink); cursor:pointer; padding:6px 4px; width:32px; }
  .nav-back:active { opacity:.5; }
  .nav-title {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:16px; font-weight:600; color:var(--ink);
    white-space:nowrap;
  }
  .nav-right { width:32px; }

  .page { padding:0 20px 120px; }

  /* ── Hero ── */
  .challenge-hero {
    margin-top:6px;
    padding:26px 24px 22px;
    border-radius:12px; color:#fff;
    background:linear-gradient(135deg,#3A342E,#2C1E18);
    text-align:center;
  }
  .hero-eyebrow {
    display:block;
    font-size:9px; font-weight:700; letter-spacing:.26em;
    opacity:.7;
  }
  .hero-title {
    display:block; margin-top:10px;
    font-family:var(--serif); font-size:24px; font-weight:600;
  }
  .hero-sub {
    display:block; margin-top:6px;
    font-size:12px; color:rgba(255,255,255,.65);
  }
  .hero-stats {
    display:flex; gap:12px;
    margin-top:22px;
  }
  .stat {
    flex:1; padding:12px 0;
    border-radius:8px;
    background:rgba(255,255,255,.08);
  }
  .stat-val { display:block; font-size:18px; font-weight:700; }
  .stat-lbl { display:block; margin-top:3px; font-size:10px; opacity:.7; }

  /* ── 任务列表 ── */
  .task-section {
    margin-top:16px; padding:8px 20px 12px;
    border-radius:12px; background:var(--card);
  }
  .task-row {
    display:flex; align-items:center; gap:14px;
    padding:16px 0;
    border-bottom:1px solid var(--border);
  }
  .task-row:last-child { border-bottom:0; }
  .task-row.done { opacity:.62; }
  .task-icon {
    flex:none; width:44px; height:44px; border-radius:12px;
    background:var(--surface); color:var(--primary);
    display:flex; align-items:center; justify-content:center;
  }
  .task-icon svg { width:22px; height:22px; }
  .task-main { flex:1; min-width:0; }
  .task-top {
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .task-name { font-size:14px; font-weight:600; color:var(--ink); }
  .task-reward {
    flex:none; font-size:12px; font-weight:700; color:var(--primary);
  }
  .task-reward.claimed {
    color:var(--accent); font-weight:650;
  }
  .task-desc {
    display:block; margin-top:3px;
    font-size:11px; color:var(--muted);
  }
  .task-progress {
    margin-top:10px; height:3px; border-radius:2px;
    background:var(--border); overflow:hidden;
  }
  .task-progress-fill {
    height:100%; border-radius:2px;
    background:var(--primary); transition:width .5s ease;
  }
  .task-status {
    flex:none; font-size:13px; font-weight:650; color:var(--ink);
  }
  .task-status.done { color:var(--accent); }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <!-- 顶部导航 -->
  <div class="top-nav">
    <span class="nav-back" onclick="goBack('profile.html')">‹</span>
    <span class="nav-title">月度挑战</span>
    <span class="nav-right"></span>
  </div>

  <!-- Hero -->
  <div class="challenge-hero">
    <span class="hero-eyebrow">COZY CHALLENGE</span>
    <span class="hero-title">8 月咖啡挑战</span>
    <span class="hero-sub">达标自动发放积分，无需手动领取</span>
    <div class="hero-stats">
      <div class="stat"><span class="stat-val" id="heroDone">1/4</span><span class="stat-lbl">已完成挑战</span></div>
      <div class="stat"><span class="stat-val" id="heroPoints">+40</span><span class="stat-lbl">本月已获积分</span></div>
    </div>
  </div>

  <!-- 任务列表 -->
  <div class="task-section" id="taskList"></div>

</div>

<script>
  // 与 web 端 MonthlyChallengePanel 对齐：达标后积分自动发放（claimed），无手动领取
  const ICONS = {
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>',
    truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 13H6.2z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></svg>'
  };

  // claimed = 已达标并自动发放积分
  const tasks = [
    { name:'打卡达人', desc:'本月完成订单 4 次', reward:40, cur:2, total:4, claimed:false, icon:'calendar' },
    { name:'晨间唤醒', desc:'10:00 前完成订单 3 次', reward:60, cur:3, total:3, claimed:true, icon:'sun' },
    { name:'外卖尝鲜', desc:'完成 2 笔外卖订单', reward:50, cur:1, total:2, claimed:false, icon:'truck' },
    { name:'新品猎人', desc:'尝试 3 款限定新品', reward:80, cur:1, total:3, claimed:false, icon:'bag' }
  ];

  function render() {
    const box = document.getElementById('taskList');
    box.innerHTML = tasks.map(t => {
      const done = t.claimed || t.cur >= t.total;
      const pct = Math.min(100, Math.round(t.cur / t.total * 100));
      return `
        <div class="task-row ${done ? 'done' : ''}">
          <span class="task-icon">${ICONS[t.icon]}</span>
          <div class="task-main">
            <div class="task-top">
              <span class="task-name">${t.name}</span>
              ${done
                ? '<span class="task-reward claimed">✓ 已发放</span>'
                : `<span class="task-reward">+${t.reward} 积分</span>`}
            </div>
            <span class="task-desc">${t.desc}</span>
            <div class="task-progress"><div class="task-progress-fill" style="width:${pct}%"></div></div>
          </div>
          <span class="task-status ${done ? 'done' : ''}">${t.cur}/${t.total}</span>
        </div>`;
    }).join('');

    const doneCount = tasks.filter(t => t.claimed || t.cur >= t.total).length;
    const earned = tasks.filter(t => t.claimed).reduce((s, t) => s + t.reward, 0);
    document.getElementById('heroDone').textContent = doneCount + '/' + tasks.length;
    document.getElementById('heroPoints').textContent = '+' + earned;
  }

  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }

  render();
</script>
</body>
</html>
