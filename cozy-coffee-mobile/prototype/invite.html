<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>邀请好友 · Cozy Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#F7F3EE; color:#2C2723;
    max-width:390px; margin:0 auto; min-height:100vh;
  }
  :root {
    --roast-brown:#753A22; --roast-brown-deep:#5E2E1B;
    --caramel:#A9712F; --caramel-soft:#F6EAD9; --brown-soft:#F3E9DF;
    --porcelain:#FFFFFF; --porcelain-muted:#F7F5F3;
    --cask-brown:#2C1E18;
    --roastery-ink:#2B1E16; --quiet-ink:#756A63;
    --placeholder:#9E948E; --hairline:#E3DED8;
    --ink:#2B1E16; --muted:#756A63; --primary:#753A22;
    --surface:#F7F5F3; --card:#FFFFFF; --border:#E3DED8; --cask:#2C1E18;
    --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  }

  /* ── 顶部原生式导航：返回 + 居中标题 ── */
  .top-nav {
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
  }
  .nav-back {
    font-size:26px; line-height:1; color:var(--ink);
    cursor:pointer; padding:6px 4px; width:32px;
  }
  .nav-back:active { opacity:.5; }
  .nav-title {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:16px; font-weight:600; color:var(--ink);
    white-space:nowrap;
  }
  .nav-right { width:32px; }

  .page { padding:0 20px 120px; }

  /* ── 页头 ── */
  .invite-intro { padding:6px 8px 12px; }
  .intro-kicker {
    display:block;
    font-size:9px; font-weight:700; letter-spacing:.2em; color:var(--muted);
  }
  .intro-title {
    display:block; margin-top:6px;
    font-family:var(--serif); font-size:22px; font-weight:600; color:var(--ink);
  }
  .intro-copy {
    display:block; margin-top:6px;
    font-size:12px; color:var(--muted);
  }

  /* ── 卡片 ── */
  .invite-card {
    margin-top:16px; padding:18px;
    border:1px solid var(--border); border-radius:14px;
    background:var(--card);
  }
  .card-label { display:block; font-size:12px; font-weight:650; color:var(--muted); }
  .invite-code {
    display:block; margin-top:8px;
    font-size:22px; font-weight:800; letter-spacing:.16em; color:var(--ink);
  }
  .card-hint {
    display:block; margin-top:7px;
    font-size:11px; line-height:1.5; color:var(--muted);
  }
  .code-actions { margin-top:14px; display:flex; gap:10px; }
  .code-btn {
    flex:1; height:36px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border); border-radius:10px;
    background:var(--card); color:var(--ink);
    font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .code-btn:active { opacity:.8; }

  /* ── 绑定 ── */
  .hidden { display:none !important; }
  .bound-state { display:flex; align-items:flex-start; gap:8px; }
  .bound-mark {
    flex:none; width:22px; height:22px; border-radius:50%;
    background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .bound-mark svg { width:12px; height:12px; }
  .bound-copy { min-width:0; flex:1; }
  .bound-title { display:block; font-size:12px; font-weight:680; color:var(--ink); }
  .bound-sub { display:block; margin-top:3px; font-size:10px; line-height:1.5; color:var(--muted); }
  .apply-row { margin-top:10px; display:flex; gap:8px; }
  .invite-input {
    flex:1; min-width:0; height:36px; padding:0 10px;
    border:1px solid var(--border); border-radius:10px;
    background:var(--card); color:var(--ink);
    font-size:13px; font-weight:650; letter-spacing:.08em; font-family:inherit;
    text-transform:uppercase;
  }
  .invite-input::placeholder { font-weight:500; text-transform:none; letter-spacing:0; color:var(--placeholder); }
  .invite-input:focus { outline:none; border-color:var(--roast-brown); }
  .apply-button {
    flex:none; width:70px; height:36px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border); border-radius:10px;
    background:var(--card); color:var(--ink);
    font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .apply-button:active { opacity:.8; }

  /* ═══════════════════════════════════════
     绑定状态预览（原型工具）
     ═══════════════════════════════════════ */
  .level-preview {
    display:flex; align-items:center; gap:8px;
    margin-top:14px;
  }
  .preview-label {
    flex:none;
    font-size:9px; font-weight:700; letter-spacing:.14em;
    color:var(--placeholder);
  }
  .preview-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .preview-chip {
    display:flex; align-items:center; gap:5px;
    padding:4px 9px; border-radius:6px;
    border:1px solid var(--hairline);
    background:var(--card); color:var(--muted);
    font-size:10px; font-weight:600; cursor:pointer;
    transition:all .2s;
  }
  .preview-chip .chip-emblem { width:12px; height:12px; display:flex; }
  .preview-chip .chip-emblem svg { width:100%; height:100%; }
  .preview-chip.active {
    border-color:var(--roast-brown); color:var(--roast-brown);
    background:var(--porcelain-muted);
  }
  .preview-chip:active { opacity:.6; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(44,39,35,.88); color:#F7F3EE;
    font-size:12px; pointer-events:none; z-index:99;
    opacity:0; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div class="page">

  <!-- 顶部导航 -->
  <div class="top-nav">
    <span class="nav-back" onclick="goBack('profile.html')">‹</span>
    <span class="nav-title">邀请好友</span>
    <span class="nav-right"></span>
  </div>

  <!-- 页头 -->
  <div class="invite-intro">
    <span class="intro-kicker">COZY REFERRAL</span>
    <span class="intro-title">邀请一位朋友，共享会员礼遇</span>
    <span class="intro-copy">好友完成首单，你们都可获得会员奖励。</span>
  </div>

  <!-- 我的邀请码 -->
  <div class="invite-card">
    <span class="card-label">我的邀请码</span>
    <span class="invite-code">COZY8K2P</span>
    <span class="card-hint">分享给好友，好友注册并完成首单后你即可获得奖励</span>
    <div class="code-actions">
      <div class="code-btn" onclick="copyCode()">复制邀请码</div>
      <div class="code-btn" onclick="share()">分享给好友</div>
    </div>
  </div>

  <!-- 绑定好友邀请码 -->
  <div class="invite-card">
    <div class="bound-state hidden" id="boundState">
      <span class="bound-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </span>
      <div class="bound-copy">
        <span class="bound-title">已绑定好友邀请码</span>
        <span class="bound-sub">邀请关系只能绑定一次，当前账户已完成绑定。</span>
      </div>
    </div>
    <div id="bindForm">
      <span class="card-label">已有好友邀请码？</span>
      <span class="card-hint">绑定后建立邀请关系，仅可绑定一次</span>
      <div class="apply-row">
        <input class="invite-input" id="inviteInput" maxlength="8" placeholder="输入 8 位邀请码" oninput="normalizeInput(this)">
        <div class="apply-button" onclick="bindCode()">绑定</div>
      </div>
    </div>
  </div>

  <!-- 绑定状态预览（原型工具） -->
  <div class="level-preview">
    <span class="preview-label">绑定状态</span>
    <div class="preview-chips">
      <div class="preview-chip active" data-bind="out" onclick="switchBind('out')">
        <span class="chip-emblem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></span>
        <span>未绑定</span>
      </div>
      <div class="preview-chip" data-bind="in" onclick="switchBind('in')">
        <span class="chip-emblem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>
        <span>已绑定</span>
      </div>
    </div>
  </div>

</div>

<script>
  const OWN_CODE = 'COZY8K2P';

  function normalizeInput(el) {
    el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  }

  function copyCode() { toast('邀请码已复制'); }

  function share() { toast('已调起分享面板'); }

  function bindCode() {
    const el = document.getElementById('inviteInput');
    const code = el.value.trim().toUpperCase();
    if (!/^[A-Z0-9]{8}$/.test(code)) { toast('请输入完整的 8 位邀请码'); return; }
    if (code === OWN_CODE) { toast('不能填写自己的邀请码'); return; }
    document.getElementById('bindForm').classList.add('hidden');
    document.getElementById('boundState').classList.remove('hidden');
    toast('邀请码绑定成功');
  }

  // 原型工具：绑定状态预览切换
  function switchBind(mode) {
    document.querySelectorAll('.preview-chip[data-bind]').forEach(c => {
      c.classList.toggle('active', c.dataset.bind === mode);
    });
    document.getElementById('bindForm').classList.toggle('hidden', mode === 'in');
    document.getElementById('boundState').classList.toggle('hidden', mode !== 'in');
  }

  function goBack(fallback) {
    if (document.referrer && window.history.length > 1) { history.back(); }
    else { location.href = fallback; }
  }
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
  }
</script>
</body>
</html>
