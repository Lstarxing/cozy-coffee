server:
  port: 8080

spring:
  application:
    name: cozy-gateway
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  servlet:
    multipart:
      max-file-size: 10MB      # 单个文件最大 10MB
      max-request-size: 10MB   # 整个请求最大 10MB

dubbo:
  application:
    name: cozy-gateway
  registry:
    address: nacos://localhost:8848
  consumer:
    check: false
    timeout: 30000

# RocketMQ：异步派发下单成功事件（SSE 广播 + 管理端缓存清理）
# 生产者使用 sendOneWay，Broker 不可用不会阻塞下单主流程
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: cozy-gateway-producer
    send-message-timeout: 2000
    retry-times-when-send-failed: 0
    retry-times-when-send-async-failed: 0

logging:
  level:
    com.cozy: DEBUG
