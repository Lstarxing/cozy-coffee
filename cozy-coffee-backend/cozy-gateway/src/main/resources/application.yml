server:
  port: 8080

spring:
  application:
    name: cozy-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  servlet:
    multipart:
      max-file-size: 10MB      # 单个文件最大 10MB
      max-request-size: 10MB   # 整个请求最大 10MB

dubbo:
  application:
    name: cozy-gateway
  registry:
    address: nacos://localhost:8848
  consumer:
    check: false
    timeout: 30000

# RocketMQ：异步派发下单成功事件（SSE 广播 + 管理端缓存清理）
# 生产者使用 sendOneWay，Broker 不可用不会阻塞下单主流程
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: cozy-gateway-producer
    send-message-timeout: 2000
    retry-times-when-send-failed: 1
    retry-times-when-send-async-failed: 1

logging:
  level:
    com.cozy: INFO
    com.cozy.gateway.mq: DEBUG

# 对象存储配置（环境变量注入，敏感信息不放仓库）
# OSS 到期临时用本地存储：STORAGE_TYPE=local（默认）；上线配好 OSS 后设 STORAGE_TYPE=oss
storage:
  type: ${STORAGE_TYPE:local}
  endpoint: ${STORAGE_ENDPOINT:}
  bucket: ${STORAGE_BUCKET:}
  access-key-id: ${STORAGE_ACCESS_KEY_ID:}
  access-key-secret: ${STORAGE_ACCESS_KEY_SECRET:}
  dir-prefix: ${STORAGE_DIR_PREFIX:images/}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
  local-upload-dir: ${LOCAL_UPLOAD_DIR:./uploads}

# 认证配置：微信登录（未配置 secret 时走开发登录）
cozy:
  auth:
    dev-login-enabled: ${AUTH_DEV_LOGIN_ENABLED:false}
    wechat:
      appid: ${WECHAT_APPID:}
      secret: ${WECHAT_SECRET:}
  web:
    # 生产必须用 CORS_ALLOWED_ORIGINS 指定明确 https 域名白名单（逗号分隔）；ProdConfigGuard 会拦截生产漏配
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
