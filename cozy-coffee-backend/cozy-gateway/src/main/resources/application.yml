server:
  port: 8080

spring:
  application:
    name: cozy-gateway
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  servlet:
    multipart:
      max-file-size: 10MB      # 单个文件最大 10MB
      max-request-size: 10MB   # 整个请求最大 10MB

dubbo:
  application:
    name: cozy-gateway
  registry:
    address: nacos://localhost:8848
  consumer:
    check: false
    timeout: 30000

logging:
  level:
    com.cozy: DEBUG
