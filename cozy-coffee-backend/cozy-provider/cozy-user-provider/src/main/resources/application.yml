server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: cozy-user-provider
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cozy_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: cozy-user-provider
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: dubbo
    port: 20881
  provider:
    timeout: 30000
  consumer:
    timeout: 30000
    check: false

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: cozy-user-producer
    send-message-timeout: 2000
    retry-times-when-send-failed: 1

# 注：`cozy.user.profile`（完善资料奖励）已随 ProfileRewardConfig 迁到消费端（member-provider），
# 事件只表达"资料已完善"、不携带积分数 —— 本模块不再需要该配置块。
