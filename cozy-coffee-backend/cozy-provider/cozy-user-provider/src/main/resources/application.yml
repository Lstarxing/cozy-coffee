server:
  port: 8081

spring:
  application:
    name: cozy-user-provider
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cozy_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: cozy-user-provider
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: dubbo
    port: 20881
  provider:
    timeout: 30000
  consumer:
    timeout: 30000
    check: false

# 首单邀请奖励配置（InviteRewardConfig，被邀请人首单完成时为邀请人发券）
cozy:
  user:
    invite:
      coupon-type: BOGO
      min-amount: 0
      discount-amount: 40
      valid-days: 30
      unique-key-prefix: invite_firstorder
    # 完善个人资料奖励（ProfileRewardConfig，首次补齐手机号+邮箱发积分）
    profile:
      points: 20
      source-type: profile
      description: 完善个人资料（手机号+邮箱）奖励
