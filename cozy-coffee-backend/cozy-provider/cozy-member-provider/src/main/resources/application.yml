server:
  port: 8082

spring:
  application:
    name: cozy-member-provider
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cozy_member?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: cozy-member-provider
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: dubbo
    port: 20882
  provider:
    timeout: 30000
  consumer:
    check: false
    timeout: 30000

# RocketMQ：消费订单完成事件（积分/EXP/首单/月度任务）
# 使用 CLUSTERING 模式，多实例时只有一个实例消费，避免重复发放
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
