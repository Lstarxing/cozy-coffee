server:
  port: 8082

spring:
  application:
    name: cozy-member-provider
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cozy_member?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: cozy-member-provider
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: dubbo
    port: 20882
  provider:
    timeout: 30000
  consumer:
    check: false
    timeout: 30000

# RocketMQ：消费订单完成事件（积分/EXP/首单/月度任务）
# 使用 CLUSTERING 模式，多实例时只有一个实例消费，避免重复发放
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}

# 会员等级与保级策略配置（MemberLevelConfig 单一事实源，改动只改这里）
cozy:
  member:
    level:
      # 升级 EXP 阈值
      silver-exp: 500
      gold-exp: 1500
      diamond-exp: 4000
      black-exp: 9000
      # 保级门槛（年度 EXP）
      silver-keep-exp: 300
      gold-keep-exp: 1000
      diamond-keep-exp: 2500
      black-keep-exp: 4000
      # 唤醒门槛（单月 EXP）
      diamond-awaken-exp: 600
      black-awaken-exp: 800
      # 保级失败落点 EXP（休眠/降级后的 EXP）
      black-dormant-exp: 4500
      diamond-demote-exp: 1499
      gold-demote-exp: 500
      silver-demote-exp: 0
      # 黑卡加速包：剩余额度内 1.7x，超出 1.5x，每月额度 300
      accelerate-rate: 1.70
      normal-rate: 1.5
      accelerate-monthly-cap: 300
      # 会员日（Cozy Day）：每周五积分倍率 +0.5
      cozy-day-bonus: 0.5
      cozy-day-of-week: FRIDAY
