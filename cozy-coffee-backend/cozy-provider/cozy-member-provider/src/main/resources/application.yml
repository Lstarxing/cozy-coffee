server:
  port: 8082

spring:
  application:
    name: cozy-member-provider
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cozy_member?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: cozy-member-provider
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: dubbo
    port: 20882
  provider:
    timeout: 30000
  consumer:
    check: false
    timeout: 30000

# RocketMQ：消费订单完成事件（积分/EXP/首单/月度任务）
# 使用 CLUSTERING 模式，多实例时只有一个实例消费，避免重复发放
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}

# 会员等级与保级策略配置（MemberLevelConfig 单一事实源，改动只改这里）
cozy:
  member:
    level:
      # 升级 EXP 阈值
      silver-exp: 500
      gold-exp: 1500
      diamond-exp: 4000
      black-exp: 9000
      # 保级门槛（年度 EXP）
      silver-keep-exp: 300
      gold-keep-exp: 1000
      diamond-keep-exp: 2500
      black-keep-exp: 4000
      # 唤醒门槛（单月 EXP）
      diamond-awaken-exp: 600
      black-awaken-exp: 800
      # 保级失败落点 EXP（休眠/降级后的 EXP）
      black-dormant-exp: 4500
      diamond-demote-exp: 1499
      gold-demote-exp: 500
      silver-demote-exp: 0
      # 黑卡加速包：剩余额度内 1.7x，超出 1.5x，每月额度 300
      accelerate-rate: 1.70
      normal-rate: 1.5
      accelerate-monthly-cap: 300
      # 会员日（Cozy Day）：每周五积分倍率 +0.5
      cozy-day-bonus: 0.5
      cozy-day-of-week: FRIDAY
    # 月度挑战任务配置（MonthlyChallengeConfig 单一事实源，白皮书「月度挑战任务」表）
    monthly-challenge:
      items:
        - key: order
          title: 打卡达人
          description: 当月完成 4 笔订单
          target: 4
          reward: 40
          stats-field: orderCount
        - key: morning
          title: 晨间唤醒
          description: 当月完成 3 笔上午 10 点前订单
          target: 3
          reward: 60
          stats-field: morningOrderCount
        - key: delivery
          title: 外卖尝鲜
          description: 当月完成 2 笔外卖
          target: 2
          reward: 50
          stats-field: deliveryOrderCount
        - key: newproduct
          title: 新品猎人
          description: 当月购买 3 款新品
          target: 3
          reward: 80
          stats-field: newProductCount
    # 生日权益配置（BirthdayRewardConfig，白皮书「生日礼」阶梯权益）
    birthday:
      levels:
        black:
          points: 888
          coupons:
            - coupon-type: BIRTHDAY_BLACK_FREE
              min-amount: 0
              discount-amount: 40
              valid-days: 30
            - coupon-type: BIRTHDAY_FREE_CAKE
              min-amount: 0
              discount-amount: 40
              valid-days: 30
        diamond:
          points: 0
          coupons:
            - coupon-type: BIRTHDAY_DIAMOND_FREE
              min-amount: 0
              discount-amount: 40
              valid-days: 30
            - coupon-type: BIRTHDAY_CAKE_HALF
              min-amount: 0
              discount-amount: 50
              valid-days: 30
        gold:
          points: 0
          coupons:
            - coupon-type: BIRTHDAY_GOLD_FREE
              min-amount: 0
              discount-amount: 40
              valid-days: 30
        silver:
          points: 0
          coupons:
            - coupon-type: BIRTHDAY_SILVER_BOGO
              min-amount: 0
              discount-amount: 40
              valid-days: 30
        basic:
          points: 0
          coupons:
            - coupon-type: BIRTHDAY_BASIC_DISCOUNT
              min-amount: 0
              discount-amount: 50
              valid-days: 30
    # 签到奖励配置（SigninRewardConfig）
    signin:
      daily-points: 2
      seven-day-coupon-after-days: 7
      seven-day-coupon:
        coupon-type: SIGNIN_7DAY
        min-amount: 35
        discount-amount: 10
        valid-days: 3
    # 首单奖励配置（FirstOrderRewardConfig）
    first-order:
      points: 200
      source-type: first_order_bonus
