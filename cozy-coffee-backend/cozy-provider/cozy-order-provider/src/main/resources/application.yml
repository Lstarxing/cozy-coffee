server:
  port: 8083

spring:
  application:
    name: cozy-order-provider
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cozy_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: cozy-order-provider
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: dubbo
    port: 20883
  provider:
    timeout: 30000
  consumer:
    timeout: 30000
    check: false

# RocketMQ：Outbox 模式投递 order_cancelled
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: cozy-order-producer
    send-message-timeout: 2000
    retry-times-when-send-failed: 1

cozy:
  order:
    timeout-cancel:
      enabled: true
      timeout-minutes: 15
      batch-size: 200
      max-rounds: 5
      scan-interval-ms: 15000
    # 订单奖励自动确认兜底：出餐后/预计送达后超时未确认，自动确认并发奖
    reward-auto-confirm:
      enabled: true
      scan-interval-ms: 60000
      batch-size: 100
      pickup-grace-minutes: 60
      delivery-grace-minutes: 60
  # 会员等级与保级策略配置（MemberLevelConfig 单一事实源，改动只改这里）
  member:
    level:
      # 升级 EXP 阈值
      silver-exp: 500
      gold-exp: 1500
      diamond-exp: 4000
      black-exp: 9000
      # 保级门槛（年度 EXP）
      silver-keep-exp: 300
      gold-keep-exp: 1000
      diamond-keep-exp: 2500
      black-keep-exp: 4000
      # 唤醒门槛（单月 EXP）
      diamond-awaken-exp: 600
      black-awaken-exp: 800
      # 保级失败落点 EXP（休眠/降级后的 EXP）
      black-dormant-exp: 4500
      diamond-demote-exp: 1499
      gold-demote-exp: 500
      silver-demote-exp: 0
      # 黑卡加速包：剩余额度内 1.7x，超出 1.5x，每月额度 300
      accelerate-rate: 1.70
      normal-rate: 1.5
      accelerate-monthly-cap: 300
      # 会员日（Cozy Day）：每周五积分倍率 +0.5
      cozy-day-bonus: 0.5
      cozy-day-of-week: FRIDAY
