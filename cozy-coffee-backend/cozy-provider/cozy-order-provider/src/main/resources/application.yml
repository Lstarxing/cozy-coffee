server:
  port: 8083

spring:
  application:
    name: cozy-order-provider
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cozy_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: cozy-order-provider
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: dubbo
    port: 20883
  provider:
    timeout: 30000
  consumer:
    timeout: 30000
    check: false

# RocketMQ：Outbox 模式投递 order_cancelled
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: cozy-order-producer
    send-message-timeout: 2000
    retry-times-when-send-failed: 1

cozy:
  order:
    timeout-cancel:
      enabled: true
      timeout-minutes: 1
      batch-size: 200
      max-rounds: 5
      scan-interval-ms: 15000
