<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 咖熙咖啡</title>
    <link rel="stylesheet" href="styles/login_style.css">
    <link rel="stylesheet" href="styles/register_style.css">
    <link rel="stylesheet" href="styles/nav.css">
</head>
<body>
      <!-- 导航栏 -->
      <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html#home"><img src="images/cozycafe_logo.png" alt="Logo"></a>
            </div>
            <div class="nav-links">
                <a href="index.html#home">首页</a>
                <a href="index.html#menu">菜单</a>
                <a href="index.html#membership">加入我们</a>
                <a href="about_us.html" >关于我们</a>
            </div>
        </div>
        <div class="nav-buttons">
            <a href="login.html" class="nav-btn login" style="font-size: 18px;"><strong>登录</strong></a>
            <a href="register.html" class="nav-btn register" style="font-size: 18px;"><strong>注册</strong></a>
        </div>
    </nav>

    <div class="login-container">
        <!-- 左侧图片区域 -->
        <div class="login-image">
            <img src="images/login/image.png" alt="咖啡图片">
        </div>

        <!-- 右侧注册区域 -->
        <div class="login-form-container">
            <!-- 注册表单 -->
            <form id="registerForm" class="login-form">
                <h2>注册</h2>

                <!-- 注册方式选择 -->
                <div class="register-type">
                    <button type="button" class="type-btn active" data-type="phone">手机号注册</button>
                    <button type="button" class="type-btn" data-type="email">邮箱注册</button>
                </div>

                <!-- 手机号/邮箱输入框 -->
                <div id="phoneInput" class="input-group">
                    <img src="images/icons/phone.png" alt="手机" class="input-icon">
                    <input type="tel" id="phone" name="phone" placeholder="请输入手机号" required>
                    <button type="button" class="send-code">获取验证码</button>
                </div>

                <div id="emailInput" class="input-group" style="display: none;">
                    <img src="images/icons/email (1).png" alt="邮箱" class="input-icon">
                    <input type="email" id="email" name="email" placeholder="请输入邮箱">
                    <button type="button" class="send-code">获取验证码</button>
                </div>

                <!-- 验证码输入框 -->
                <div class="input-group">
                    <img src="images/icons/verify.png" alt="验证码" class="input-icon">
                    <input type="text"
                           id="verifyCode"
                           placeholder="请输入6位验证码"
                           maxlength="6"
                           pattern="\d{6}"
                           required>
                </div>

                <!-- 密码输入框 -->
                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                    <img src="images/icons/password.png" alt="密码" class="input-icon">
                    <img src="images/icons/eye-close.png" alt="显示密码" class="toggle-password" id="togglePassword">
                    <!-- 添加密码强度指示器 -->
                    <div class="password-strength">
                        <div class="strength-bar"></div>
                        <span class="strength-text"></span>
                    </div>
                </div>

                <!-- 确认密码输入框 -->
                <div class="input-group">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次确认密码" required>
                    <img src="images/icons/password.png" alt="密码" class="input-icon">
                    <img src="images/icons/eye-close.png" alt="显示密码" class="toggle-password" id="toggleConfirmPassword">
                    <!-- 添加密码一致性提示 -->
                    <div class="password-match" style="display: none;">
                        <span class="match-text"></span>
                    </div>
                </div>

                <!-- 用户协议 -->
                <div class="agreement-checkbox">
                    <input type="checkbox" id="agreement" required>
                    <span>
                        我已阅读并同意
                        <a href="#" class="terms-link">《用户协议》</a>
                        和
                        <a href="#" class="privacy-link">《隐私政策》</a>
                    </span>
                </div>

                <!-- 注册按钮 -->
                <button type="submit" class="login-btn">注册</button>

                <!-- 登录链接 -->
                <div class="login-link">
                    已有账号？<a href="login.html">立即登录</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
