brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# broker 注册到 nameserver 的地址 —— ⚠️ 本文件是【生产部署】专用（docker-compose.prod.yml 挂载），
# 服务全在容器里，向彼此通告 compose DNS 名 rocketmq-broker。
#
# 本地开发**不要**改本文件：IDE 里的服务跑在宿主机上，解析不了 rocketmq-broker
# （症状：本地下单 MQ 发送失败、重试约 3s、order_created 发不出去导致管理端收不到 SSE 广播）。
# 本地用专用的 `broker.dev.conf`（brokerIP1=127.0.0.1），由 docker-compose.yml 挂载。
brokerIP1 = rocketmq-broker

# 首次发送自动建 topic，省去手动 mqadmin
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 自动建出来的 topic 用这个队列数（RocketMQ 默认 8）。本系统的隐性不变量是 4 读 4 写
# （E2E ⑤ 断言 readQueueNums=4 / writeQueueNums=4），显式建 topic 时也用 -r 4 -w 4。
# 这里钉住 4，避免"万一走了自动建"时静默变成 8/8。
# 注：只影响【此后新建】的 topic；已存在的 topic 队列数不会改变。
defaultTopicQueueNums = 4
