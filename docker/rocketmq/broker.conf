brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# broker 注册到 nameserver 的地址。
# 本地开发：IDE 跑微服务需要从宿主机连 broker，所以用 127.0.0.1。
# 容器内通信也会走 127.0.0.1，单 broker 场景没问题。
# 若部署到生产/K8s，需改回容器网络可达地址（如 broker-a 或 svc 名）。
brokerIP1 = 127.0.0.1

# 首次发送自动建 topic，省去手动 mqadmin
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
