brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# ⚠️ 本文件是【本地开发】专用（docker-compose.yml 挂载它）。
#
# broker 注册到 nameserver 的地址必须让【客户端】连得上：
#   本地开发：5 个微服务跑在宿主机的 IDE 里，所以必须是宿主机可达的地址 → 127.0.0.1
#            （10911 / 10909 已由 compose 发布到宿主机，故 127.0.0.1 可直连）
#   生产部署：服务全在容器里，向彼此通告的是 compose DNS 名 → 用 broker.conf 里的 rocketmq-broker
#
# 这两个值互相矛盾，无法用一份配置表达，故拆成两个文件：
#   broker.dev.conf  ← 本文件（127.0.0.1，给 docker-compose.yml）
#   broker.conf      ← 生产用（rocketmq-broker，给 docker-compose.prod.yml）
#
# 历史：2026-09-05 `f6e7484`（为修生产容器间可达）把 Shared 的那份改成 rocketmq-broker，
# 结果宿主机解析不了该名字 —— 表现为本地下单 MQ 发送失败、重试 3 次约 3s（支付弹窗延迟），
# 且 order_created 发不出去 → 管理端 SSE 收不到任何广播。改回 127.0.0.1 并拆文件后修复。
brokerIP1 = 127.0.0.1

# 首次发送自动建 topic，省去手动 mqadmin
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 自动建出来的 topic 用这个队列数（RocketMQ 默认 8）。本系统的隐性不变量是 4 读 4 写
# （E2E ⑤ 断言 readQueueNums=4 / writeQueueNums=4），显式建 topic 时也用 -r 4 -w 4。
# 这里钉住 4，避免"万一走了自动建"时静默变成 8/8 —— 那种偏差不会被任何功能报错暴露。
# 注：只影响【此后新建】的 topic；已存在的 topic 队列数不会改变。
defaultTopicQueueNums = 4
