name: ${COMPOSE_PROJECT_NAME:-cozycoffee}

# ====================================================================
# 说明：5 个后端微服务（user/member/order/mall-provider + gateway）已切换到
# IDEA 本地运行，本文件只保留基础设施。
# 需要时把下方对应 service 块的 `# ` 前缀去掉即可恢复 Docker 跑法。
# ====================================================================

services:
  mysql:
    image: mysql:8.0.36
    container_name: cozy-mysql
    restart: unless-stopped
    environment:
      # 生产环境必须通过 MYSQL_ROOT_PASSWORD 环境变量设置强密码，默认值仅用于本地开发
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      MYSQL_INIT_MODE: ${MYSQL_INIT_MODE:-full}
      TZ: ${TIMEZONE:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/00-bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cozy-redis
    restart: unless-stopped
    # 生产环境必须通过 REDIS_PASSWORD 环境变量设置密码，默认无密码仅用于本地开发
    command: ["sh", "-c", "redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 15

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: cozy-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_RAFT_PORT:-9849}:9849"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: cozy-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: cozy-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
      TZ: ${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "10909:10909"

