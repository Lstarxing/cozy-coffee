server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传图片/头像，放宽 body 上限（gateway multipart 10MB，nginx 默认 1MB 会先 413）
    client_max_body_size 15m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # 安全 header
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA 入口不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端容器重启换 IP 时，让 proxy_pass 走 docker 内置 DNS 动态解析，避免 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 反代后端 API
    location /api/ {
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
