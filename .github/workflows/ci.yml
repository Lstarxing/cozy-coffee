# CI for the CozyCoffee monorepo
#
# - Backend: Maven multi-module (Java 17 per cozy-coffee-backend/pom.xml)
# - Frontend: three Vue apps (web / admin / mobile), each runs `npm ci` + `npm test`
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cozy-coffee-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Caches ~/.m2 (dependencies resolved once across runs)
          cache: maven

      - name: Run Maven tests
        # 排除 4 个需要本地基础设施（MySQL/Redis/Dubbo 微服务）的 @SpringBootTest
        # 集成测试：PointsConsistencyTest / PointsFIFOConsistencyTest / OrderFlowBaselineTest / OrderCouponFlowIntegrationTest，
        # 它们依赖 IDE 里运行中的服务，CI 环境无此设施；其余纯单测在此跑
        run: mvn -q -B test -Dtest='!PointsConsistencyTest,!PointsFIFOConsistencyTest,!OrderFlowBaselineTest,!OrderCouponFlowIntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [cozy-coffee-web, cozy-coffee-admin, cozy-coffee-mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          # Each app has its own package-lock.json, so point npm cache at it
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        # 用 npm install 而非 npm ci：web/admin 的 package-lock.json 暂未纳入
        # vitest/jsdom（本机离线环境无法重新生成），等网络恢复后建议重新生成 lock 再切回 npm ci
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
