<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 咖熙咖啡</title>
    <link rel="stylesheet" href="styles/login_style.css">
    <link rel="stylesheet" href="styles/nav.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html#home"><img src="images/cozycafe_logo.png" alt="Logo"></a>
            </div>
            <div class="nav-links">
                <a href="index.html#home">首页</a>
                <a href="index.html#menu">菜单</a>
                <a href="index.html#membership">加入我们</a>
                <a href="about_us.html" >关于我们</a>
            </div>
        </div>
        <div class="nav-buttons">
            <a href="login.html" class="nav-btn login" style="font-size: 18px;"><strong>登录</strong></a>
            <a href="register.html" class="nav-btn register" style="font-size: 18px;"><strong>注册</strong></a>
        </div>
    </nav>
    <div class="login-container">
        
        <!-- 左侧图片区域 -->
        <div class="login-image">
            <img src="images/login/image.png" alt="咖啡图片">
        </div>

        <!-- 右侧登录区域 -->
        <div class="login-form-container">
            <!-- Logo -->
            <div class="logo">
                <img src="images/cozycafe_logo.png" alt="Logo">
            </div>

            <!-- 登录表单 -->
            <form id="loginForm" class="login-form">
                <h2>登录</h2>
                
                <!-- 用户名输入框 -->
                <div class="input-group">
                    <img src="images/icons/user.png" alt="用户" class="input-icon">
                    <input type="text" id="username" name="username" placeholder="请输入手机号码或邮箱账号" required>
                </div>

                <!-- 密码输入框 -->
                <div class="input-group">
                    <img src="images/icons/password.png" alt="密码" class="input-icon">
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>

                <!-- 验证码 -->
                <div class="verify-group">
                    <div class="input-group">
                        <img src="images/icons/verify.png" alt="验证码" class="input-icon">
                        <input type="text" id="verifyCode" placeholder="请输入验证码" required>
                    </div>
                    <canvas id="verifyCanvas"></canvas>
                </div>

                <!-- 记住密码选项 -->
                <div class="remember-forgot">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        <span>记住密码</span>
                    </label>
                    <a href="recoverPassword.html" class="forgot-password">忘记密码？</a>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" class="login-btn">登录</button>

                <!-- 注册链接 -->
                <div class="register-link">
                    还没有账号？<a href="./register.html">立即注册</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/verify.js"></script>
</body>
</html>
